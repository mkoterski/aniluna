/* ========= STORAGE ========= */
const Storage = {
  /**
   * One-time adoption of a save written under an older key name. Runs before
   * the first read and never overwrites data already at the current key.
   * Returns the key it migrated from, or null if there was nothing to do.
   */
  migrate() {
    try {
      if (localStorage.getItem(Config.storageKey) !== null) return null;
      for (const legacy of Config.legacyKeys) {
        const raw = localStorage.getItem(legacy);
        if (raw === null) continue;
        localStorage.setItem(Config.storageKey, raw);
        localStorage.removeItem(legacy);
        return legacy;
      }
    } catch (err) {
      console.warn("Could not migrate saved state:", err);   // private mode / quota
    }
    return null;
  },

  read() {
    try {
      const raw = localStorage.getItem(Config.storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      console.warn("Could not read saved state:", err);
      return null;
    }
  },

  write(state) {
    try {
      localStorage.setItem(Config.storageKey, JSON.stringify(state));
    } catch (err) {
      console.warn("Could not save state:", err);   // private mode / quota
    }
  },

  clear() {
    try {
      localStorage.removeItem(Config.storageKey);
    } catch (err) {
      console.warn("Could not clear state:", err);
    }
  }
};

/* ========= TIME ========= */
const Time = {
  HOUR_MS: 3600000,

  now() {
    return Date.now();
  },

  /** Local calendar day, used for the drinks-today rollover. */
  dayKey(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  },

  /** Fractional local hour, so the sun moves smoothly rather than in steps. */
  hourOfDay(ts = Date.now()) {
    const d = new Date(ts);
    return d.getHours() + d.getMinutes() / 60;
  },

  /** Drives the automatic light and dark switch. */
  isDaytime(ts = Date.now()) {
    const hour = new Date(ts).getHours();
    return hour >= Config.theme.dayStartHour && hour < Config.theme.nightStartHour;
  },

  /**
   * Localised relative time. Intl.RelativeTimeFormat handles the grammar for
   * every locale, so only the sub-minute and never cases need their own copy.
   */
  relative(ts, now, strings) {
    if (!ts) return strings.never;
    const diff = Math.max(0, now - ts);
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return strings.justNow;

    const rtf = new Intl.RelativeTimeFormat(strings.tag, { numeric: "auto" });
    if (mins < 60) return rtf.format(-mins, "minute");
    const hours = Math.floor(mins / 60);
    if (hours < 24) return rtf.format(-hours, "hour");
    return rtf.format(-Math.floor(hours / 24), "day");
  }
};

/* ========= SKY ========= */
const Sky = {
  /**
   * Position of one body on its arc at a given hour, or null when it is not in
   * the sky. Progress runs 0 at rise, 0.5 at peak and 1 at set, interpolated in
   * two halves so an off-centre peak still lands exactly at its stated hour.
   */
  position(arc, hour) {
    let h = hour;
    if (arc.set > 24 && h < arc.rise - 12) h += 24;   // moon, after midnight
    if (h < arc.rise || h > arc.set) return null;

    const progress = h <= arc.peak
      ? 0.5 * (h - arc.rise) / (arc.peak - arc.rise)
      : 0.5 + 0.5 * (h - arc.peak) / (arc.set - arc.peak);

    const { left, right, horizon, apex } = Config.sky;
    return {
      progress,
      x: left + progress * (right - left),
      y: horizon - (horizon - apex) * Math.sin(Math.PI * progress)
    };
  }
};

/* ========= HAPTICS =========
   Two signals, and never the only feedback for anything. Do Not Disturb
   silences vibration outright with no signal to the page, navigator.vibrate
   returning true only means the call was accepted, and iOS Safari has no
   Vibration API at all, so every buzz here doubles something the screen
   already said. Measured in .work/haptics-lab.html. */
const Haptics = {
  enabled: true,             // mirrors State.data.hapticsOn
  suppressNext: false,

  /** Absent on iOS Safari and on desktop Firefox, present with no motor on
      desktop Chrome, which is why presence is not proof of anything. */
  available() {
    return typeof navigator.vibrate === "function";
  },

  reducedMotion() {
    return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  },

  buzz(pattern) {
    /* Consumed even when haptics are off, so a suppression cannot leak into
       the next change and swallow a buzz that should have happened. */
    if (this.suppressNext) {
      this.suppressNext = false;
      return;
    }
    if (!this.enabled || !this.available() || this.reducedMotion()) return;
    if (document.visibilityState !== "visible") return;
    try {
      navigator.vibrate(pattern);
    } catch (err) {
      /* A blocked call is normal, not an error worth reporting to anyone. */
    }
  },

  /** The mood moved. Better is a tick, worse is a buzz. */
  band(improved) {
    this.buzz(improved ? Config.haptics.better : Config.haptics.worse);
  }
};

/* ========= GLITTER =========
   Ported from the prototype in .work/glitter-mode/, whose engine was measured
   rather than guessed: caching each emoji as a sprite instead of calling
   fillText per particle per frame took a 90-particle burst from 0.958 ms to
   0.155 ms a frame. The prototype's own storage and theme-mode machinery is
   deliberately left behind, because this app already owns both.
   Tuning lives in Config.glitter. */

/* Both preferences are live queries, not one-time reads: a 2-in-1 changes
   pointer class when its keyboard folds away, and the motion preference can
   change while the page is open. */
const GlitCaps = {
  motion: window.matchMedia("(prefers-reduced-motion: reduce)"),
  fine:   window.matchMedia("(pointer: fine)"),
  hover:  window.matchMedia("(hover: hover)"),

  get reducedMotion() { return this.motion.matches; },

  /** A mouse or trackpad, as opposed to a finger. */
  get finePointer() { return this.fine.matches && this.hover.matches; },

  /** The trail is the part that makes no sense without a pointer. */
  get trailSupported() {
    return !this.reducedMotion &&
           (!Config.glitter.trail.requiresFinePointer || this.finePointer);
  },

  onChange(fn) {
    [this.motion, this.fine, this.hover].forEach((q) => q.addEventListener("change", fn));
  }
};

/* One offscreen canvas per glyph, blitted after that. fillText on a colour
   emoji re-rasterises from the font on every call, which is what made the
   first burst stutter. */
const GlitSprites = {
  cache: new Map(),

  get(glyph) {
    const hit = this.cache.get(glyph);
    if (hit) return hit;

    const { base, pad } = Config.glitter.sprite;
    const side = base + pad * 2;
    const c = document.createElement("canvas");
    c.width = side;
    c.height = side;

    const g = c.getContext("2d");
    g.font = base + "px " + Config.glitter.emojiFont;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(glyph, side / 2, side / 2);

    this.cache.set(glyph, c);
    return c;
  },

  /** Build every sprite up front so no burst ever pays for rasterising. */
  prewarm() {
    new Set(Config.glitter.glyphs).forEach((glyph) => this.get(glyph));
    return this.cache.size;
  }
};

/* One canvas, one rAF loop, no DOM churn. The loop starts on demand and stops
   itself once the last particle is gone, so an inert theme costs nothing. */
const GlitEngine = {
  canvas: null,
  ctx: null,
  particles: [],
  running: false,
  lastFrame: 0,
  enabled: false,                 // set from the resolved theme in applyTheme
  pointer: { x: 0, y: 0, vx: 0, vy: 0, last: 0, travelled: 0, seen: false },

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.resize();
    GlitSprites.prewarm();
    window.addEventListener("resize", () => this.resize());
  },

  resize() {
    const dpr = Math.min(Config.glitter.canvas.maxDpr, Math.max(1, window.devicePixelRatio || 1));
    this.canvas.width = Math.round(window.innerWidth * dpr);
    this.canvas.height = Math.round(window.innerHeight * dpr);
    this.canvas.style.width = window.innerWidth + "px";
    this.canvas.style.height = window.innerHeight + "px";
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  },

  /** Particles at all: the theme wants them and motion is not reduced. */
  get active() {
    return this.enabled && !GlitCaps.reducedMotion;
  },

  /** The trail specifically, which also needs a pointer to follow. */
  get trailActive() {
    return this.enabled && GlitCaps.trailSupported;
  },

  spawn(x, y, opts) {
    if (!this.active || !this.ctx) return;
    const g = Config.glitter;
    const o = opts || {};
    const now = performance.now();
    const angle = o.angle !== undefined ? o.angle : Math.random() * Math.PI * 2;
    const speed = o.speed !== undefined ? o.speed : 0;
    const between = ([min, max]) => min + Math.random() * (max - min);

    this.particles.push({
      x: x,
      y: y,
      vx: (o.vx || 0) + Math.cos(angle) * speed + between([-g.scatter, g.scatter]),
      vy: (o.vy || 0) + Math.sin(angle) * speed + between([g.riseKick[1], g.riseKick[0]]),
      size: between(g.size),
      sprite: GlitSprites.get(g.glyphs[Math.floor(Math.random() * g.glyphs.length)]),
      rot: Math.random() * Math.PI * 2,
      spin: between(g.spin) * Math.PI / 180,
      phase: Math.random() * Math.PI * 2,
      born: now,
      life: between(g.life)
    });

    /* Cap by dropping the oldest, which are already fading out anyway. */
    const over = this.particles.length - g.trail.maxParticles;
    if (over > 0) this.particles.splice(0, over);

    this.start();
  },

  burst(x, y, count) {
    if (!this.active || count <= 0) return;
    const speed = Config.glitter.burst.speed;
    for (let i = 0; i < count; i++) {
      /* Even angular spread with jitter reads fuller than pure random. */
      const angle = (i / count) * Math.PI * 2 + (Math.random() * 0.5 - 0.25);
      this.spawn(x, y, { angle: angle, speed: speed[0] + Math.random() * (speed[1] - speed[0]) });
    }
  },

  burstFrom(el, count) {
    if (!el) return;
    const box = el.getBoundingClientRect();
    this.burst(box.left + box.width / 2, box.top + box.height / 2, count);
  },

  /** The burst a tap or click earns, which is nothing on a touch screen. */
  tapCount() {
    const burst = Config.glitter.burst;
    return GlitCaps.finePointer ? burst.onClick : burst.onTouchTap;
  },

  trackPointer(ev) {
    const g = Config.glitter;
    const pt = this.pointer;
    const now = performance.now();
    const dt = (now - pt.last) / 1000;

    if (pt.seen) {
      /* Distance always accumulates. A 1000 Hz mouse lands several moves in
         the same millisecond, and gating distance on dt made those vanish,
         which thinned the trail on exactly the fastest hardware. */
      pt.travelled += Math.hypot(ev.clientX - pt.x, ev.clientY - pt.y);
      if (dt > 0 && dt < 0.2) {
        pt.vx = (ev.clientX - pt.x) / dt;
        pt.vy = (ev.clientY - pt.y) / dt;
      }
    }
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    pt.last = now;
    pt.seen = true;

    if (!this.trailActive) return;
    if (pt.travelled < g.trail.minDistance) return;
    pt.travelled = 0;

    const span = g.trail.perSpawn;
    const count = span[0] + Math.floor(Math.random() * (span[1] - span[0] + 1));
    for (let i = 0; i < count; i++) {
      this.spawn(pt.x, pt.y, { vx: pt.vx * g.inheritPointer, vy: pt.vy * g.inheritPointer });
    }
  },

  start() {
    if (this.running) return;
    this.running = true;
    this.lastFrame = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  },

  clear() {
    this.particles.length = 0;
    if (this.ctx) this.ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  },

  frame(now) {
    const g = Config.glitter;
    /* Clamp dt so a backgrounded tab does not teleport every particle off
       screen the moment it comes back. */
    const dt = Math.min(0.05, Math.max(0, (now - this.lastFrame) / 1000));
    this.lastFrame = now;

    const ctx = this.ctx;
    const drag = Math.pow(g.drag, dt * 60);
    const spriteScale = (g.sprite.base + g.sprite.pad * 2) / g.sprite.base;

    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    const alive = [];
    for (const pcl of this.particles) {
      const age = now - pcl.born;
      const t = age / pcl.life;
      if (t >= 1) continue;

      pcl.vy += g.gravity * dt;
      pcl.vx *= drag;
      pcl.vy *= drag;
      pcl.x += pcl.vx * dt;
      pcl.y += pcl.vy * dt;
      pcl.rot += pcl.spin * dt;

      if (pcl.y - pcl.size > window.innerHeight) continue;

      const fade = t < g.fadeFrom ? 1 : 1 - (t - g.fadeFrom) / (1 - g.fadeFrom);
      const pop = Math.min(1, age / g.popIn);
      const twinkle = 1 + g.twinkle.amp *
        Math.sin(age / 1000 * g.twinkle.rate * Math.PI * 2 + pcl.phase);
      const draw = pcl.size * pop * twinkle * spriteScale;

      ctx.save();
      ctx.globalAlpha = fade;
      ctx.translate(pcl.x, pcl.y);
      ctx.rotate(pcl.rot);
      ctx.drawImage(pcl.sprite, -draw / 2, -draw / 2, draw, draw);
      ctx.restore();

      alive.push(pcl);
    }
    this.particles = alive;

    if (this.particles.length > 0) requestAnimationFrame((t) => this.frame(t));
    else this.running = false;
  }
};

/* ========= AUDIO ========= */
const Audio_ = {
  ctx: null,
  enabled: true,
  voice: Config.species[Config.defaultSpecies].voice,

  setVoice(voice) {
    this.voice = voice;
  },

  /** Must run inside a user gesture: mobile browsers block audio otherwise. */
  unlock() {
    if (!this.enabled) return;
    try {
      if (!this.ctx) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return;
        this.ctx = new Ctor();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (err) {
      console.warn("Audio unavailable:", err);
      this.ctx = null;
    }
  },

  ready() {
    return this.enabled && this.ctx && this.ctx.state === "running";
  },

  /** One short synthesised tone with a soft envelope, in the current voice. */
  tone({ freq = 440, to = null, start = 0, dur = 0.16, gain = 0.13, type = null, filter = null }) {
    if (!this.ready()) return;
    const ctx = this.ctx;
    const v = this.voice;
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();

    osc.type = type || v.wave;
    osc.frequency.setValueAtTime(freq * v.pitch, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to * v.pitch, t0 + dur);

    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + Math.min(0.03, dur / 3));
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    let node = osc;
    const cutoff = filter || v.filter;
    if (cutoff) {
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = cutoff;
      node.connect(lp);
      node = lp;
    }
    node.connect(amp).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },

  /** Filtered noise burst, the "water" texture of a sip. */
  noise({ start = 0, dur = 0.12, gain = 0.06, freq = 1400 }) {
    if (!this.ready()) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + start;
    const frames = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frames; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;

    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = freq;
    bp.Q.value = 1.1;

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(gain, t0);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(bp).connect(amp).connect(ctx.destination);
    src.start(t0);
  },

  sip() {
    for (let i = 0; i < 3; i++) {
      const at = i * 0.11;
      this.noise({ start: at, dur: 0.09, gain: 0.05, freq: 1100 + i * 260 });
      this.tone({ freq: 340 + i * 90, to: 620 + i * 110, start: at, dur: 0.09, gain: 0.07 });
    }
  },

  /** Rising arpeggio for the unicorn, a low pleased rumble for the dinosaur. */
  cheer() {
    const notes = [523.25, 659.25, 783.99, 1046.5];   // C E G C
    notes.forEach((f, i) => {
      this.tone({ freq: f, start: i * 0.075, dur: 0.15, gain: 0.09 });
    });
    this.tone({ freq: 1318.5, start: 0.32, dur: 0.22, gain: 0.06 });
    if (this.voice.pitch < 1) {
      this.noise({ start: 0.05, dur: 0.3, gain: 0.035, freq: 420 });   // a bit of roar
    }
  },

  sad() {
    this.tone({ freq: 392, to: 233, dur: 0.5, gain: 0.08, filter: 900 });
  },

  gurgle() {
    const base = this.voice.gurgleBase;
    for (let i = 0; i < 7; i++) {
      const at = i * 0.075;
      const f = base + (i % 3) * 55;
      this.tone({ freq: f * 2.1, to: f, start: at, dur: 0.11, gain: 0.1, filter: 700 });
      this.noise({ start: at + 0.01, dur: 0.06, gain: 0.03, freq: 400 });
    }
  },

  /** Short whoosh when the species changes. */
  morph() {
    this.tone({ freq: 220, to: 880, dur: 0.28, gain: 0.07 });
    this.noise({ start: 0.02, dur: 0.22, gain: 0.04, freq: 900 });
  }
};

/* ========= AMBIENT ========= */
/* Rare decorative life. Each kind schedules itself, spawns one element that
   crosses the scene and removes itself, then schedules the next. Nothing is
   scheduled while the tab is hidden or when reduced motion is requested, so a
   backgrounded page cannot accumulate nodes. */
const Ambient = {
  timers: {},
  host: null,

  KINDS: {
    bird: {
      band: [6, 42],             // vertical band, percent from the top
      size: [16, 27],            // a flock needs room; each bird is a few percent
      dur: [9000, 15000],
      opacity: [0.5, 0.75],
      /* Distant gulls in the Link's Awakening idiom, read off the frames the
         requester supplied: a loose flock of stepped pixel marks that flap by
         swapping frames, because a sprite flaps by changing frames and not by
         rotating. Three poses, and the span changes with the beat as well as
         the height: wings raised is a wide bowl, wings lowered a narrow peak.
         A fixed span only ever reads as a dash bending. Built per appearance,
         so no two flocks match. */
      markup: () => {
        const count = 3 + Math.floor(Math.random() * 3);        // 3 to 5 gulls
        /* All three poses are registered on the body row, y 3, so the wings
           beat around a body that holds still. Registered on the top edge, as
           they were before v0.31, the body itself travelled from y 3 to y 0
           across the cycle while the tips barely moved, which reads as the
           whole bird lurching rather than flapping. Tips now sit 3 above the
           body, then 1 above, then 2 below. */
        const up   = [[0,0],[1,1],[2,2],[3,3],[4,3],[5,2],[6,1],[7,0]];
        const mid  = [[1,2],[2,3],[3,3],[4,3],[5,3],[6,2]];
        const down = [[1,5],[2,4],[3,3],[4,3],[5,4],[6,5]];
        const pose = (cls, cells) => `<g class="pose ${cls}">`
          + cells.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1"/>`).join("")
          + "</g>";

        let flock = "";
        for (let i = 0; i < count; i++) {
          const x = Math.round(Math.random() * 42);
          const y = Math.round(Math.random() * 10);
          /* A negative delay starts each gull part-way into the cycle, so a
             flock does not beat in unison. */
          const phase = -(Math.random() * 0.7).toFixed(2);
          /* Size varies per gull, which is depth: the reference has near ones
             large and high with small ones creeping along near the horizon. */
          const depth = (0.7 + Math.random() * 0.6).toFixed(2);
          flock += `<g transform="translate(${x} ${y}) scale(${depth})" style="--phase:${phase}s">`
            + pose("pose-up", up) + pose("pose-mid", mid) + pose("pose-down", down)
            + "</g>";
        }
        return '<svg viewBox="0 0 50 18" shape-rendering="crispEdges" aria-hidden="true">'
          + flock + "</svg>";
      }
    },
    /* The reward for a full meter after dark, in place of the rainbow. */
    star: {
      band: [7, 32],             // high in the sky, clear of the character
      size: [13, 22],
      dur: [1100, 1800],         // a streak, not a drift
      opacity: [0.8, 1],
      fall: [26, 46],            // drop across the crossing, percent of the scene
      when: () => UI.isRadiant() && UI.effectiveTheme() === "night",
      markup: () =>
        '<svg viewBox="0 0 40 14" aria-hidden="true">'
        + '<path d="M2 2 L29 9.4"/>'
        + '<circle cx="33" cy="10.6" r="2.4"/>'
        + "</svg>"
    },
    wind: {
      band: [10, 64],            // the whole sky, not just behind the character
      size: [22, 38],            // a trail that loops needs the room
      dur: [8000, 13000],
      opacity: [0.6, 0.9],       // a hairline needs the help on a pale sky
      /* One trail per gust, from the frames the requester supplied: a hairline
         that travels along its own path, sweeping in from the left and curling
         into an open loop at the head, with a few specks alongside. Two paths
         on the same geometry, a short bright core and a longer faint tail, are
         what give it a comet's weight without a taperable stroke. */
      markup: () => {
        const speck = (x, y, r) => `<circle class="speck" cx="${x}" cy="${y}" r="${r}"/>`;
        return '<svg viewBox="0 0 120 56" aria-hidden="true">'
          + '<path class="trail tail" pathLength="100" d="M2 40 C28 36 56 29 80 24 C95 20.8 108 23 108 31 C108 39 97 42 91 36 C85 30 92 23 101 23.6"/>'
          + '<path class="trail core" pathLength="100" d="M2 40 C28 36 56 29 80 24 C95 20.8 108 23 108 31 C108 39 97 42 91 36 C85 30 92 23 101 23.6"/>'
          + speck(22, 14, 0.9) + speck(58, 47, 0.7) + speck(96, 9, 0.8)
          + "</svg>";
      }
    }
  },

  enabled() {
    return !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  },

  /** Current interval range for a kind, or null if it should not appear now. */
  rateFor(kind) {
    const spec = this.KINDS[kind];
    if (spec.when && !spec.when()) return null;
    const rates = Config.ambient[kind];
    if (!rates) return null;
    /* `any` means the rate does not depend on the time of day, because `when`
       already decides when the kind may appear at all. */
    if (rates.any) return rates.any;
    return rates[Time.isDaytime() ? "day" : "night"];
  },

  /**
   * Entering the reward state has to nudge the star's timer. The idle
   * re-check below is a minute out, and a reward window can be shorter than
   * that, so waiting for it would spend most of the window empty.
   */
  nudgeStar() {
    const eligible = !!this.rateFor("star");
    if (eligible && !this.starEligible) {
      this.schedule("star", this.between(Config.ambient.star.first));
    }
    this.starEligible = eligible;
  },

  between([min, max]) {
    return min + Math.random() * (max - min);
  },

  start(host) {
    this.host = host || this.host;
    this.starEligible = false;
    Object.keys(this.KINDS).forEach((kind) => this.schedule(kind));
    this.nudgeStar();          // a load into a rewarded night gets one soon
  },

  stop() {
    Object.keys(this.timers).forEach((kind) => clearTimeout(this.timers[kind]));
    this.timers = {};
    this.starEligible = false;      // so a return to a rewarded night nudges again
  },

  /** Re-checks the rate every time, so dusk changes the rhythm on its own. */
  schedule(kind, firstDelay = null) {
    clearTimeout(this.timers[kind]);
    if (!this.enabled()) return;

    const rate = this.rateFor(kind);
    /* Not this time of day: look again later rather than stopping for good. */
    const delay = firstDelay !== null ? firstDelay
                : rate ? this.between(rate)
                : 60000;

    this.timers[kind] = setTimeout(() => {
      if (this.rateFor(kind) && document.visibilityState === "visible") {
        this.spawn(kind);
      }
      this.schedule(kind);
    }, delay);
  },

  spawn(kind) {
    if (!this.host || !this.enabled()) return;
    const spec = this.KINDS[kind];

    const el = document.createElement("div");
    el.className = `amb ${kind}`;
    /* Every appearance picks its own direction, both kinds alike. */
    if (Math.random() < 0.5) el.classList.add("rtl");
    el.style.top = `${this.between(spec.band)}%`;
    el.style.width = `${this.between(spec.size)}%`;
    el.style.setProperty("--dur", `${Math.round(this.between(spec.dur))}ms`);
    if (spec.fall) {
      /* Percent of the scene height, resolved here rather than in CSS: a
         translateY percentage resolves against the element's own height, which
         is a fifth of the drop wanted, so the streak came out near-horizontal.
         A host with no layout yet would compute 0 and fly the streak dead
         flat, so in that case the keyframe's own fallback is left to stand. */
      const height = this.host.clientHeight;
      if (height > 0) {
        const drop = height * this.between(spec.fall) / 100;
        el.style.setProperty("--fall", `${Math.round(drop)}px`);
      }
    }
    el.style.setProperty("--amb-op", this.between(spec.opacity).toFixed(2));

    const flip = document.createElement("span");
    flip.className = "amb-flip";
    const bob = document.createElement("span");
    bob.className = "amb-bob";
    bob.style.setProperty("--bob", `${(2.6 + Math.random() * 2).toFixed(2)}s`);
    if (kind === "bird") {
      bob.style.setProperty("--flap", `${(0.5 + Math.random() * 0.4).toFixed(2)}s`);
      /* The vertical run across the crossing, up or down, as a share of the
         scene rather than of the element: same reason as the star's --fall. */
      const height = this.host.clientHeight;
      if (height > 0) {
        const run = height * (Math.random() * 0.3 - 0.19);
        el.style.setProperty("--glide", `${Math.round(run)}px`);
      }
    }
    if (kind === "wind") {
      /* Sway and flow rate vary per gust, so two on screen at once do not move
         as one. Custom properties inherit, so setting them here reaches the
         svg and its ribbons. */
      bob.style.setProperty("--sway", `${(3.4 + Math.random() * 2.2).toFixed(2)}s`);
      bob.style.setProperty("--flow", `${(2.1 + Math.random() * 1.6).toFixed(2)}s`);
    }
    bob.innerHTML = spec.markup();

    flip.appendChild(bob);
    el.appendChild(flip);
    el.addEventListener("animationend", (e) => {
      if (e.target === el) el.remove();
    });
    this.host.appendChild(el);
    return el;
  }
};

/* ========= STATE ========= */
const State = {
  data: null,

  defaults() {
    const now = Time.now();
    return {
      hydration: Config.hydration.initial,
      lastUpdateAt: now,
      lastDrinkAt: null,
      todayCount: 0,
      dayKey: Time.dayKey(now),
      decayHours: Config.hydration.defaultDecayHours,
      refillAmount: Config.hydration.defaultRefillAmount,
      goalTaps: Config.goal.defaultTaps,
      soundOn: true,
      easterEggOn: true,
      hapticsOn: true,
      themeMode: "auto",              // "auto" | "day" | "night" | "glitter"
      species: Config.defaultSpecies,
      /* What the settings picker chose, which is where the secret switch
         returns to. Kept apart from the active species so the switch can be a
         detour rather than a third setting. */
      pickedSpecies: Config.defaultSpecies,
      names: {},                      // species key -> owner's name, if any
      locale: Config.defaultLocale,
      tapHistory: []
    };
  },

  /**
   * Number coercion that treats null, undefined and "" as absent rather than
   * as zero, which is what Number() would do.
   */
  num(value, fallback) {
    if (value === null || value === undefined || value === "") return fallback;
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  },

  /** Clamp into range and snap onto the slider step, tolerating junk input. */
  clampStep(value, fallback, { min, max, step }) {
    const n = this.num(value, null);
    if (n === null) return fallback;
    const clamped = Math.min(max, Math.max(min, n));
    const snapped = min + Math.round((clamped - min) / step) * step;
    return Math.round(snapped * 100) / 100;      // drop floating point dust
  },

  /**
   * Trim, collapse inner runs of whitespace, cap at the configured length.
   * Returns "" for anything absent or not a string, which is what the callers
   * read as "no custom name".
   */
  cleanName(value) {
    if (typeof value !== "string") return "";
    /* Cap by code point rather than by UTF-16 unit: slicing mid-surrogate
       would leave half an emoji behind. Only a hand-edited save can reach
       that, since the input caps the field itself, but it renders as a
       replacement glyph when it does. */
    const clean = value.trim().replace(/\s+/g, " ");
    return Array.from(clean).slice(0, Config.naming.maxLength).join("");
  },

  /**
   * Custom names are held per species, so each creature keeps its own. Keys
   * outside Config.species and values that clean to nothing are dropped rather
   * than repaired, so a junk save falls back to the built-in names.
   */
  cleanNames(value) {
    const out = {};
    if (!value || typeof value !== "object") return out;
    Object.keys(Config.species).forEach((key) => {
      const clean = this.cleanName(value[key]);
      if (clean) out[key] = clean;
    });
    return out;
  },

  oneOf(value, allowed, fallback) {
    return allowed.includes(value) ? value : fallback;
  },

  /** Merge saved data over defaults so old or partial saves never break startup. */
  load() {
    const base = this.defaults();
    const saved = Storage.read();
    if (!saved || typeof saved !== "object") {
      this.data = base;
      return this.data;
    }
    const now = Time.now();

    /* Saves written before v0.15 carry `theme` instead of `themeMode`. Treat
       the old value as an explicit choice rather than discarding it. */
    const legacyTheme = this.oneOf(saved.theme, ["day", "night"], null);

    this.data = {
      ...base,
      ...saved,
      hydration: Math.min(
        Config.hydration.max,
        Math.max(0, this.num(saved.hydration, base.hydration))
      ),
      lastUpdateAt: this.num(saved.lastUpdateAt, now),
      lastDrinkAt: this.num(saved.lastDrinkAt, null),
      todayCount: Math.max(0, Math.round(this.num(saved.todayCount, 0))),
      dayKey: typeof saved.dayKey === "string" ? saved.dayKey : base.dayKey,
      decayHours: this.clampStep(saved.decayHours, base.decayHours, Config.limits.decayHours),
      refillAmount: this.clampStep(saved.refillAmount, base.refillAmount, Config.limits.refillAmount),
      goalTaps: this.clampStep(saved.goalTaps, base.goalTaps, Config.limits.goalTaps),
      soundOn: saved.soundOn !== false,
      easterEggOn: saved.easterEggOn !== false,
      hapticsOn: saved.hapticsOn !== false,
      themeMode: this.oneOf(saved.themeMode, Config.themes.order, legacyTheme || base.themeMode),
      species: this.oneOf(saved.species, Object.keys(Config.species), base.species),
      pickedSpecies: this.oneOf(saved.pickedSpecies, PICKABLE, base.pickedSpecies),
      names: this.cleanNames(saved.names),
      locale: this.oneOf(saved.locale, Config.locales, base.locale),
      tapHistory: Array.isArray(saved.tapHistory) ? saved.tapHistory.filter(Number.isFinite) : []
    };
    delete this.data.theme;
    return this.data;
  },

  save() {
    Storage.write(this.data);
  },

  /**
   * Timestamp-driven decay. This, not any interval, is the source of truth,
   * so closing the tab, sleeping the phone or killing the browser all work out.
   * Returns how many points were lost since the last sync.
   */
  sync(now = Time.now()) {
    const s = this.data;
    const elapsed = Math.max(0, now - s.lastUpdateAt);
    const perMs = Config.hydration.max / (s.decayHours * Time.HOUR_MS);
    const lost = elapsed * perMs;

    s.hydration = Math.max(0, s.hydration - lost);
    s.lastUpdateAt = now;
    this.rollDay(now);
    return lost;
  },

  rollDay(now) {
    const key = Time.dayKey(now);
    if (key !== this.data.dayKey) {
      this.data.dayKey = key;
      this.data.todayCount = 0;
    }
  },

  /**
   * Bands are compared against the rounded percent, the same number the meter
   * shows. Comparing the raw float instead lets a meter reading exactly 75%
   * sit in the okay band, because the underlying value is 74.997.
   */
  band(hydration = this.data.hydration) {
    const pct = Math.round(hydration);
    const t = Config.thresholds;
    if (pct >= t.hydrated) return "hydrated";
    if (pct >= t.okay) return "okay";
    if (pct >= t.thirsty) return "thirsty";
    return "dehydrated";
  },

  /** Higher index = worse. Used to detect mood improvements. */
  bandRank(band) {
    return BANDS.indexOf(band);
  },

  drink(now = Time.now()) {
    const before = this.band();
    this.sync(now);

    const s = this.data;
    s.hydration = Math.min(Config.hydration.max, s.hydration + s.refillAmount);
    s.lastDrinkAt = now;
    s.todayCount += 1;

    const burst = this.registerTap(now);
    const after = this.band();

    this.save();
    return { before, after, improved: this.bandRank(after) < this.bandRank(before), burst };
  },

  /** Five taps inside a rolling five-second window trigger the easter egg. */
  registerTap(now) {
    const s = this.data;
    s.tapHistory = s.tapHistory.filter((ts) => now - ts <= Config.burst.windowMs);
    s.tapHistory.push(now);
    const triggered = s.easterEggOn && s.tapHistory.length >= Config.burst.taps;
    if (triggered) s.tapHistory = [];
    return triggered;
  },

  reset(now = Time.now()) {
    const s = this.data;
    s.hydration = Config.hydration.max;
    s.todayCount = 0;
    s.tapHistory = [];
    s.lastUpdateAt = now;
    s.lastDrinkAt = now;
    s.dayKey = Time.dayKey(now);
    this.save();
  },

  /**
   * Rename the creature currently on screen. An empty entry deletes the
   * override instead of storing a blank, which is what restores the built-in
   * name. Returns the name that was actually kept.
   */
  setName(raw) {
    const clean = this.cleanName(raw);
    const names = { ...this.data.names };
    if (clean) names[this.data.species] = clean;
    else delete names[this.data.species];
    this.set({ names });
    return clean;
  },

  /** Choose a creature from the settings. Remembered, so the switch can undo. */
  pickSpecies(key) {
    if (!PICKABLE.includes(key)) return;
    this.set({ species: key, pickedSpecies: key });
  },

  /**
   * The footer switch, and the only way to the secret creature. It is a
   * detour rather than a cycle: pressing it again returns to whatever the
   * settings picked, so the switch cannot strand anyone on a creature the
   * settings do not offer.
   */
  toggleSecret() {
    const next = this.data.species === SECRET_SPECIES
      ? this.data.pickedSpecies
      : SECRET_SPECIES;
    this.set({ species: next });
    return next;
  },

  set(patch) {
    Object.assign(this.data, patch);
    this.save();
  }
};

/* ========= UI ========= */
const UI = {
  el: {},
  lastBand: null,
  speechLock: 0,

  cache() {
    const ids = [
      "appTitle", "infoBtn", "infoCard", "infoBody", "infoTip", "soundBtn",
      "themes", "themesLabel", "themeStatus", "trailNotice", "glitCanvas",
      "scene", "sceneCaption", "speech", "drops",
      "moodLine", "lastLine",
      "tube", "tubeFill", "tubeNum", "pips", "pipsCount",
      "drinkBtn", "drinkLabel", "resetBtn", "resetLabel",
      "sheet", "sheetTitle", "sheetClose", "settingsBtn", "soundIcon",
      "grpLook", "grpGoal", "grpBehaviour",
      "goalLabel", "goalHint", "goalVal", "goalUp", "goalDown", "langLabel",
      "langDe", "langEn", "langZh",
      "decayInput", "decayOut", "decayScale", "decayLabel",
      "refillInput", "refillOut", "refillScale", "refillLabel",
      "soundInput", "soundLabel", "eggInput", "eggLabel",
      "hapticsInput", "hapticsLabel", "hapticsRow",
      "settingsFoot", "note", "secretBtn", "favicon", "sun", "moon", "ambient",
      "clouds", "meadow", "fireflies",
      "nameLabel", "nameInput", "creature", "creatureLabel"
    ];
    ids.forEach((id) => { this.el[id] = document.getElementById(id); });
  },

  /** Current locale strings. */
  t() {
    return Strings[State.data.locale] || Strings[Config.defaultLocale];
  },

  species() {
    return Config.species[State.data.species];
  },

  /**
   * A full meter in a lit sky earns a few seconds of stars. Kept as a timer
   * rather than as a threshold because the requester asked for the moment the
   * meter reaches 100, not for every minute it happens to read high, and the
   * meter starts falling again immediately.
   */
  celebrateDayStars() {
    this.el.scene.dataset.daystars = "on";
    clearTimeout(this.dayStarsTimer);
    this.dayStarsTimer = setTimeout(() => {
      this.el.scene.dataset.daystars = "off";
    }, Config.ui.dayStarsMs);
  },

  /** True while the meter earns its reward: a rainbow by day, a star by night. */
  isRadiant() {
    return this.el.scene.dataset.radiant === "on";
  },

  /** The name in use: the owner's for this creature, else the built-in one. */
  name() {
    return State.data.names[State.data.species] || this.species().name;
  },

  /**
   * One string, two consumers: the accessible name and the hover tooltip.
   * Writing both from one call is what stops the visible label and the
   * spoken one from drifting apart as the copy changes.
   */
  label(el, text) {
    el.setAttribute("aria-label", text);
    el.dataset.tip = text;
  },

  pick(list) {
    return list[Math.floor(Math.random() * list.length)];
  },

  /** Every user-facing string is written here, from Strings plus Config. */
  applyText() {
    const t = this.t();
    const sp = this.species();
    const name = this.name();

    document.documentElement.lang = t.tag;      // zh-TW, not zh
    document.title = `${name} ${t.titleSuffix}`;
    this.el.appTitle.textContent = `${name} ${t.titleSuffix}`;
    this.el.sceneCaption.textContent = t.caption(name, t.speciesWord[State.data.species]);

    // The label is a span beside the icon, so writing to the button itself
    // would wipe the icon on every locale change.
    this.el.drinkLabel.textContent = t.drink;
    this.el.drinkBtn.setAttribute("aria-label", t.drinkAria(name));
    this.el.resetLabel.textContent = t.reset;
    this.el.resetBtn.setAttribute("aria-label", t.resetAria(name));

    this.el.sheetTitle.textContent = t.settings;
    this.label(this.el.settingsBtn, t.settings);
    this.el.sheetClose.setAttribute("aria-label", t.sheetClose);
    this.el.grpLook.textContent = t.grpLook;
    this.el.grpGoal.textContent = t.grpGoal;
    this.el.grpBehaviour.textContent = t.grpBehaviour;
    this.el.goalLabel.textContent = t.goalLabel;
    this.el.goalHint.textContent = t.goalHint;
    this.el.goalUp.setAttribute("aria-label", t.goalUp);
    this.el.goalDown.setAttribute("aria-label", t.goalDown);
    this.el.nameLabel.textContent = t.nameSetting;
    this.el.nameInput.placeholder = sp.name;      // the built-in name, as the way back
    this.el.creatureLabel.textContent = t.creature;
    this.renderCreatures();
    this.el.langLabel.textContent = t.language;
    this.el.decayLabel.textContent = t.fullToEmpty;
    this.el.refillLabel.textContent = t.refill;
    this.el.soundLabel.textContent = t.sound;
    this.el.eggLabel.textContent = t.egg;
    this.el.hapticsLabel.textContent = t.haptics;
    this.el.themesLabel.textContent = t.themesLabel;
    this.renderThemes();
    this.el.settingsFoot.textContent = t.settingsFoot(name);

    this.el.note.textContent = t.note(Config.app.version);
    this.label(this.el.infoBtn, t.infoAria);
    this.el.infoBody.textContent = t.infoBody(name);
    this.el.infoTip.textContent = t.infoTip;
    /* Accessible name only, deliberately no tooltip: a hover label that reads
       "secret switch" is not a secret. A focusable button still needs a name,
       so assistive tech is told what it is; the trade is that the secret is
       kept from a mouse rather than from everyone. */
    this.el.secretBtn.setAttribute("aria-label", t.secretAria);
    this.el.secretBtn.removeAttribute("data-tip");

    Config.locales.forEach((loc) => {
      const btn = this.el["lang" + loc[0].toUpperCase() + loc.slice(1)];
      if (btn) btn.setAttribute("aria-pressed", String(loc === State.data.locale));
    });

    this.applyTheme();
    this.applySound();
    this.renderSettingsValues();
  },

  /** Species affects the sprite shown, the favicon and the sound voice. */
  applySpecies() {
    const sp = this.species();
    this.el.scene.dataset.species = State.data.species;
    document.querySelectorAll("#scene .pet").forEach((pet) => {
      const mine = pet.dataset.species === State.data.species;
      if (mine) pet.removeAttribute("hidden");
      else pet.setAttribute("hidden", "");
    });
    this.markCreatures();
    Audio_.setVoice(sp.voice);
    this.el.favicon.href =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'"
      + "%3E%3Ctext x='50' y='50' dy='.35em' font-size='84' text-anchor='middle'%3E"
      + encodeURIComponent(sp.emoji) + "%3C/text%3E%3C/svg%3E";
  },

  /** Slider bounds and their tick labels both come from Config. */
  applyLimits() {
    const locale = Strings[State.data.locale].tag;
    this.el.nameInput.maxLength = Config.naming.maxLength;
    const apply = (input, scale, limit, format) => {
      input.min = limit.min;
      input.max = limit.max;
      input.step = limit.step;

      const stops = [];
      for (let v = limit.min; v <= limit.max + 1e-9; v += limit.step) {
        stops.push(Math.round(v * 100) / 100);
      }
      /* Label every stop when there are few of them, otherwise just the ends. */
      const shown = stops.length > 4 ? [stops[0], stops[stops.length - 1]] : stops;
      scale.textContent = "";
      shown.forEach((v) => {
        const span = document.createElement("span");
        span.textContent = format(v);
        scale.appendChild(span);
      });
    };
    apply(this.el.decayInput, this.el.decayScale, Config.limits.decayHours,
          (v) => v.toLocaleString(locale, { minimumFractionDigits: 1 }));
    apply(this.el.refillInput, this.el.refillScale, Config.limits.refillAmount,
          (v) => `${v.toLocaleString(locale)}%`);
  },

  /** Reads straight from the inputs so the labels track a finger mid-drag. */
  renderSettingsValues() {
    const t = this.t();
    this.el.decayOut.textContent = t.hours(Number(this.el.decayInput.value), t.tag);
    this.el.refillOut.textContent = `${Number(this.el.refillInput.value).toLocaleString(t.tag)}%`;
  },

  /** Speech changes on events and band changes, not on every clock refresh. */
  say(text, lockMs = 2600) {
    this.el.speech.textContent = text;
    this.el.speech.style.animation = "none";
    void this.el.speech.offsetWidth;          // restart the pop animation
    this.el.speech.style.animation = "";
    this.speechLock = Time.now() + lockMs;
  },

  bandSpeech(band = State.band()) {
    return this.pick(this.t().speech[State.data.species][band]);
  },

  render() {
    const s = State.data;
    const t = this.t();
    const now = Time.now();
    const pct = Math.round(s.hydration);
    const band = State.band();

    this.el.scene.dataset.band = band;
    this.el.scene.dataset.radiant = pct >= Config.thresholds.reward ? "on" : "off";
    Ambient.nudgeStar();       // the star is gated on this state, so it reacts here
    this.renderTube(pct, band);
    this.renderPips(s.todayCount, s.goalTaps);
    this.el.moodLine.textContent = t.mood[band];
    this.el.goalVal.textContent = String(s.goalTaps);
    this.el.lastLine.textContent = `${t.lastDrink}: ${Time.relative(s.lastDrinkAt, now, t)}`;

    if (band !== this.lastBand) {
      /* Not on the very first render: a fresh load has no previous band, and
         arriving to a buzz would be startling rather than informative. */
      if (this.lastBand !== null) {
        Haptics.band(State.bandRank(band) < State.bandRank(this.lastBand));
      }
      /* The speech has its own lock, the buzz does not: one is a sentence
         competing for the bubble, the other is a nudge. */
      if (now >= this.speechLock) this.say(this.bandSpeech(band), 1200);
    }
    this.lastBand = band;
  },

  /** Resolves themeMode against the clock, so "auto" follows the time of day. */
  effectiveTheme() {
    const mode = State.data.themeMode;
    if (mode !== "auto") return mode;          // day, night or glitter
    return Time.isDaytime() ? "day" : "night";
  },

  /**
   * Which sky the resolved theme is: glitter is a lit one, so it keeps the sun
   * and the rainbow and leaves the moon, the starfield and the shooting star
   * to the dark. Without this the sky would simply empty out in glitter,
   * because every gate asks for "day" or "night" by name.
   */
  skyTheme() {
    return this.effectiveTheme() === "night" ? "night" : "day";
  },

  /**
   * Builds the theme pill. Four modes, so it is a radiogroup rather than a
   * switch, and the icon is decorative while the accessible name carries the
   * meaning. Rebuilt on a locale change, which is why it is here and not in
   * applyTheme.
   */
  /* The tube replaces the bar. aria-valuetext keeps reporting the value AND
     the mood, which the brief requires of the meter, and the label carries the
     creature's name the way the old sr-only label did. */
  renderTube(pct, band) {
    const t = this.t();
    const p = Math.round(pct);
    this.el.tubeFill.style.height = `${p}%`;
    this.el.tubeNum.textContent = `${p}%`;
    this.el.tube.dataset.low = p < 14 ? "yes" : "no";
    this.el.tube.setAttribute("aria-valuenow", String(p));
    this.el.tube.setAttribute("aria-valuetext", `${p}%, ${t.mood[band]}`);
    this.el.tube.setAttribute("aria-label", t.meterAria(this.name()));
  },

  /* One pip per tap. Past the goal it keeps counting in a second tone rather
     than stopping, because a day that beats the goal is not an error. The row
     is one image with one name, not N unlabelled divs. */
  renderPips(count, goal) {
    const slots = Math.max(goal, count);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < slots; i++) {
      const pip = document.createElement("div");
      pip.className = "pip";
      if (i < count) pip.dataset.on = "yes";
      if (i >= goal) pip.dataset.extra = "yes";
      frag.append(pip);
    }
    this.el.pips.replaceChildren(frag);
    this.el.pipsCount.textContent = `${count} / ${goal}`;
    this.el.pips.setAttribute("aria-label", this.t().pipsAria(count, goal));
    if (this.el.pips.dataset.goal !== "met" || count < goal) {
      this.el.pips.dataset.goal = count >= goal ? "met" : "open";
    }
  },

  /* Fires once per day, on the tap that reaches the goal. Separate from the
     meter rewards, which are gated on the displayed percent rather than on the
     count. quiet is passed when this same tap already earns a sound of its
     own: doubling the cheer or the buzz reads as a glitch, so the goal keeps
     only the pip animation, which is the moment it owns. */
  celebrateGoal(quiet) {
    this.el.pips.dataset.goal = "met";
    if (quiet) return;
    setTimeout(() => Audio_.cheer(), 260);
    Haptics.buzz(Config.haptics.better);
  },

  /* <dialog> owns Esc, the backdrop and the focus trap where showModal exists.
     Where it does not, the sheet degrades to a panel with a drawn scrim:
     nothing is trapped, but nothing is unreachable either. */
  openSheet() {
    const d = this.el.sheet;
    this.el.settingsBtn.setAttribute("aria-expanded", "true");
    if (typeof d.showModal === "function") { d.showModal(); return; }
    d.classList.add("is-fallback");
    d.setAttribute("open", "");
    const scrim = document.createElement("div");
    scrim.className = "sheet-scrim";
    scrim.addEventListener("click", () => UI.closeSheet());
    document.body.append(scrim);
    this.el.sheetClose.focus();
  },

  closeSheet() {
    const d = this.el.sheet;
    if (d.open && !d.classList.contains("is-fallback")) d.close();
    else { d.removeAttribute("open"); d.classList.remove("is-fallback"); }
    document.querySelector(".sheet-scrim")?.remove();
    this.el.settingsBtn.setAttribute("aria-expanded", "false");
    this.el.settingsBtn.focus();
  },

  /* Built once, at startup, and never touched again: a fixture that moved
     would be a drifter. The randomness is per load rather than per appearance,
     so a meadow is stable while you are looking at it and different when you
     come back. */
  buildScenery() {
    const n = Config.scenery;
    const r = (a, b) => a + Math.random() * (b - a);
    const cloud = `<svg viewBox="0 0 18 8" shape-rendering="crispEdges" aria-hidden="true">`
      + `<rect class="lit" x="2" y="2" width="6" height="3"/>`
      + `<rect class="lit" x="6" y="1" width="5" height="4"/>`
      + `<rect class="lit" x="10" y="2" width="5" height="3"/>`
      + `<rect class="lit" x="1" y="4" width="16" height="3"/>`
      + `<rect class="under" x="1" y="6" width="16" height="1"/></svg>`;

    /* Depth: the far half is smaller, slower and paler, which is the whole of
       the parallax. Negative delays start each one part way across, so the sky
       is never empty on the first frame. */
    let html = "";
    for (let i = 0; i < n.clouds; i++) {
      const far = i >= Math.ceil(n.clouds / 2);
      html += `<div class="cloud" style="--y:${(6 + i * 9).toFixed(0)}%;`
        + `--w:${far ? 20 : 32}%;--op:${far ? 0.5 : 0.9};`
        + `--dur:${far ? 150 : 95}s;--delay:-${r(0, far ? 150 : 95).toFixed(0)}s"></div>`;
    }
    this.el.clouds.innerHTML = html.replace(/><\/div>/g, ">" + cloud + "</div>");

    html = "";
    for (let i = 0; i < n.tufts; i++) {
      html += `<span class="tuft" style="--x:${r(2, 96).toFixed(1)}%;`
        + `--h:${r(5, 10).toFixed(0)}px;--dur:${r(3.2, 5.4).toFixed(1)}s;`
        + `--delay:-${r(0, 5).toFixed(1)}s"></span>`;
    }
    for (let i = 0; i < n.flowers; i++) {
      html += `<span class="flower" style="--x:${r(4, 94).toFixed(1)}%;`
        + `--c:var(--petal${i % 3 === 0 ? "-2" : ""})"><i></i><u></u></span>`;
    }
    this.el.meadow.innerHTML = html;

    html = "";
    for (let i = 0; i < n.fireflies; i++) {
      html += `<span class="fly" style="--x:${r(5, 95).toFixed(1)}%;`
        + `--b:${r(4, 22).toFixed(0)}%;--dur:${r(7, 12).toFixed(1)}s;`
        + `--blink:${r(1.8, 3.4).toFixed(1)}s;--delay:-${r(0, 6).toFixed(1)}s"></span>`;
    }
    this.el.fireflies.innerHTML = html;
  },

  renderThemes() {
    const t = this.t();
    this.el.themes.querySelectorAll("button").forEach((b) => b.remove());
    Config.themes.order.forEach((mode) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("role", "radio");
      btn.dataset.mode = mode;
      btn.innerHTML = '<span aria-hidden="true">' + Config.themes.icons[mode] +
        '</span><span class="seg-word" aria-hidden="true">' + t.themes[mode] + "</span>";
      btn.setAttribute("aria-label", t.themes[mode]);
      this.el.themes.appendChild(btn);
    });
    this.markThemes();
  },

  /**
   * The creature picker. Only the species without a secret flag appear, so the
   * dinosaur stays behind the footer switch, which is the whole point of it.
   */
  renderCreatures() {
    const t = this.t();
    this.el.creature.querySelectorAll("button").forEach((b) => b.remove());
    PICKABLE.forEach((key) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang-btn";
      btn.setAttribute("role", "radio");
      btn.dataset.species = key;
      btn.textContent = `${Config.species[key].emoji} ${t.creatureName[key]}`;
      this.el.creature.appendChild(btn);
    });
    this.markCreatures();
  },

  /** Nothing is checked while the secret creature is out, which is honest. */
  markCreatures() {
    this.el.creature.querySelectorAll("button").forEach((btn) => {
      const on = btn.dataset.species === State.data.species;
      btn.setAttribute("aria-checked", String(on));
      btn.tabIndex = on || State.data.species === SECRET_SPECIES ? 0 : -1;
    });
  },

  /** Marks the selected mode, not the resolved theme: "auto" is a choice too. */
  markThemes() {
    const t = this.t();
    const mode = State.data.themeMode;
    this.el.themes.querySelectorAll("button").forEach((btn) => {
      const on = btn.dataset.mode === mode;
      btn.setAttribute("aria-checked", String(on));
      btn.tabIndex = on ? 0 : -1;              // one tab stop, arrows move inside
    });
    this.el.themeStatus.textContent = `${t.themes[mode]} ${t.themeSelected}`;
    this.updateTrailNotice();
  },

  /** Says why the glitter trail is missing rather than looking broken. */
  updateTrailNotice() {
    const t = this.t();
    if (!GlitEngine.enabled) {
      this.el.trailNotice.textContent = "";
    } else if (GlitCaps.reducedMotion) {
      this.el.trailNotice.textContent = t.trailReducedMotion;
    } else if (!GlitCaps.trailSupported) {
      this.el.trailNotice.textContent = t.trailNoPointer;
    } else {
      this.el.trailNotice.textContent = "";
    }
  },

  /**
   * Puts the sun and the moon where the clock says they are, and hides the one
   * that would contradict the sky it sits in. Without the theme gate an
   * explicit night override in the afternoon paints a dark sky, stars and a
   * lit sun all at once, since the arcs know only the clock. Forcing night
   * before the moon's rise hour therefore leaves an empty sky, which is
   * honest: feeding the arc a substitute hour would put the moon somewhere the
   * clock never says it is.
   */
  applySky(theme = this.effectiveTheme()) {
    const hour = Time.hourOfDay();
    const inSky = { sun: theme === "day", moon: theme === "night" };
    [["sun", Config.sky.sun], ["moon", Config.sky.moon]].forEach(([key, arc]) => {
      const el = this.el[key];
      const at = inSky[key] ? Sky.position(arc, hour) : null;
      if (!at) {
        el.dataset.visible = "no";
        return;
      }
      el.style.left = `${at.x}%`;
      el.style.top = `${at.y}%`;
      el.dataset.visible = "yes";
    });
  },

  applyTheme() {
    const theme = this.effectiveTheme();
    const sparkly = Config.themes.sparkly.includes(theme);

    document.documentElement.dataset.theme = theme;
    GlitEngine.enabled = sparkly;
    /* Only on the way out, because applyTheme also runs on the UI ticker. */
    if (!sparkly && this.lastTheme === "glitter") GlitEngine.clear();
    this.lastTheme = theme;

    this.markThemes();
    this.applySky(this.skyTheme());   // rides the same ticker as the theme
    Ambient.nudgeStar();              // the sky decides which reward is allowed
  },

  applySound() {
    const t = this.t();
    const on = State.data.soundOn;
    this.el.soundIcon.setAttribute("href", on ? "#i-sound" : "#i-mute");
    this.el.soundBtn.setAttribute("aria-pressed", String(on));
    this.label(this.el.soundBtn, on ? t.soundOn : t.soundOff);
    this.el.soundInput.checked = on;
  },

  syncSettingsInputs() {
    const s = State.data;
    this.el.nameInput.value = s.names[s.species] || "";
    this.el.decayInput.value = s.decayHours;
    this.el.refillInput.value = s.refillAmount;
    this.el.eggInput.checked = s.easterEggOn;
    this.el.hapticsInput.checked = s.hapticsOn;
    this.el.hapticsRow.hidden = !Haptics.available();
    this.renderSettingsValues();
    this.applySound();
    this.applyTheme();
  },

  toggleInfo(force) {
    const open = force !== undefined ? force : this.el.infoCard.hidden;
    this.el.infoCard.hidden = !open;
    this.el.infoBtn.setAttribute("aria-expanded", String(open));
  },

  flash(className, ms) {
    this.el.scene.classList.remove(className);
    void this.el.scene.offsetWidth;
    this.el.scene.classList.add(className);
    setTimeout(() => this.el.scene.classList.remove(className), ms);
  },

  droplets(count = 3) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < count; i++) {
      const drop = document.createElement("span");
      drop.className = "drop";
      drop.textContent = "\u{1F4A7}";
      drop.style.setProperty("--dx", `${(i - (count - 1) / 2) * 26}px`);
      drop.style.animationDelay = `${i * 0.09}s`;
      this.el.drops.appendChild(drop);
      setTimeout(() => drop.remove(), 1400);
    }
  }
};

/* ========= EVENTS ========= */
const Events = {
  refreshTimer: null,

  bind() {
    UI.el.drinkBtn.addEventListener("click", () => this.onDrink());
    UI.el.resetBtn.addEventListener("click", () => this.onReset());
    UI.el.secretBtn.addEventListener("click", () => this.onSecret());
    UI.el.infoBtn.addEventListener("click", () => UI.toggleInfo());

    UI.el.settingsBtn.addEventListener("click", () => UI.openSheet());
    UI.el.sheetClose.addEventListener("click", () => UI.closeSheet());
    /* <dialog> reports a backdrop click as a click on the dialog itself. */
    UI.el.sheet.addEventListener("click", (e) => {
      if (e.target === UI.el.sheet) UI.closeSheet();
    });
    /* Esc closes without going through closeSheet, so the button's state and
       the fallback scrim are reset here rather than only there. */
    UI.el.sheet.addEventListener("close", () => {
      document.querySelector(".sheet-scrim")?.remove();
      UI.el.settingsBtn.setAttribute("aria-expanded", "false");
    });

    UI.el.goalUp.addEventListener("click", () => this.nudgeGoal(+1));
    UI.el.goalDown.addEventListener("click", () => this.nudgeGoal(-1));

    UI.el.themes.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (btn) this.setThemeMode(btn.dataset.mode, btn);
    });
    UI.el.themes.addEventListener("keydown", (e) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (!step) return;
      e.preventDefault();
      const order = Config.themes.order;
      const from = order.indexOf(State.data.themeMode);
      const next = order[(from + step + order.length) % order.length];
      this.setThemeMode(next);
      const btn = UI.el.themes.querySelector(`button[data-mode="${next}"]`);
      if (btn) btn.focus();
    });

    /* Guarded in JS as well as in CSS: CSS alone would hide the result of the
       work rather than skip it. */
    window.addEventListener("pointermove", (e) => GlitEngine.trackPointer(e), { passive: true });

    document.addEventListener("click", (e) => {
      if (e.target.closest("[data-mode]")) return;      // the pill bursts itself
      if (!e.target.closest("button, .card, .panel")) return;
      GlitEngine.burst(e.clientX, e.clientY, GlitEngine.tapCount());
    });

    GlitCaps.onChange(() => {
      if (!GlitCaps.trailSupported) GlitEngine.clear();
      UI.updateTrailNotice();
    });

    UI.el.soundBtn.addEventListener("click", () => this.setSound(!State.data.soundOn));
    UI.el.soundInput.addEventListener("change", (e) => this.setSound(e.target.checked));

    UI.el.eggInput.addEventListener("change", (e) => {
      State.set({ easterEggOn: e.target.checked, tapHistory: [] });
    });

    UI.el.hapticsInput.addEventListener("change", (e) => {
      const on = e.target.checked;
      State.set({ hapticsOn: on });
      Haptics.enabled = on;
      /* Switching it on answers "did that work?" on the spot, which matters
         when Do Not Disturb can silence the whole feature invisibly. */
      if (on) Haptics.buzz(Config.haptics.better);
    });

    Config.locales.forEach((loc) => {
      const btn = UI.el["lang" + loc[0].toUpperCase() + loc.slice(1)];
      if (btn) btn.addEventListener("click", () => this.setLocale(loc));
    });

    /* Commit on change, which is blur or Enter, rather than on every
       keystroke: a half-typed name has no business in the title, the speech
       bubble and four ARIA labels. */
    UI.el.nameInput.addEventListener("change", (e) => {
      const kept = State.setName(e.target.value);
      e.target.value = kept;        // show what survived trimming and the cap
      UI.applyText();
      UI.render();
      UI.say(UI.t().renamed(UI.name()), 2200);
    });

    UI.el.creature.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-species]");
      if (btn) this.setSpecies(btn.dataset.species);
    });

    UI.el.decayInput.addEventListener("input", () => UI.renderSettingsValues());
    UI.el.decayInput.addEventListener("change", (e) => {
      State.sync();          // bill the time already elapsed at the old rate
      const hours = State.clampStep(e.target.value, State.data.decayHours, Config.limits.decayHours);
      State.set({ decayHours: hours });
      e.target.value = hours;
      UI.renderSettingsValues();
      UI.render();
    });

    UI.el.refillInput.addEventListener("input", () => UI.renderSettingsValues());
    UI.el.refillInput.addEventListener("change", (e) => {
      const amount = State.clampStep(e.target.value, State.data.refillAmount, Config.limits.refillAmount);
      State.set({ refillAmount: amount });
      e.target.value = amount;
      UI.renderSettingsValues();
    });

    /* Lifecycle: visibilitychange + pagehide are the signals we can rely on
       in mobile browsers. beforeunload/unload often never fire there. */
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        this.onReturn();
      } else {
        State.sync();
        State.save();
        this.stopRefresh();
        Ambient.stop();
        GlitEngine.clear();       // nothing should be mid-flight on return
      }
    });
    window.addEventListener("pagehide", () => {
      State.sync();
      State.save();
      this.stopRefresh();
      Ambient.stop();
    });

    /* First gesture anywhere unlocks audio, so the very first drink has sound. */
    const unlockOnce = () => {
      Audio_.unlock();
      window.removeEventListener("pointerdown", unlockOnce);
      window.removeEventListener("keydown", unlockOnce);
    };
    window.addEventListener("pointerdown", unlockOnce);
    window.addEventListener("keydown", unlockOnce);
  },

  /**
   * One entry point for the pill, so the burst that greets glitter happens
   * exactly on the change and not on every re-render. Compares resolved
   * themes, not modes: leaving auto at dusk is a real change of theme even
   * though the stored mode never moved.
   */
  setThemeMode(mode, origin) {
    if (!Config.themes.order.includes(mode) || mode === State.data.themeMode) return;
    const before = UI.effectiveTheme();
    State.set({ themeMode: mode });
    UI.applyTheme();
    const after = UI.effectiveTheme();

    const sparkly = Config.themes.sparkly;
    if (sparkly.includes(after) && !sparkly.includes(before)) {
      const count = GlitCaps.finePointer
        ? Config.glitter.burst.onThemeEnter
        : Config.glitter.burst.onTouchTap;
      GlitEngine.burstFrom(origin || UI.el.themes, count);
    }
  },

  setSound(on) {
    State.set({ soundOn: on });
    Audio_.enabled = on;
    if (on) Audio_.unlock();
    UI.applySound();
  },

  setLocale(locale) {
    if (!Config.locales.includes(locale) || locale === State.data.locale) return;
    State.set({ locale });
    UI.applyText();
    UI.applyLimits();
    UI.say(UI.bandSpeech(), 1500);
    UI.render();
  },

  /** Chosen from the settings, so it sticks: the switch returns here. */
  setSpecies(key) {
    if (key === State.data.species) return;
    State.pickSpecies(key);
    UI.applySpecies();
    UI.applyText();
    UI.syncSettingsInputs();       // the name field belongs to this creature
    UI.render();
    UI.flash("is-morphing", Config.ui.morphFeedbackMs);
    UI.say(UI.t().morph(UI.name()), 2600);
    Audio_.morph();
  },

  /** The almost hidden switch, and the only way to the secret creature. */
  onSecret() {
    Audio_.unlock();
    State.toggleSecret();
    UI.applySpecies();
    UI.applyText();
    UI.syncSettingsInputs();       // the name field belongs to the new creature
    UI.render();
    UI.flash("is-morphing", Config.ui.morphFeedbackMs);
    UI.say(UI.t().morph(UI.name()), 2600);
    Audio_.morph();
  },

  /* The daily goal, in taps. */
  nudgeGoal(delta) {
    const l = Config.limits.goalTaps;
    const next = Math.min(l.max, Math.max(l.min, State.data.goalTaps + delta * l.step));
    if (next === State.data.goalTaps) return;
    State.data.goalTaps = next;
    State.save();
    UI.render();
  },

  onDrink() {
    Audio_.unlock();
    /* Read the count before drink() increments it. The band that drink()
       returns as `before` is a string, so comparing it to the goal would be
       false every time and the goal would celebrate on every tap past it. */
    const goal = State.data.goalTaps;
    const wasMet = State.data.todayCount >= goal;
    const result = State.drink();
    UI.render();

    /* Before the burst branch returns early, so a tap that reaches the goal
       still counts when it is the fifth tap of the easter egg. */
    if (!wasMet && State.data.todayCount >= goal) {
      UI.celebrateGoal(result.improved || result.burst);
    }
    UI.droplets(result.burst ? 6 : 3);

    if (result.burst) {
      UI.say(UI.pick(UI.t().gurgle));
      UI.flash("is-gurgling", Config.ui.gurgleFeedbackMs);
      Audio_.gurgle();
      return;
    }

    UI.flash("is-sipping", Config.ui.sipFeedbackMs);
    Audio_.sip();

    /* Only a drink that tops the meter right out, not one that merely leaves
       it high. Reset is deliberately not a celebration: it fills the meter as
       housekeeping rather than as an achievement. */
    if (State.data.hydration >= Config.hydration.max) UI.celebrateDayStars();

    if (result.improved) {
      UI.say(UI.pick(UI.t().cheer));
      setTimeout(() => Audio_.cheer(), 260);
    } else {
      UI.say(UI.pick(UI.t().sip));
    }
  },

  onReset() {
    if (!window.confirm(UI.t().resetConfirm(UI.name()))) return;
    State.reset();
    UI.lastBand = null;
    UI.render();
    UI.say(UI.bandSpeech());
  },

  /** Page became visible again: re-derive state from the clock. */
  onReturn() {
    const before = State.band();
    const lost = State.sync();
    State.save();
    UI.applyTheme();          // the clock may have crossed dawn or dusk
    /* Visual feedback first on return. A band that dropped while the tab was
       away is real news, but arriving to a buzz is startling, and the mood
       line and the sprite carry it anyway. */
    Haptics.suppressNext = true;
    UI.render();
    this.startRefresh();
    Ambient.start();
    /* A page that was suspended may have missed a resize, and a canvas sized
       for the old viewport draws in the wrong place. */
    GlitEngine.resize();

    const after = State.band();
    if (lost > 1 && after !== before && State.bandRank(after) > State.bandRank(before)) {
      UI.say(UI.bandSpeech(after), 3200);
      /* Visual feedback first on return. No sound unless a gesture already
         unlocked the audio context, and never loud on arrival. */
      if (after === "dehydrated" && Audio_.ready()) Audio_.sad();
    }
  },

  /** UI-only ticker for the relative-time label and the clock theme. */
  startRefresh() {
    this.stopRefresh();
    this.refreshTimer = setInterval(() => {
      State.sync();
      UI.applyTheme();
      UI.render();
    }, Config.ui.refreshMs);
  },

  stopRefresh() {
    if (this.refreshTimer) {
      clearInterval(this.refreshTimer);
      this.refreshTimer = null;
    }
  }
};

/* ========= INIT ========= */
function init() {
  UI.cache();

  const migratedFrom = Storage.migrate();
  State.load();
  State.sync();
  State.save();

  Audio_.enabled = State.data.soundOn;
  Haptics.enabled = State.data.hapticsOn;
  GlitEngine.init(UI.el.glitCanvas);

  UI.buildScenery();
  UI.applySpecies();
  UI.applyLimits();
  UI.syncSettingsInputs();
  UI.applyText();
  UI.render();
  UI.say(UI.bandSpeech(), 1500);

  Events.bind();
  Events.startRefresh();
  Ambient.start(UI.el.ambient);

  /* The browser console stands in for a shell banner, so the running version
     is always identifiable without reading the source. */
  console.log(`${UI.name()} Aqua Buddy ${Config.app.version} - ${Config.app.status}`);
  if (migratedFrom) {
    console.log(`Adopted saved state from the old key "${migratedFrom}".`);
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
