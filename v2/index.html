/* ============================================================

   ============================================================ */

/* ============================================================
   BASE LAYOUT
   ============================================================ */
* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  padding: 12px 12px calc(18px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: linear-gradient(170deg, var(--bg), var(--bg-2));
  color: var(--text);
  font: 16px/1.45 var(--font-app);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.5s ease, color 0.3s ease;
}

.app {
  width: 100%;
  max-width: 424px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

:where(button, input, select) { font: inherit; color: inherit; }

:where(button, input, select, summary):focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.panel {
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

/* ==========================================================================
   GLITTER THEME
   From the prototype in .work/glitter-mode/, translated into this app's token
   names: the demo host used its own vocabulary, so the palette moved but the
   token names could not. Glitter is a theme and not a switch, which is why it
   is a fourth value of themeMode rather than a boolean.

   `:root[data-theme=...]` and not a bare attribute selector: a bare
   `[data-theme="glitter"]` ties with `:root` on specificity, so whichever
   came later would win. Two simple selectors beat one, whatever the order.
   ========================================================================== */
:root[data-theme="glitter"] {
  /* unicorn, pink-forward */
  --coat:        #fff2fa;
  --coat-shade:  #ffd3ec;
  --mane-1:      #ff6fc1;
  --mane-2:      #a97bff;
  --mane-3:      #7ad4ff;
  --horn:        #ffd166;
  --horn-shade:  #e8a83f;
  --muzzle:      #ffe0f2;
  --hoof:        #d98ecb;
  /* dinosaur */
  --skin:        #86e0b6;
  --skin-shade:  #5cc196;
  --belly:       #fdf0c7;
  --spike:       #ff8fd0;
  --spike-shade: #e0679f;
  --claw:        #fff1b8;
  /* panda, pink-forward like the rest of glitter: the markings warm towards
     plum so the creature belongs to the palette rather than sitting on it. */
  --fur:         #fff6fb;
  --fur-shade:   #ffd9ef;
  --patch:       #6b3f63;
  --patch-shade: #55304f;
  --snout:       #fff0f8;
  --paw:         #55304f;
  /* shared */
  --ink:         #4d1c3d;
  --blush:       #ff7ab8;

  --bg:          #f0cbe6;
  --bg-2:        #dcc4ff;
  --scene-1:     #ffd9f0;
  --scene-2:     #ffc2e4;
  --ground:      #f7b6dd;
  --panel:       #fdf1f8;
  --panel-edge:  #f0c3de;
  --text:        #4d1c3d;
  --text-soft:   #91567c;
  --accent:      #7a58ef;
  --accent-ink:  #ffffff;
  --meter-bg:    #f9e3f2;
  --meter-fill:  linear-gradient(90deg, #ff77c8, #b06bff);
  --shadow:      0 4px 0 #eab3d8;
  --focus:       #7a58ef;
  --star:        #ffffff;
  --star-glow:   rgba(255, 255, 255, 0.9);
  --wind-stroke: rgba(255, 255, 255, 0.9);

  /* The typeface is most of the effect. The particles are the garnish. */
  --font-app: "Comic Sans MS", "Comic Neue", "Chalkboard SE", Quicksand,
              "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
              "Noto Sans SC", "PingFang SC", "Microsoft YaHei",
              system-ui, sans-serif;

  --cloud:        #fffafd;
  --cloud-shade:  #ffd9f2;
  --hill:         #f0aed8;
  --hill-far:     #f7c8e6;
  --grass:        #ef9ed0;
  --stem:         #d472ae;
  --petal:        #ff6fc1;
  --petal-2:      #ffd166;
  --firefly:      #fff0a8;
  --firefly-glow: rgba(255, 240, 168, 0.55);

  --sheen-opacity: 0.5;
  --deco-display: inline;
}

/* ---------- glitter effect layers ---------- */

/* One sheen for every theme, tuned by --sheen-opacity, so an inert theme
   costs nothing beyond an element that paints nothing. */
.glit-sheen {
  position: fixed;
  inset: -30%;
  z-index: 0;
  pointer-events: none;
  opacity: var(--sheen-opacity);
  background:
    conic-gradient(from 0deg,
      transparent 0deg, #ffffff96 22deg, transparent 52deg,
      transparent 150deg, #ffe6f799 176deg, transparent 208deg,
      transparent 300deg, #e9d5ff8c 328deg, transparent 358deg);
  animation: glit-sheen-turn 34s linear infinite;
}
@keyframes glit-sheen-turn { to { transform: rotate(1turn); } }

/* The particle canvas. Never interactive, never in the accessibility tree. */
.glit-canvas {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
}

/* Decorative emoji sit in the markup as aria-hidden spans revealed by a
   token, so no theme needs its own selector and no accessible name changes
   with the theme. */
.glit-deco { display: var(--deco-display); flex: none; }

/* Sparkle specks on the drink button, glitter only via the token. */
.glit-specks { position: relative; overflow: hidden; }
.glit-specks::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: var(--sheen-opacity);
  background-image:
    radial-gradient(1.5px 1.5px at 18% 30%, #fff 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 74% 22%, #fff 0%, transparent 100%),
    radial-gradient(2px 2px at 52% 74%, #fff 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 66%, #fff 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 33% 82%, #fff 0%, transparent 100%);
}

/* The theme control: a segmented pill. Four states, so it is a radiogroup
   with a roving tabindex; a switch would have to lie about two of them. It
   takes a row of its own, because four 44 px targets plus the two icon
   buttons do not fit a phone-width top bar beside the title. */
.glit-themes {
  flex-basis: 100%;
  display: flex;
  justify-content: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--meter-bg);
}
.glit-themes button {
  min-width: 46px;
  min-height: 40px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.14s ease;
}
/* The selected mode borrows the language buttons' idiom, --accent on
   --accent-ink, rather than the prototype's near-white thumb: on the night
   palette a --panel thumb sat on --meter-bg with almost no contrast, so the
   selection was there and invisible. */
.glit-themes button[aria-checked="true"] {
  background: var(--accent);
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.22);
}
.glit-themes button:active { transform: scale(0.92); }
@media (hover: hover) and (pointer: fine) {
  .glit-themes button:hover { background: rgb(255 255 255 / 0.45); }
  .glit-themes button { min-height: 34px; }
}

/* Says out loud why the trail is missing, rather than looking broken. */
.glit-notice { font-size: 0.76rem; color: var(--text-soft); }
.glit-notice:empty { display: none; }

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  flex-wrap: wrap;              /* the theme pill takes a row of its own */
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
}
.topbar h1 {
  margin: 0;
  flex: 1;
  min-width: 0;
  font-size: 1.02rem;
  letter-spacing: 0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0 8px;
  border: 2px solid var(--panel-edge);
  border-radius: 14px;
  background: transparent;
  font-size: 1.15rem;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn[aria-pressed="false"] { opacity: 0.5; }

/* ---------- tooltips ----------
   The icon buttons carry no visible text, so each one names itself on hover.
   The text comes from data-tip, which UI.label() writes from the same string
   as the aria-label, so the two cannot drift apart. A pseudo-element is not
   in the accessibility tree, so a screen reader still hears one name, not two.
   Hover and keyboard focus only: on touch these buttons act on the first tap,
   and a tooltip that needs a second one would just be in the way. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 5;
  padding: 5px 9px;
  border: 2px solid var(--panel-edge);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text-soft);
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(-3px);
  transition: opacity 0.16s ease, transform 0.16s ease;
  pointer-events: none;          /* never steals the pointer from its button */
}
[data-tip]:focus-visible::after { opacity: 1; transform: translateY(0); }
@media (hover: hover) and (pointer: fine) {
  [data-tip]:hover::after { opacity: 1; transform: translateY(0); }
}
/* The secret switch sits in the footer, so its tooltip opens upwards and to
   the left, which is the only direction with room. */
.secret[data-tip]::after { top: auto; bottom: calc(100% + 6px); }

/* ---------- info card ---------- */
.info {
  padding: 14px 16px;
  font-size: 0.9rem;
  line-height: 1.5;
}
.info[hidden] { display: none; }
.info p { margin: 0 0 8px; }
.info p:last-child { margin-bottom: 0; }
.info .tip { color: var(--text-soft); font-size: 0.82rem; }

/* ---------- scene ---------- */
.scene {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  border: 2px solid var(--panel-edge);
  background: linear-gradient(180deg, var(--scene-1), var(--scene-2));
  box-shadow: var(--shadow);
  aspect-ratio: 1 / 0.92;
  display: grid;
  place-items: end center;
  transition: background 0.6s ease;
}
/* F7. The mood reaches the world, not just the creature. A wash of neutral
   grey over the whole scene dulls sky, ground, sun, moon and ambient life
   together, which is what "overcast" looks like, and it works in every theme
   because grey washes both a pale sky and a dark one towards the middle.
   z-index 3 puts it above every scenery layer and below the creature at 4, so
   the character keeps its own saturation and stays the one thing in the picture
   that has not gone grey. Before v0.32 it sat level with the ambient life and
   the rainbow, which are later in the document and so escaped it. */
.scene::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background-color: rgb(128 128 128 / var(--wash, 0));
  transition: background-color 0.7s ease;
}

/* ============================================================
   SCENERY
   Fixtures, not drifters. Everything the scene carried until v0.31 crossed and
   left, so there was nothing for the motion to be measured against: a gull
   reads as crossing only if it crosses something. These stay put.
   ============================================================ */

/* Clouds pass in front of the sun and the moon and behind the birds, and that
   is a rule rather than an accident of markup order: they own layer 1 and the
   sky owns 0. Deliberately not scaled by --amb-mood, because ambient life
   thins as the mood drops and weather does not. The wash carries the mood
   here instead. */
/* The scene's stacking, in one place, because two layers sharing a number and
   sorting by document order is what put the sun in front of the clouds:

     0  sky         the sun and the moon
     1  clouds      always in front of them, never behind
     2  ambient     birds and wind, in front of the clouds
        rainbow     the daylight reward
        meadow      grass and flowers, on the ground
        fireflies   after dark, on the ground
     3  wash        the mood, dulling everything above it
     4  pet         the creature, which the wash never touches
     5  speech
     6  drops

   The ground strip is ::after at auto, which paints below all of these and
   above the sky gradient, so the hills at auto sit behind it on purpose. */
.clouds { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.cloud {
  position: absolute;
  left: 0;
  top: var(--y, 20%);
  width: var(--w, 30%);
  opacity: var(--op, 0.85);
  animation: cloud-cross var(--dur, 90s) linear infinite;
  animation-delay: var(--delay, 0s);
}
.cloud svg { display: block; width: 100%; height: auto; }
.cloud .lit   { fill: var(--cloud); }
.cloud .under { fill: var(--cloud-shade); }
@keyframes cloud-cross {
  from { transform: translateX(-130%); }
  to   { transform: translateX(430%); }
}

/* The hills sit behind the ground strip on purpose: the strip's top edge is the
   horizon, and they rise from behind it. No z-index, so the strip covers their
   feet. */
.hills { position: absolute; inset: auto 0 13% 0; pointer-events: none; }
.hills svg { display: block; width: 100%; height: auto; }
.hills .far  { fill: var(--hill-far); }
.hills .near { fill: var(--hill); }

/* Grass and flowers stand ON the ground rather than behind it, so they have to
   clear the strip: z-index 1 against the strip's auto. This is the one piece of
   the scene where painting order is load-bearing. */
.meadow { position: absolute; inset: auto 0 0 0; height: 15%; z-index: 2; pointer-events: none; }
.tuft {
  position: absolute;
  bottom: 58%;
  left: var(--x, 50%);
  width: 2px;
  height: var(--h, 7px);
  background: var(--grass);
  transform-origin: 50% 100%;
  animation: sway var(--dur, 4.2s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

.flower { position: absolute; bottom: 52%; left: var(--x, 50%); }
/* Both are block: width and height do nothing on an inline box, and as spans
   these rendered at zero by zero. */
.flower i, .flower u { display: block; }
.flower u {
  width: 2px; height: 6px; margin: 0 auto;
  background: var(--stem); text-decoration: none;
}
.flower i {
  width: 6px; height: 6px; margin: 0 auto -1px;
  background: var(--c, var(--petal));
  clip-path: polygon(50% 0, 100% 35%, 82% 100%, 18% 100%, 0 35%);
  transform: scale(var(--bloom, 1));
  transform-origin: 50% 100%;
  transition: transform 0.8s cubic-bezier(0.3, 1.4, 0.5, 1);
}

/* Fireflies are life, so they thin with the mood, and they belong to the dark:
   the day already has birds. Gated on the resolved theme, so a clock that says
   night and a theme that says day cannot disagree. */
.fireflies { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: none; }
:root[data-theme="night"] .fireflies { display: block; }
.fly {
  position: absolute;
  left: var(--x, 50%);
  bottom: var(--b, 16%);
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--firefly);
  box-shadow: 0 0 6px 2px var(--firefly-glow);
  opacity: 0;
  animation: fly-wander var(--dur, 9s) ease-in-out infinite,
             fly-blink var(--blink, 2.4s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes fly-wander {
  0%, 100% { transform: translate(0, 0); }
  25%      { transform: translate(12px, -9px); }
  50%      { transform: translate(-7px, -16px); }
  75%      { transform: translate(-14px, -5px); }
}
@keyframes fly-blink {
  0%, 100% { opacity: 0; }
  45%, 55% { opacity: calc(0.9 * var(--amb-mood, 1)); }
}

.scene::after {                       /* ground strip */
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 15%;
  background: var(--ground);
  transition: background 0.6s ease;
}

/* Background stars: always at night, and in daylight only at the happiest
   level, where they read as a warm sparkle rather than a night sky. */
.stars {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease;
  background-image:
    radial-gradient(1.5px 1.5px at 14% 18%, var(--star) 99%, transparent),
    radial-gradient(1.3px 1.3px at 78% 12%, var(--star) 99%, transparent),
    radial-gradient(1.5px 1.5px at 62% 30%, var(--star) 99%, transparent),
    radial-gradient(1.3px 1.3px at 30% 40%, var(--star) 99%, transparent),
    radial-gradient(1.7px 1.7px at 88% 44%, var(--star) 99%, transparent),
    radial-gradient(1.3px 1.3px at 46% 22%, var(--star) 99%, transparent),
    radial-gradient(1.5px 1.5px at 22% 62%, var(--star) 99%, transparent);
  filter: drop-shadow(0 0 3px var(--star-glow));
}
:root[data-theme="night"] .stars { opacity: 0.9; }
/* Daylight stars are a moment, not a state. They used to ride data-radiant,
   which meant the whole time the meter read 95 or above, so a bright sky kept
   a starfield in it for minutes. Now they are a few seconds of celebration
   when the meter is topped right out, and the rest of the daytime sky is left
   to the wind and the birds. */
:root[data-theme="day"] .scene[data-daystars="on"] .stars { opacity: 0.85; }
/* At night the reward brightens the whole field. This is the static half of
   the night reward, so something still happens under reduced motion, where no
   shooting star is allowed to cross. */
:root[data-theme="night"] .scene[data-radiant="on"] .stars { opacity: 1; }

/* rainbow reward, only while the meter reads at or above Config.thresholds.reward */
.rainbow {
  position: absolute;
  z-index: 2;                   /* over the clouds, under the character */
  left: 50%;
  top: 13%;
  width: 70%;
  transform: translateX(-50%) scale(0.94);
  opacity: 0;
  transition: opacity 0.9s ease, transform 0.9s ease;
  pointer-events: none;
}
/* Day only. A rainbow needs a lit sky to read as one, so after dark the
   reward is a shooting star instead, spawned by Ambient. */
:root[data-theme="day"] .scene[data-radiant="on"] .rainbow,
:root[data-theme="glitter"] .scene[data-radiant="on"] .rainbow {
  opacity: 0.45;
  transform: translateX(-50%) scale(1);
}
.rainbow path { fill: none; stroke-width: 3.3; stroke-linecap: round; }

/* ---------- sun and moon ----------
   Both travel the same arc: up from the left at their rise hour, highest at
   their peak hour, down to the right at their set hour. East to west, so the
   sun comes up on the left the way it actually does. */
.sky { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.body {
  position: absolute;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 1.2s ease, left 1.5s linear, top 1.5s linear;
}
.body[data-visible="yes"] { opacity: 1; }
.sun {
  width: 11%;
  aspect-ratio: 1;
  background: radial-gradient(circle at 38% 34%, #fff6cf 0%, #ffd45e 52%, #f7a53c 100%);
  box-shadow: 0 0 14px 5px rgba(255, 206, 92, 0.45);
}
.moon {
  width: 9%;
  aspect-ratio: 1;
  background:
    radial-gradient(circle at 66% 62%, rgba(150, 140, 190, 0.4) 0 14%, transparent 15%),
    radial-gradient(circle at 34% 40%, rgba(150, 140, 190, 0.34) 0 10%, transparent 11%),
    radial-gradient(circle at 58% 26%, rgba(150, 140, 190, 0.26) 0 7%, transparent 8%),
    radial-gradient(circle at 40% 36%, #fdfbff 0%, #e6def7 60%, #c9bee6 100%);
  box-shadow: 0 0 12px 4px rgba(226, 216, 255, 0.35);
}

/* ---------- ambient life: birds by day, wind gusts mostly by night ----------
   Both are spawned rarely by Ambient, cross the scene once and remove
   themselves. Rates live in Config.ambient. */
.ambient { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.amb {
  position: absolute;
  left: -25%;
  animation: drift var(--dur, 12s) linear forwards;
}
.amb.rtl { animation-name: drift-rtl; }
.amb-flip { display: block; }
.amb.rtl .amb-flip { transform: scaleX(-1); }
@keyframes drift {
  0%   { left: -25%; opacity: 0; }
  14%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  86%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  100% { left: 118%; opacity: 0; }
}
@keyframes drift-rtl {
  0%   { left: 118%; opacity: 0; }
  14%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  86%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  100% { left: -25%; opacity: 0; }
}
.amb-bob { display: block; }
.bird .amb-bob, .wind .amb-bob { animation: amb-bob var(--bob, 3.4s) ease-in-out infinite; }
@keyframes amb-bob {
  0%, 100% { transform: translateY(-14%); }
  50%      { transform: translateY(14%); }
}
.bird svg { display: block; width: 100%; height: auto; overflow: visible; }
.bird rect { fill: var(--ink); }
/* A sprite flaps by swapping frames, so the poses swap: exactly one is up at
   any moment and the change snaps rather than tweening. Smooth rotation was
   tried and reads as a shape being bent, which no pixel bird does. The cycle
   is up, mid, down, mid, so the mid pose carries two of the four slices, and
   --phase offsets each bird in the flock so they do not beat in unison. */
.bird .pose {
  opacity: 0;
  animation-duration: var(--flap, 0.7s);
  animation-iteration-count: infinite;
  animation-delay: var(--phase, 0s);
  animation-timing-function: steps(1, end);
}
.bird .pose-up   { animation-name: beat-up; }
.bird .pose-mid  { animation-name: beat-mid; }
.bird .pose-down { animation-name: beat-down; }
@keyframes beat-up   { 0% { opacity: 1; } 25%, 100% { opacity: 0; } }
@keyframes beat-mid  { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } }
@keyframes beat-down { 0%, 25% { opacity: 0; } 50% { opacity: 1; } 75%, 100% { opacity: 0; } }
/* Gulls do not slide along one line. In the reference they cross at a slant,
   climbing or settling as they go, so the flock gets its own keyframes: the
   same horizontal crossing as the drifters plus a vertical run set per
   appearance. Placed after .amb.rtl, which it has to outrank on document
   order at equal specificity. */
.amb.bird { animation-name: glide; }
.amb.bird.rtl { animation-name: glide-rtl; }
@keyframes glide {
  0%   { left: -25%; opacity: 0; transform: translateY(0); }
  14%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  86%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  100% { left: 118%; opacity: 0; transform: translateY(var(--glide, -40px)); }
}
@keyframes glide-rtl {
  0%   { left: 118%; opacity: 0; transform: translateY(0); }
  14%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  86%  { opacity: calc(var(--amb-op, 0.7) * var(--amb-mood, 1)); }
  100% { left: -25%; opacity: 0; transform: translateY(var(--glide, -40px)); }
}

/* The reward star: a streak, so it gets its own diagonal keyframes rather
   than the horizontal drift the other two share. Placed after .amb.rtl,
   because both rules carry the same specificity and the later one wins. */
.amb.star { animation-name: shoot; animation-timing-function: ease-out; }
.amb.star.rtl { animation-name: shoot-rtl; }
@keyframes shoot {
  0%   { left: -14%; opacity: 0; transform: translateY(0); }
  12%  { opacity: var(--amb-op, 0.9); }
  78%  { opacity: var(--amb-op, 0.9); }
  100% { left: 104%; opacity: 0; transform: translateY(var(--fall, 120px)); }
}
@keyframes shoot-rtl {
  0%   { left: 104%; opacity: 0; transform: translateY(0); }
  12%  { opacity: var(--amb-op, 0.9); }
  78%  { opacity: var(--amb-op, 0.9); }
  100% { left: -14%; opacity: 0; transform: translateY(var(--fall, 120px)); }
}
.star svg { display: block; width: 100%; height: auto; overflow: visible; }
.star path {
  fill: none;
  stroke: var(--star);
  stroke-width: 1.5;
  stroke-linecap: round;
}
.star circle { fill: var(--star); filter: drop-shadow(0 0 4px var(--star-glow)); }

/* Wind from the reference frames: not a bundle of ribbons but a single
   hairline trail that travels along its own path, sweeping in and curling
   into an open loop, thin and semi-transparent on the sky. What moves is a
   dash window walking the path, which is what draws the curve progressively
   and reads as air moving rather than as a shape being slid across.

   pathLength="100" normalises the geometry, so the dash lengths below are
   percentages of the path and do not have to be measured. Two paths share the
   geometry: a short bright core and a longer faint tail behind it, which is
   how a stroke that cannot taper still gets a comet's weight.
   --wind-stroke names the colour. */
.wind svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
  animation: curl-sway var(--sway, 4.2s) ease-in-out infinite;
}
.wind .trail {
  fill: none;
  stroke: var(--wind-stroke);
  stroke-linecap: round;
  animation-duration: var(--flow, 3.4s);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.wind .tail { stroke-width: 0.85; stroke-dasharray: 46 100; opacity: 0.45;
  animation-name: trail-run-tail; }
.wind .core { stroke-width: 1.5;  stroke-dasharray: 15 100; opacity: 0.95;
  animation-name: trail-run-core; }
/* The visible dash covers path positions -offset to -offset+length, so to
   walk the whole path the offset has to run from +length down to -100. The
   first attempt ran 100 to -46, which put the dash far off the front at the
   start and stopped it at position 61: the loop at the head of the path was
   never drawn at all, and every gust came out as the straight sweep only.
   One keyframe set per dash length, rather than a var() inside the keyframes,
   because a var()-driven animated value is exactly what latched in Chrome
   when the glitter prototype tried it. */
@keyframes trail-run-core {
  0%   { stroke-dashoffset: 15; opacity: 0; }
  10%  { opacity: 1; }
  82%  { opacity: 1; }
  100% { stroke-dashoffset: -100; opacity: 0; }
}
@keyframes trail-run-tail {
  0%   { stroke-dashoffset: 46; opacity: 0; }
  10%  { opacity: 1; }
  82%  { opacity: 1; }
  100% { stroke-dashoffset: -100; opacity: 0; }
}
.wind .speck {
  fill: var(--wind-stroke);
  opacity: 0;
  animation: speck-blink var(--flow, 3.4s) ease-in-out infinite;
}
.wind .speck:nth-of-type(2) { animation-delay: -1.1s; }
.wind .speck:nth-of-type(3) { animation-delay: -2.3s; }
@keyframes speck-blink {
  0%, 100% { opacity: 0; }
  40%      { opacity: 0.85; }
  60%      { opacity: 0.3; }
}
@keyframes curl-sway {
  0%, 100% { transform: rotate(-2.5deg); }
  50%      { transform: rotate(2.5deg); }
}

/* pixel sparkles */
.sparkles { position: absolute; inset: 0; pointer-events: none; }
.sparkle {
  position: absolute;
  width: 9px;
  height: 9px;
  opacity: 0;
  animation: twinkle var(--sparkle-dur, 2s) ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
.sparkle::before, .sparkle::after {
  content: "";
  position: absolute;
  background: #fff8d0;
  box-shadow: 0 0 5px #ffe98a;
}
.sparkle::before { inset: 3px 0; }
.sparkle::after  { inset: 0 3px; }
.sparkle:nth-child(1) { left: 16%; top: 20%; --d: 0s; }
.sparkle:nth-child(2) { left: 74%; top: 15%; --d: 0.5s; }
.sparkle:nth-child(3) { left: 84%; top: 46%; --d: 1s; }
.sparkle:nth-child(4) { left: 10%; top: 52%; --d: 1.5s; }
.sparkle:nth-child(5) { left: 46%; top: 8%;  --d: 0.8s; }
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
  50%      { opacity: var(--sparkle-op, 1); transform: scale(1) rotate(45deg); }
}

/* speech bubble */
.speech {
  position: absolute;
  left: 50%;
  top: 4%;
  transform: translateX(-50%);
  max-width: 84%;
  padding: 7px 12px;
  border-radius: 14px;
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  color: var(--text);
  font-size: 0.86rem;
  text-align: center;
  text-wrap: balance;
  z-index: 5;
  animation: pop 0.35s ease;
}
.speech::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  width: 10px;
  height: 10px;
  transform: translateX(-50%) rotate(45deg);
  background: var(--panel);
  border-right: 2px solid var(--panel-edge);
  border-bottom: 2px solid var(--panel-edge);
}
@keyframes pop {
  from { transform: translateX(-50%) scale(0.85); opacity: 0; }
  to   { transform: translateX(-50%) scale(1); opacity: 1; }
}

/* ============================================================
   THE CHARACTERS
   Both sprites share the same group class names, so one animation
   system and one set of band tokens drive either species.
   ============================================================ */
.pet {
  position: relative;
  z-index: 4;
  width: 56%;
  max-width: 208px;
  margin-bottom: 2%;
  /* The artboard is not the clip boundary, the scene is. An outer svg is
     overflow: hidden by default, and the unicorn's horn ends at y 0 with the
     viewBox opening at -1, which the feMorphology outline spends entirely:
     at rest the ink sits exactly on the edge, so every animation that lifts
     the sprite cuts the horn off. Measured lift above the edge, in artboard
     units: 1.15 for the idle bob at hydrated, 1.92 for the sip hop, 2.35 for
     the gurgle wobble, 9.54 for the species morph. Growing the viewBox
     instead would mean changing it for all three species, since it is part of
     the contract they share, and adding empty rows to fit the rarest case.
     The scene is overflow: hidden and much taller than the sprite, so nothing
     can escape the picture either way. */
  overflow: visible;
  filter: saturate(var(--sat, 1)) brightness(var(--bri, 1));
  transition: filter 0.7s ease;
  grid-area: 1 / 1;
  align-self: end;
  justify-self: center;
}
.pet g { transform-box: fill-box; }
.pet-shadow { fill: rgba(0, 0, 0, 0.13); }
#petInk feFlood { flood-color: var(--ink); }

/* One rule, not one per ordered pair. Pairing needed two selectors for two
   species, six for three and twelve for four, and CSS cannot compare two
   attribute values, so the answer is to stop asking it to: applySpecies sets
   the attribute and this hides whatever carries it. Note that it has to be
   setAttribute rather than el.hidden, because these are SVG elements and
   hidden is a property of HTMLElement: the assignment would set a harmless
   expando, no attribute would land, and the unselected creature would render
   behind the chosen one. */
.pet[hidden] { display: none; }

.pet-all {
  transform-origin: 50% 100%;
  transform: translateY(var(--sink, 0)) rotate(var(--droop, 0deg));
  transition: transform 0.7s ease;
}
.pet-bob   { animation: bob var(--bob-dur, 3s) ease-in-out infinite; }
.pet-head  { transform-origin: 50% 100%; animation: nod var(--head-dur, 4s) ease-in-out infinite; }
.pet-tail  { transform-origin: 0% 100%;  animation: swish var(--tail-dur, 2s) ease-in-out infinite; }
.pet-ear-r { transform-origin: 50% 100%; animation: twitch 5.5s ease-in-out infinite; }
.pet-eyes  { transform-origin: 50% 50%;  animation: blink 6.5s ease-in-out infinite; }

@keyframes bob    { 0%, 100% { transform: translateY(calc(var(--bob-amp) * -1)); } 50% { transform: translateY(var(--bob-amp)); } }
@keyframes nod    { 0%, 100% { transform: rotate(calc(var(--head-amp) * -1)); } 50% { transform: rotate(var(--head-amp)); } }
@keyframes swish  { 0%, 100% { transform: rotate(calc(var(--tail-amp) * -1)); } 50% { transform: rotate(var(--tail-amp)); } }
@keyframes twitch { 0%, 88%, 100% { transform: rotate(0deg); } 92% { transform: rotate(-11deg); } 96% { transform: rotate(4deg); } }
@keyframes blink  { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.12); } }

.pet-lid   { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(var(--lid, 0)); transition: transform 0.5s ease; }
.pet-smile { opacity: var(--smile-op, 1); transition: opacity 0.4s ease; }
.pet-frown { opacity: var(--frown-op, 0); transition: opacity 0.4s ease; }

/* drink reaction */
.scene.is-sipping .pet-bob { animation: sip-hop 0.5s ease; }
@keyframes sip-hop {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  25%      { transform: translateY(-7%) scale(0.97, 1.04); }
  60%      { transform: translateY(0) scale(1.04, 0.96); }
}
.scene.is-gurgling .pet-all { animation: wobble 0.7s ease; }
@keyframes wobble {
  0%, 100% { transform: translateY(var(--sink)) rotate(var(--droop)); }
  20%      { transform: translateY(var(--sink)) rotate(-7deg) scale(1.05, 0.95); }
  50%      { transform: translateY(var(--sink)) rotate(7deg) scale(0.95, 1.05); }
  80%      { transform: translateY(var(--sink)) rotate(-3deg); }
}
.scene.is-morphing .pet-all { animation: morph 0.6s ease; }
@keyframes morph {
  0%   { transform: translateY(var(--sink)) scale(0.7, 1.3); opacity: 0.2; }
  55%  { transform: translateY(var(--sink)) scale(1.15, 0.9); opacity: 1; }
  100% { transform: translateY(var(--sink)) rotate(var(--droop)) scale(1, 1); }
}

/* floating droplets on drink */
.drops { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.drop {
  position: absolute;
  left: 50%;
  bottom: 34%;
  font-size: 1.1rem;
  opacity: 0;
  animation: floatup 1.1s ease-out forwards;
}
@keyframes floatup {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
  25%  { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -80px) scale(1.15); }
}

/* ============================================================
   METER / STATS / ACTIONS / SETTINGS
   ============================================================ */
.block { padding: 12px 14px; }

.meter-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.meter-head .label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); }
.meter-head .value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.meter-track {
  height: 22px;
  border-radius: 11px;
  background: var(--meter-bg);
  border: 2px solid var(--panel-edge);
  overflow: hidden;
  padding: 2px;
}
.meter-fill {
  height: 100%;
  min-width: 4px;
  border-radius: 9px;
  background: var(--meter-fill);
  transition: width 0.55s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.mood-line { margin: 8px 0 0; font-size: 0.85rem; color: var(--text-soft); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--meter-bg);
  text-align: center;
}
.stat dt { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-soft); }
.stat dd { margin: 3px 0 0; font-size: 1.02rem; font-weight: 700; }

.actions { display: grid; gap: 10px; }
.btn {
  min-height: 44px;
  padding: 14px 18px;
  border: none;
  border-radius: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, filter 0.2s ease;
}
.btn:active { transform: translateY(3px) scale(0.99); }
.btn-drink {
  min-height: 68px;
  font-size: 1.18rem;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
}
.btn-drink:active { box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
/* Reset sits under the drink button and still has to be findable. On
   --text-soft over --panel-edge it read as disabled rather than secondary, so
   it takes the full --text and a border one step in from the panel edge. Both
   are tokens, so "darker" resolves as darker in day and glitter and as lighter
   against the night panel, which is the same intent either way: more present,
   without competing with the drink button. */
.btn-ghost {
  background: transparent;
  border: 2px solid var(--text-soft);
  color: var(--text);
  font-size: 0.9rem;
  padding: 10px 14px;
}

details.settings summary {
  padding: 12px 14px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.92rem;
  list-style: none;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
}
/* Sits between the disclosure triangle and the label, on the summary's own
   8px gap. Emoji carry their own colour, so this only sets the size. */
.summary-icon { font-size: 1rem; line-height: 1; }
details.settings summary::-webkit-details-marker { display: none; }
details.settings summary::before { content: "\25B8"; transition: transform 0.2s ease; }
details.settings[open] summary::before { transform: rotate(90deg); }

.setting {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  min-height: 44px;
  font-size: 0.9rem;
}
.setting label { flex: 1; }
.setting input[type="checkbox"] { width: 26px; height: 26px; accent-color: var(--accent); }
.setting input[type="text"] {
  flex: none;
  width: 52%;
  min-width: 0;
  padding: 7px 10px;
  border: 2px solid var(--panel-edge);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 0.86rem;
  text-align: right;
}

.setting-slider { display: block; padding: 10px 14px 12px; }
.setting-row { display: flex; align-items: baseline; gap: 10px; }
.setting-row label { flex: 1; }
.setting-row output { font-weight: 700; font-variant-numeric: tabular-nums; }
.setting-scale {
  display: flex;
  justify-content: space-between;
  margin-top: -1px;
  font-size: 0.7rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-soft);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 34px;                 /* finger-friendly area around a 12px track */
  margin: 2px 0 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 12px;
  border-radius: 6px;
  background: var(--meter-bg);
  border: 2px solid var(--panel-edge);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  margin-top: -7px;             /* centres the thumb on the track */
  border-radius: 9px;
  background: var(--accent);
  border: 3px solid var(--panel);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}
input[type="range"]::-moz-range-track {
  height: 12px;
  border-radius: 6px;
  background: var(--meter-bg);
  border: 2px solid var(--panel-edge);
}
input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 8px;
  background: var(--accent);
  border: 3px solid var(--panel);
}

/* language segmented control */
.langs { display: flex; gap: 6px; }
.lang-btn {
  min-height: 40px;
  padding: 6px 12px;
  border: 2px solid var(--panel-edge);
  border-radius: 12px;
  background: transparent;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-soft);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
/* The language buttons report aria-pressed and the creature radios report
   aria-checked, so the selected style has to answer to both. Keyed on only the
   first, the chosen creature had no highlight at all. */
.lang-btn[aria-pressed="true"],
.lang-btn[aria-checked="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* ---------- footer, with the secret toggle bottom right ---------- */
.foot {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px;
}
.note {
  flex: 1;
  font-size: 0.74rem;
  color: var(--text-soft);
  text-align: center;
  margin: 0;
  padding-left: 30px;           /* balances the secret button so the note stays centred */
}
/* Deliberately quiet: discoverable if you look, invisible if you do not.
   Still a real button with a real label, so assistive tech and keyboards
   can reach it. */
.secret {
  width: 30px;
  height: 30px;
  flex: none;
  border: none;
  background: none;
  color: var(--text-soft);
  opacity: 0.22;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  border-radius: 10px;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.secret:hover, .secret:focus-visible { opacity: 0.85; transform: rotate(90deg); }
.secret:active { transform: rotate(90deg) scale(0.85); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ============================================================
   REDUCED MOTION  (idle and decorative motion is non-essential)
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .pet, .pet * { animation: none !important; transition: none !important; }
  .sparkle { animation: none !important; opacity: var(--sparkle-op, 1); transform: rotate(45deg); }
  .rainbow, .stars, .body { transition: none !important; }
  .amb { display: none !important; }
  .wind svg, .wind .trail, .wind .speck { animation: none !important; }
  .wind .trail { stroke-dashoffset: 0 !important; }
  .wind .speck { opacity: 0.6 !important; }
  /* Stopping the swap would leave all three poses stacked, so hold the flock
     on the mid pose rather than on all of them. */
  .bird .pose { animation: none !important; opacity: 0 !important; }
  .bird .pose-mid { opacity: 1 !important; }
  .drop { animation: none !important; opacity: 0 !important; }
  /* The scenery holds still rather than disappearing. A firefly that cannot
     blink is still a firefly, and it is the only thing in the night sky at
     ground level, so it holds lit rather than dark. */
  .cloud, .tuft { animation: none !important; }
  .cloud { transform: translateX(70%); }
  .fly { animation: none !important; opacity: calc(0.8 * var(--amb-mood, 1)); }
  .secret:hover, .secret:focus-visible { transform: none; }
  [data-tip]::after { transition: none !important; transform: none !important; }
  /* Glitter still looks like itself under reduced motion, it just holds
     still: no sheen rotation, and the engine spawns nothing at all. */
  .glit-sheen { animation: none !important; }
  .glit-themes button { transition-duration: 1ms !important; }
}

/* ============================================================
   V2 LAYOUT
   Appended rather than woven in, so every rule the redesign adds or overrides
   is in one place and the diff against the app stays readable. The rules it
   supersedes (.meter-*, .stats, .actions, details.settings) are left above as
   dead weight: prototype debt, to be deleted when this merges.
   ============================================================ */

:root {
  --r-sm: 12px;
  --r-lg: 18px;
  --r-pill: 999px;
  --tube-w: 56px;
  /* --meter-fill turned on its side. Same two stops, same order. */
  --meter-fill-v: linear-gradient(180deg, #6fc7ff, #4aa3f0);
  /* Two steps darker: --text-soft on --meter-bg was near 4.3:1 at 0.72rem. */
  --text-soft: #6d5c7e;
  /* A pink ring beside a blue accent read as an unrelated system. */
  --focus: var(--accent);
}
:root[data-theme="night"]   { --meter-fill-v: linear-gradient(180deg, #6fc6f0, #7f6bff); }
:root[data-theme="glitter"] { --meter-fill-v: linear-gradient(180deg, #ff77c8, #b06bff);
                              --text-soft: #834a6e; }

/* Two-tone focus ring. The accent alone is 2.64:1 on the panel and invisible
   on the drink button, which is filled with the accent; the light separator in
   the offset gap means the ring never has to contrast with the control it is
   hugging. */
:where(button, input, select, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
  box-shadow: 0 0 0 3px var(--panel);
}

/* The dock is fixed, so the flow needs its height back. */
body { padding-bottom: calc(104px + env(safe-area-inset-bottom)); }

/* Only the scene keeps a border and a shadow, so the screen has one focus
   instead of six panels of equal weight. */
.panel { border: 0; box-shadow: none; background: var(--panel); }
@supports (background: color-mix(in oklab, red 50%, transparent)) {
  .panel { background: color-mix(in oklab, var(--panel) 62%, transparent); }
}

/* ---------- top bar ---------- */
.topbar {
  flex-wrap: nowrap;              /* theme and language have left; nothing wraps */
  padding: 2px 2px;
  background: none;
}
.topbar h1 {
  flex: 1; min-width: 0;
  font-size: 1.06rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: 44px; height: 44px; min-width: 44px; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: var(--r-sm);
  background: var(--panel);
}
@supports (background: color-mix(in oklab, red 50%, transparent)) {
  .icon-btn { background: color-mix(in oklab, var(--panel) 70%, transparent); }
}
.icon-btn[aria-pressed="false"] { background: transparent; opacity: 1; }
.icon-btn[aria-pressed="true"]  { background: var(--meter-bg); }
.ico { width: 22px; height: 22px; display: block; }

/* ---------- stage ---------- */
.stage { display: flex; gap: 12px; align-items: stretch; }
.stage-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

/* aspect-ratio is the floor and flex-grow is the ceiling: a tall phone gets
   more sky, a short one gives some back, and the scene never drops below the
   height the sprite needs. The sprite is 56% of the scene's width and rises up
   to 9.54 artboard units above its own viewBox during a species morph, which
   works out to a floor of H >= 0.73 W. 0.78 leaves 12.4 units of headroom. */
.scene {
  aspect-ratio: 1 / 0.78;
  flex: 1 1 auto;
  min-height: 0;
  border-radius: var(--r-lg);
}

/* ---------- the tube ---------- */
.tube {
  position: relative; flex: none;
  width: var(--tube-w);
  border-radius: var(--r-pill);
  background: var(--meter-bg);
  border: 2px solid var(--panel-edge);
  overflow: hidden;
}
.tube-fill {
  position: absolute; inset: auto 0 0 0;
  height: 75%;
  background: var(--meter-fill-v);
  border-radius: var(--r-pill) var(--r-pill) 0 0;
  transition: height 0.55s cubic-bezier(0.3, 1.4, 0.5, 1);
}
/* A surface line, so the water reads as water and not as a filled bar. */
.tube-fill::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: rgb(255 255 255 / 0.55);
}
/* The number rides the surface: one value, one place, no second read-out. */
.tube-num {
  position: absolute; left: 0; right: 0; top: 6px;
  text-align: center;
  font-size: 0.95rem; font-weight: 700; font-variant-numeric: tabular-nums;
  color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / 0.28);
}
/* Below 14% the fill is too short to hold the label, so it steps outside. */
.tube[data-low="yes"] .tube-num {
  top: auto; bottom: calc(100% + 4px);
  color: var(--text); text-shadow: none;
}

/* ---------- drop pips ---------- */
.pips { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; min-height: 17px; }
.pip {
  width: 17px; height: 17px; flex: none;
  border: 2px solid var(--panel-edge);
  border-radius: 50% 50% 50% 0 / 50% 50% 50% 0;
  transform: rotate(-45deg);
  background: transparent;
  transition: background 0.3s ease, transform 0.3s ease;
}
@supports (border-color: color-mix(in oklab, red 50%, blue)) {
  .pip { border-color: color-mix(in oklab, var(--panel-edge) 70%, var(--text-soft)); }
}
.pip[data-on="yes"] { background: var(--accent); }
/* Drinking past the goal keeps counting, in a second tone. */
.pip[data-extra="yes"] { background: var(--accent); opacity: 0.45; }
.pips-label {
  margin: 0; font-size: 0.72rem; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-soft);
  font-variant-numeric: tabular-nums;
}

/* Goal met gets its own moment, separate from the rainbow and the shooting
   star, which are earned by the meter reading 95+ on a different clock. */
.pips[data-goal="met"] .pip[data-on="yes"] { animation: pip-cheer 0.5s ease backwards; }
.pips[data-goal="met"] .pip:nth-child(2) { animation-delay: 0.05s; }
.pips[data-goal="met"] .pip:nth-child(3) { animation-delay: 0.10s; }
.pips[data-goal="met"] .pip:nth-child(4) { animation-delay: 0.15s; }
.pips[data-goal="met"] .pip:nth-child(5) { animation-delay: 0.20s; }
.pips[data-goal="met"] .pip:nth-child(6) { animation-delay: 0.25s; }
.pips[data-goal="met"] .pip:nth-child(7) { animation-delay: 0.30s; }
.pips[data-goal="met"] .pip:nth-child(8) { animation-delay: 0.35s; }
@keyframes pip-cheer {
  0%, 100% { transform: rotate(-45deg) scale(1); }
  50%      { transform: rotate(-45deg) scale(1.45); }
}

/* ---------- side, below the scene ---------- */
.side-bottom { display: flex; flex-direction: column; gap: 4px; }
.mood-line { margin: 4px 0 0; }
.last-line { margin: 0; font-size: 0.8rem; color: var(--text-soft); }

/* ---------- the dock ---------- */
.dock {
  position: fixed; inset: auto 0 0 0; z-index: 6;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--panel);
  border-top: 2px solid var(--panel-edge);
}
@supports (backdrop-filter: blur(6px)) or (-webkit-backdrop-filter: blur(6px)) {
  @supports (background: color-mix(in oklab, red 50%, transparent)) {
    .dock {
      background: color-mix(in oklab, var(--panel) 92%, transparent);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
  }
}
.dock .btn-drink {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  border-radius: var(--r-lg);
  max-width: 400px; margin: 0 auto;
}
.btn-drink .ico { width: 24px; height: 24px; }

/* ---------- the sheet ---------- */
.sheet {
  width: 100%; max-width: 520px; max-height: 82vh;
  margin: auto auto 0;
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
  border: 0; border-top: 2px solid var(--panel-edge);
  border-radius: 26px 26px 0 0;
  background: var(--panel); color: var(--text);
  font: inherit;
  animation: sheet-up 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.sheet::backdrop { background: rgb(0 0 0 / 0.38); }
@keyframes sheet-up { from { transform: translateY(14%); opacity: 0.4; } }
/* Where showModal does not exist the sheet is a plain panel with a drawn
   scrim: nothing is trapped, but nothing is unreachable either. */
.sheet.is-fallback { position: fixed; inset: auto 0 0 0; z-index: 20; display: block; }
.sheet-scrim { position: fixed; inset: 0; z-index: 19; background: rgb(0 0 0 / 0.38); }
.sheet-grab {
  width: 44px; height: 5px; border-radius: var(--r-pill);
  background: var(--panel-edge); margin: 0 auto 8px;
}
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.sheet-head h2 { margin: 0; flex: 1; font-size: 1.16rem; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet-group {
  margin: 16px 0 4px; font-size: 0.72rem; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--text-soft); font-weight: 700;
}
.sheet-hint { margin: 2px 0 0; font-size: 0.76rem; color: var(--text-soft); }
.sheet .setting { padding: 8px 0; }
.sheet .btn-ghost {
  width: 100%; margin-top: 18px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}

/* The segmented pill, full width inside the sheet. */
.seg {
  display: flex; gap: 3px; padding: 3px; margin-top: 6px;
  border-radius: var(--r-pill); background: var(--meter-bg);
}
.seg button {
  flex: 1; min-height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; border-radius: var(--r-pill); background: transparent;
  color: var(--text); font: inherit; font-size: 0.84rem; font-weight: 700;
  cursor: pointer; transition: background 0.2s ease;
}
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.22);
}
.seg .lang-btn { border: 0; }

.setting-step { display: flex; align-items: center; gap: 10px; }
.setting-step > span:first-child { flex: 1; }
.step-btn {
  width: 44px; height: 44px; flex: none;
  border: 2px solid var(--panel-edge); border-radius: var(--r-sm);
  background: transparent; color: var(--text);
  font: inherit; font-size: 1.1rem; font-weight: 700; cursor: pointer;
}
.step-val {
  min-width: 32px; text-align: center; font-weight: 700;
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: reduce) {
  .tube-fill { transition: none; }
  .sheet { animation: none; }
  .pips[data-goal="met"] .pip[data-on="yes"] {
    animation: none;
    box-shadow: 0 0 0 3px var(--accent);
  }
}

/* ---------- desktop ---------- */
@media (min-width: 840px) {
  body { align-items: center; padding-bottom: 12px; }
  .app {
    max-width: 940px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "stage sidetop"
      "stage sidebottom"
      "foot  sidebottom";
    gap: 14px 22px;
  }
  .stage { grid-area: stage; flex-direction: row-reverse; }  /* tube to the left */
  .side-top { grid-area: sidetop; }
  .side-bottom { grid-area: sidebottom; gap: 10px; }
  .foot { grid-area: foot; }
  .scene { min-height: 420px; }
  .dock {
    position: static; margin-top: auto; padding: 0;
    background: none; border: 0;
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  .dock .btn-drink { max-width: none; }
}
</style>
</head>
<body>

<div class="glit-sheen" aria-hidden="true"></div>
<canvas class="glit-canvas" id="glitCanvas" aria-hidden="true"></canvas>

<main class="app">

  <!-- ---------- side, above the scene ----------
       Two side blocks rather than one, because the scene sits between them on
       a phone and a wrapper cannot be split around it. On desktop the grid
       stacks them into the right-hand column. -->
  <div class="side-top">
    <header class="topbar">
      <span class="glit-deco" aria-hidden="true">&#127872;</span>
      <h1 id="appTitle">Aniluna Aqua Buddy</h1>
      <button class="icon-btn" id="infoBtn" type="button" aria-expanded="false" aria-controls="infoCard">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-info"/></svg>
      </button>
      <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sound" id="soundIcon"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button"
              aria-haspopup="dialog" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-gear"/></svg>
      </button>
      <span class="sr-only" id="themeStatus" role="status"></span>
    </header>

    <section class="panel info" id="infoCard" hidden>
      <p id="infoBody"></p>
      <p class="tip" id="infoTip"></p>
    </section>
  </div>

  <!-- ---------- stage: the scene, the pips, and the tube beside them ----------
       The tube is a sibling of the scene, never a child: the scene is
       overflow:hidden and the tube has to stand outside it. -->
  <div class="stage">
   <div class="stage-main">
  <section class="scene" id="scene" data-band="okay" data-species="unicorn" data-radiant="off"
           data-daystars="off"
           aria-labelledby="sceneCaption">
    <p class="sr-only" id="sceneCaption"></p>
    <div class="stars" aria-hidden="true"></div>

    <!-- Scenery, filled by UI.buildScenery at startup. Fixtures rather than
         ambient kinds: they do not spawn, drift or expire, which is exactly
         what makes them something for the drifters to cross. -->
    <div class="clouds" id="clouds" aria-hidden="true"></div>
    <div class="hills" aria-hidden="true">
      <svg viewBox="0 0 100 22" preserveAspectRatio="none" aria-hidden="true">
        <path class="far" d="M0 22 L0 12 Q12 4 24 11 Q34 17 46 9 Q58 2 70 10 Q82 17 100 8 L100 22 Z"/>
        <path class="near" d="M0 22 L0 17 Q14 10 28 16 Q40 21 54 15 Q68 9 82 16 Q92 20 100 15 L100 22 Z"/>
      </svg>
    </div>
    <div class="meadow" id="meadow" aria-hidden="true"></div>
    <div class="fireflies" id="fireflies" aria-hidden="true"></div>

    <div class="sky" aria-hidden="true">
      <div class="body sun" id="sun" data-visible="no"></div>
      <div class="body moon" id="moon" data-visible="no"></div>
    </div>
    <div class="ambient" id="ambient" aria-hidden="true"></div>

    <svg class="rainbow" viewBox="0 0 100 52" aria-hidden="true">
      <path d="M6 52a44 44 0 0 1 88 0"       stroke="#ff9aa9"/>
      <path d="M9.5 52a40.5 40.5 0 0 1 81 0" stroke="#ffc98a"/>
      <path d="M13 52a37 37 0 0 1 74 0"      stroke="#ffef9c"/>
      <path d="M16.5 52a33.5 33.5 0 0 1 67 0" stroke="#a8e6a3"/>
      <path d="M20 52a30 30 0 0 1 60 0"      stroke="#98d4f5"/>
      <path d="M23.5 52a26.5 26.5 0 0 1 53 0" stroke="#b7a6ff"/>
    </svg>

    <div class="sparkles" aria-hidden="true">
      <i class="sparkle"></i><i class="sparkle"></i><i class="sparkle"></i>
      <i class="sparkle"></i><i class="sparkle"></i>
    </div>

    <p class="speech" id="speech"></p>
    <div class="drops" id="drops" aria-hidden="true"></div>

    <!-- One outline filter, shared by both sprites. feMorphology dilates the
         whole silhouette by one grid unit, so each part only needs its fill. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="petInk" x="-20%" y="-20%" width="140%" height="140%"
                color-interpolation-filters="sRGB">
          <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="grown"/>
          <feFlood flood-color="#2a2036" result="inkColor"/>
          <feComposite in="inkColor" in2="grown" operator="in" result="outline"/>
          <feMerge>
            <feMergeNode in="outline"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <!-- ===== unicorn ===== -->
    <svg class="pet pet-unicorn" data-species="unicorn" viewBox="0 -1 32 31" shape-rendering="crispEdges" aria-hidden="true">
      <ellipse class="pet-shadow" cx="16" cy="28.4" rx="7" ry="1.1"/>
      <g class="pet-all">
        <g class="pet-bob">
          <g filter="url(#petInk)">

            <g class="pet-tail">
              <rect x="19" y="21" width="2" height="4" fill="var(--mane-1)"/>
              <rect x="21" y="20" width="2" height="4" fill="var(--mane-2)"/>
              <rect x="23" y="18" width="2" height="4" fill="var(--mane-3)"/>
            </g>

            <!-- The side mane, drawn before the head so it sits beside it. It
                 starts on row 8, the first row where the head is at its full
                 width of columns 9 to 22, and not on row 7 where the head has
                 pulled in to 10-21: a block reaching past a narrowing head,
                 one row under the ear, reads as a lump on the skull rather
                 than as hair. Its partner is the strip inside pet-head. -->
            <rect x="4" y="10" width="2" height="8"  fill="var(--mane-3)"/>
            <rect x="6" y="8"  width="3" height="12" fill="var(--mane-1)"/>

            <rect x="12" y="24" width="3" height="4" fill="var(--coat)"/>
            <rect x="17" y="24" width="3" height="4" fill="var(--coat)"/>
            <rect x="12" y="27" width="3" height="1" fill="var(--hoof)"/>
            <rect x="17" y="27" width="3" height="1" fill="var(--hoof)"/>

            <rect x="12" y="19" width="8" height="6" fill="var(--coat)"/>
            <rect x="12" y="24" width="8" height="1" fill="var(--coat-shade)"/>

            <rect x="9"  y="3" width="3" height="4" fill="var(--coat)"/>
            <rect x="10" y="4" width="1" height="2" fill="var(--blush)"/>
            <g class="pet-ear-r">
              <rect x="20" y="3" width="3" height="4" fill="var(--coat)"/>
              <rect x="21" y="4" width="1" height="2" fill="var(--blush)"/>
            </g>

            <g class="pet-head">
              <rect x="11" y="6"  width="10" height="1"  fill="var(--coat)"/>
              <rect x="10" y="7"  width="12" height="1"  fill="var(--coat)"/>
              <rect x="9"  y="8"  width="14" height="10" fill="var(--coat)"/>
              <rect x="10" y="18" width="12" height="1"  fill="var(--coat-shade)"/>
              <rect x="11" y="19" width="10" height="1"  fill="var(--coat-shade)"/>

              <rect x="15" y="0" width="2" height="3" fill="var(--horn)"/>
              <rect x="15" y="2" width="2" height="1" fill="var(--horn-shade)"/>
              <rect x="14" y="3" width="4" height="3" fill="var(--horn)"/>
              <rect x="14" y="4" width="2" height="1" fill="var(--horn-shade)"/>
              <rect x="14" y="5" width="4" height="1" fill="var(--horn-shade)"/>

              <!-- The mane inside the head follows the head's own outline
                   rather than squaring it off: column 10 from row 7, column 9
                   from row 8, which is where each of them joins the coat
                   above. One rect spanning both from row 6 fills in the
                   rounded top-left corner the right side keeps, and an
                   asymmetric head is what the eye reports as a bump. -->
              <rect x="10" y="7" width="1" height="11" fill="var(--mane-2)"/>
              <rect x="9"  y="8" width="1" height="10" fill="var(--mane-2)"/>
              <rect x="11" y="6" width="4" height="3"  fill="var(--mane-1)"/>
              <rect x="15" y="7" width="4" height="2"  fill="var(--mane-3)"/>

              <rect x="14" y="15" width="4" height="4" fill="var(--muzzle)"/>
              <rect x="14" y="16" width="1" height="1" fill="var(--coat-shade)"/>
              <rect x="17" y="16" width="1" height="1" fill="var(--coat-shade)"/>
              <rect x="11" y="16" width="2" height="2" fill="var(--blush)"/>
              <rect x="19" y="16" width="2" height="2" fill="var(--blush)"/>

              <g class="pet-eyes">
                <rect x="11" y="12" width="3" height="3" fill="var(--ink)"/>
                <rect x="18" y="12" width="3" height="3" fill="var(--ink)"/>
                <rect x="11" y="12" width="1" height="1" fill="var(--eye-glint)"/>
                <rect x="18" y="12" width="1" height="1" fill="var(--eye-glint)"/>
                <rect class="pet-lid" x="11" y="12" width="3" height="2" fill="var(--coat)"/>
                <rect class="pet-lid" x="18" y="12" width="3" height="2" fill="var(--coat)"/>
              </g>

              <g class="pet-smile">
                <rect x="14" y="17" width="1" height="1" fill="var(--ink)"/>
                <rect x="15" y="18" width="2" height="1" fill="var(--ink)"/>
                <rect x="17" y="17" width="1" height="1" fill="var(--ink)"/>
              </g>
              <g class="pet-frown">
                <rect x="14" y="18" width="1" height="1" fill="var(--ink)"/>
                <rect x="15" y="17" width="2" height="1" fill="var(--ink)"/>
                <rect x="17" y="18" width="1" height="1" fill="var(--ink)"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <!-- ===== dinosaur ===== -->
    <svg class="pet pet-dino" data-species="dinosaur" viewBox="0 -1 32 31" shape-rendering="crispEdges" aria-hidden="true">
      <ellipse class="pet-shadow" cx="16" cy="28.4" rx="7.5" ry="1.1"/>
      <g class="pet-all">
        <g class="pet-bob">
          <g filter="url(#petInk)">

            <!-- Thick and curling upward, as in the reference, rather than the
                 thin taper this species had before. Spiked along its top edge,
                 which is the ridge the reference runs down the back. -->
            <g class="pet-tail">
              <rect x="21" y="21" width="3" height="4" fill="var(--skin)"/>
              <rect x="23" y="19" width="3" height="4" fill="var(--skin)"/>
              <rect x="25" y="16" width="2" height="4" fill="var(--skin-shade)"/>
              <rect x="24" y="18" width="2" height="1" fill="var(--spike)"/>
              <rect x="26" y="15" width="2" height="1" fill="var(--spike)"/>
            </g>

            <!-- Chunky legs, standing. -->
            <rect x="11" y="25" width="4" height="3" fill="var(--skin)"/>
            <rect x="17" y="25" width="4" height="3" fill="var(--skin)"/>
            <rect x="11" y="27" width="4" height="1" fill="var(--claw)"/>
            <rect x="17" y="27" width="4" height="1" fill="var(--claw)"/>

            <rect x="11" y="18" width="10" height="1" fill="var(--skin)"/>
            <rect x="10" y="19" width="12" height="6" fill="var(--skin)"/>
            <rect x="11" y="25" width="10" height="1" fill="var(--skin)"/>
            <rect x="12" y="20" width="8"  height="5" fill="var(--belly)"/>
            <!-- Belly ridges, which the reference draws as banding. -->
            <rect x="12" y="22" width="8"  height="1" fill="var(--skin-shade)"/>

            <!-- Shoulder spikes: the back ridge, as much of it as a front view
                 can show, running down towards the tail. -->
            <rect x="21" y="19" width="2" height="2" fill="var(--spike)"/>
            <rect x="22" y="21" width="2" height="1" fill="var(--spike-shade)"/>

            <!-- Small arms, because it is a small-armed animal. -->
            <rect x="8"  y="20" width="2" height="3" fill="var(--skin)"/>
            <rect x="22" y="20" width="2" height="3" fill="var(--skin)"/>
            <rect x="8"  y="22" width="2" height="1" fill="var(--claw)"/>
            <rect x="22" y="22" width="2" height="1" fill="var(--claw)"/>

            <g class="pet-head">
              <!-- 18 wide, matching the panda, so all three read at the same
                   scale next to each other. -->
              <rect x="10" y="4"  width="12" height="1"  fill="var(--skin)"/>
              <rect x="9"  y="5"  width="14" height="1"  fill="var(--skin)"/>
              <rect x="7"  y="6"  width="18" height="10" fill="var(--skin)"/>
              <rect x="8"  y="16" width="16" height="2"  fill="var(--skin)"/>
              <rect x="10" y="18" width="12" height="1"  fill="var(--skin-shade)"/>

              <!-- Head plates, rounder than the old three-point crest. -->
              <rect x="10" y="2" width="3" height="2" fill="var(--spike)"/>
              <rect x="15" y="1" width="3" height="3" fill="var(--spike)"/>
              <rect x="20" y="2" width="3" height="2" fill="var(--spike)"/>
              <rect x="10" y="3" width="3" height="1" fill="var(--spike-shade)"/>
              <rect x="15" y="3" width="3" height="1" fill="var(--spike-shade)"/>
              <rect x="20" y="3" width="3" height="1" fill="var(--spike-shade)"/>

              <!-- A wide pale muzzle with nostrils and a row of teeth, which is
                   what carries the reference's face into a front view. -->
              <rect x="11" y="13" width="10" height="5" fill="var(--belly)"/>
              <rect x="13" y="14" width="1"  height="1" fill="var(--skin-shade)"/>
              <rect x="18" y="14" width="1"  height="1" fill="var(--skin-shade)"/>
              <rect x="12" y="16" width="1"  height="1" fill="var(--claw)"/>
              <rect x="14" y="16" width="1"  height="1" fill="var(--claw)"/>
              <rect x="16" y="16" width="1"  height="1" fill="var(--claw)"/>
              <rect x="18" y="16" width="1"  height="1" fill="var(--claw)"/>
              <rect x="20" y="16" width="1"  height="1" fill="var(--claw)"/>

              <!-- Orange, as in the reference, which the spike token already
                   provides rather than needing a new colour. -->
              <rect x="7"  y="13" width="2" height="2" fill="var(--spike)"/>
              <rect x="23" y="13" width="2" height="2" fill="var(--spike)"/>

              <g class="pet-eyes">
                <!-- Bigger than the other two species, with two highlights,
                     which is the reference's most distinctive feature. -->
                <rect x="9"  y="8"  width="4" height="4" fill="var(--ink)"/>
                <rect x="19" y="8"  width="4" height="4" fill="var(--ink)"/>
                <rect x="9"  y="8"  width="2" height="1" fill="var(--eye-glint)"/>
                <rect x="19" y="8"  width="2" height="1" fill="var(--eye-glint)"/>
                <rect x="11" y="10" width="1" height="1" fill="var(--eye-glint)"/>
                <rect x="21" y="10" width="1" height="1" fill="var(--eye-glint)"/>
                <rect class="pet-lid" x="9"  y="8" width="4" height="3" fill="var(--skin)"/>
                <rect class="pet-lid" x="19" y="8" width="4" height="3" fill="var(--skin)"/>
              </g>

              <g class="pet-smile">
                <rect x="12" y="17" width="1" height="1" fill="var(--ink)"/>
                <rect x="13" y="18" width="6" height="1" fill="var(--ink)"/>
                <rect x="19" y="17" width="1" height="1" fill="var(--ink)"/>
              </g>
              <g class="pet-frown">
                <rect x="12" y="18" width="1" height="1" fill="var(--ink)"/>
                <rect x="13" y="17" width="6" height="1" fill="var(--ink)"/>
                <rect x="19" y="18" width="1" height="1" fill="var(--ink)"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>
    <svg class="pet pet-panda" data-species="panda" viewBox="0 -1 32 31" shape-rendering="crispEdges" aria-hidden="true">
      <ellipse class="pet-shadow" cx="16" cy="28.4" rx="7.5" ry="1.1"/>
      <g class="pet-all">
        <g class="pet-bob">
          <g filter="url(#petInk)">

            <!-- Empty on purpose. A panda's tail is tiny and hidden from the
                 front; drawn as a nub at the hip it reads as a blemish, not a
                 tail. The group stays so the shared swish has a target and
                 this species needs no special case. -->
            <g class="pet-tail"></g>

            <!-- Standing, like the other two, on two stubby dark legs. -->
            <rect x="11" y="25" width="4" height="3" fill="var(--patch)"/>
            <rect x="17" y="25" width="4" height="3" fill="var(--patch)"/>
            <rect x="11" y="27" width="4" height="1" fill="var(--paw)"/>
            <rect x="17" y="27" width="4" height="1" fill="var(--paw)"/>

            <!-- Body 12 wide under an 18 wide head. The head owning the
                 silhouette is what makes it read cute rather than realistic,
                 and the wide belly is most of the chubbiness. -->
            <rect x="11" y="18" width="10" height="1" fill="var(--fur)"/>
            <rect x="10" y="19" width="12" height="6" fill="var(--fur)"/>
            <rect x="11" y="25" width="10" height="1" fill="var(--fur)"/>
            <rect x="10" y="24" width="12" height="1" fill="var(--fur-shade)"/>

            <!-- Short dark arms at the sides, clear of the legs below. -->
            <rect x="8"  y="19" width="2" height="4" fill="var(--patch)"/>
            <rect x="22" y="19" width="2" height="4" fill="var(--patch)"/>
            <rect x="8"  y="22" width="2" height="1" fill="var(--paw)"/>
            <rect x="22" y="22" width="2" height="1" fill="var(--paw)"/>

            <!-- Big round ears, set wide and high. -->
            <rect x="6"  y="2" width="5" height="4" fill="var(--patch)"/>
            <rect x="7"  y="1" width="3" height="1" fill="var(--patch)"/>
            <g class="pet-ear-r">
              <rect x="21" y="2" width="5" height="4" fill="var(--patch)"/>
              <rect x="22" y="1" width="3" height="1" fill="var(--patch)"/>
            </g>

            <g class="pet-head">
              <rect x="10" y="4"  width="12" height="1"  fill="var(--fur)"/>
              <rect x="9"  y="5"  width="14" height="1"  fill="var(--fur)"/>
              <rect x="7"  y="6"  width="18" height="10" fill="var(--fur)"/>
              <rect x="8"  y="16" width="16" height="1"  fill="var(--fur)"/>
              <rect x="10" y="17" width="12" height="1"  fill="var(--fur-shade)"/>

              <!-- The eye patches are the whole species cue: big, stepped
                   round, angled inward at the top. -->
              <rect x="9"  y="8"  width="5" height="6" fill="var(--patch)"/>
              <rect x="10" y="7"  width="3" height="1" fill="var(--patch)"/>
              <rect x="10" y="14" width="3" height="1" fill="var(--patch)"/>
              <rect x="18" y="8"  width="5" height="6" fill="var(--patch)"/>
              <rect x="19" y="7"  width="3" height="1" fill="var(--patch)"/>
              <rect x="19" y="14" width="3" height="1" fill="var(--patch)"/>

              <rect x="14" y="13" width="4" height="3" fill="var(--snout)"/>
              <rect x="15" y="13" width="2" height="1" fill="var(--ink)"/>
              <rect x="7"  y="12" width="2" height="2" fill="var(--blush)"/>
              <rect x="23" y="12" width="2" height="2" fill="var(--blush)"/>

              <!-- The whites are 4 wide so a 2 wide pupil centres exactly.
                   At 3 wide it cannot: the pupil sits one column off centre,
                   and mirroring that only trades cross-eyed for wall-eyed.
                   Centred pupils point nowhere, which is what is wanted. -->
              <g class="pet-eyes">
                <rect x="9"  y="9"  width="4" height="3" fill="var(--snout)"/>
                <rect x="18" y="9"  width="4" height="3" fill="var(--snout)"/>
                <rect x="10" y="10" width="2" height="2" fill="var(--ink)"/>
                <rect x="19" y="10" width="2" height="2" fill="var(--ink)"/>
                <rect x="9"  y="9"  width="1" height="1" fill="var(--eye-glint)"/>
                <rect x="18" y="9"  width="1" height="1" fill="var(--eye-glint)"/>
                <rect class="pet-lid" x="9"  y="9" width="4" height="2" fill="var(--patch)"/>
                <rect class="pet-lid" x="18" y="9" width="4" height="2" fill="var(--patch)"/>
              </g>

              <g class="pet-smile">
                <rect x="14" y="15" width="1" height="1" fill="var(--ink)"/>
                <rect x="15" y="16" width="2" height="1" fill="var(--ink)"/>
                <rect x="17" y="15" width="1" height="1" fill="var(--ink)"/>
              </g>
              <g class="pet-frown">
                <rect x="14" y="16" width="1" height="1" fill="var(--ink)"/>
                <rect x="15" y="15" width="2" height="1" fill="var(--ink)"/>
                <rect x="17" y="16" width="1" height="1" fill="var(--ink)"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </section>

    <!-- One pip per drink. An empty row asks for the first tap in a way a 0
         does not, and the goal is counted in taps so a pip cannot drift from
         what a tap does to the meter. -->
    <div class="pips" id="pips" role="img" aria-label=""></div>
    <p class="pips-label"><span id="pipsCount">0 / 8</span></p>
   </div>

    <div class="tube" id="tube" role="progressbar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" aria-label="">
      <div class="tube-fill" id="tubeFill"><span class="tube-num" id="tubeNum">75%</span></div>
    </div>
  </div>

  <!-- ---------- side, below the scene ---------- -->
  <div class="side-bottom">
    <!-- The mood is a live region. The last-drink time is not, on purpose: the
         refresh ticker rewrites it every 15 seconds, and a live region would
         have a screen reader announce the time on every tick. -->
    <p class="mood-line" id="moodLine" role="status"></p>
    <p class="last-line" id="lastLine"></p>

    <div class="dock">
      <button class="btn btn-drink glit-specks" id="drinkBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-drop"/></svg>
        <span id="drinkLabel"></span>
      </button>
    </div>
  </div>

  <!-- ---------- footer, secret species toggle bottom right ---------- -->
  <div class="foot">
    <p class="note" id="note"></p>
    <button class="secret" id="secretBtn" type="button">&#42;</button>
  </div>
</main>

<!-- ---------- settings sheet ----------
     A real dialog, so Esc, the backdrop and the focus trap come from the
     platform instead of from hand-written code. openSheet falls back to a
     plain panel with a drawn scrim where showModal does not exist. -->
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" type="button" aria-label="">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <div class="sheet-body">

    <h3 class="sheet-group" id="grpLook"></h3>
    <div class="seg" id="themes" role="radiogroup" aria-labelledby="themesLabel">
      <span class="sr-only" id="themesLabel"></span>
    </div>
    <div class="seg" role="group" aria-labelledby="langLabel">
      <span class="sr-only" id="langLabel">Sprache</span>
      <button class="lang-btn" id="langDe" type="button" data-locale="de" aria-pressed="true">DE</button>
      <button class="lang-btn" id="langEn" type="button" data-locale="en" aria-pressed="false">EN</button>
      <button class="lang-btn" id="langZh" type="button" data-locale="zh" aria-pressed="false">&#32321;&#20013;</button>
    </div>

    <h3 class="sheet-group" id="grpGoal"></h3>
    <!-- A span, not a label: a label points at one control and this row has
         three. Each button carries its own name, and the output announces the
         new number once. -->
    <div class="setting setting-step">
      <span id="goalLabel"></span>
      <button class="step-btn" id="goalDown" type="button" aria-label="">&minus;</button>
      <output class="step-val" id="goalVal" aria-live="polite">8</output>
      <button class="step-btn" id="goalUp" type="button" aria-label="">+</button>
    </div>
    <p class="sheet-hint" id="goalHint"></p>

    <h3 class="sheet-group" id="grpBehaviour"></h3>

    <div class="setting">
      <label for="nameInput" id="nameLabel"></label>
      <input id="nameInput" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done">
    </div>

    <div class="setting">
      <label id="creatureLabel"></label>
      <div class="langs" id="creature" role="radiogroup" aria-labelledby="creatureLabel"></div>
    </div>

    <div class="setting setting-slider">
      <div class="setting-row">
        <label for="decayInput" id="decayLabel"></label>
        <output id="decayOut" for="decayInput"></output>
      </div>
      <input id="decayInput" type="range">
      <div class="setting-scale" id="decayScale" aria-hidden="true"></div>
    </div>

    <div class="setting setting-slider">
      <div class="setting-row">
        <label for="refillInput" id="refillLabel"></label>
        <output id="refillOut" for="refillInput"></output>
