<!DOCTYPE html>
<!--
  index.html - Aniluna Aqua Buddy - v0.20

  Purpose    : Single-file static hydration companion. Tap to drink, the meter
               refills, the character reacts. No backend, no accounts.
  Status     : DEVELOPMENT
  Versioning : v0.x = development/testing, v1.x = production-ready
  Author     : Matthias Koterski
  Date       : 2026-08-24
  Context    : Runs entirely in the browser. State lives in localStorage.
  Changelog  : see README.md, newest first
-->
<html lang="de" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A tiny single-file hydration companion. Drink water, keep your pet happy.">
<meta name="theme-color" content="#cfe9ff">
<!-- Emoji as an inline SVG favicon, so this stays a single file with no icon
     asset to ship. Swapped per species at runtime by UI.applySpecies. -->
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' dy='.35em' font-size='84' text-anchor='middle'%3E%F0%9F%A6%84%3C/text%3E%3C/svg%3E">
<title>Aniluna Aqua Buddy</title>
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root {
  /* unicorn */
  --coat:        #fff7fb;
  --coat-shade:  #ffe2f0;
  --mane-1:      #ffabd6;
  --mane-2:      #b7a6ff;
  --mane-3:      #93dcff;
  --horn:        #ffd884;
  --horn-shade:  #edb552;
  --muzzle:      #ffe7f2;
  --hoof:        #d9b3e8;
  /* dinosaur */
  --skin:        #8fd98a;
  --skin-shade:  #6cbd6b;
  --belly:       #eaf7c9;
  --spike:       #f2a35e;
  --spike-shade: #d3833f;
  --claw:        #f7e6a8;
  /* shared */
  --ink:         #2a2036;
  --eye-glint:   #ffffff;
  --blush:       #ff96ba;

  --bg:          #d6ecff;
  --bg-2:        #ffe6f3;
  --scene-1:     #bfe3ff;
  --scene-2:     #ffd9ec;
  --ground:      #a9dfb6;
  --panel:       #fffdfe;
  --panel-edge:  #f0d5e6;
  --text:        #3b2f4a;
  --text-soft:   #7b6b8c;
  --accent:      #4aa3f0;
  --accent-ink:  #ffffff;
  --meter-bg:    #efe2f0;
  --meter-fill:  linear-gradient(90deg, #6fc7ff, #4aa3f0);
  --shadow:      0 4px 0 #e6cadd;
  --focus:       #ff6fae;
  --star:        #ffdf7a;          /* warm in daylight, so it reads on a pale sky */
  --star-glow:   rgba(255, 208, 92, 0.9);
  --wind-stroke: rgba(255, 255, 255, 0.85);
}

:root[data-theme="night"] {
  --coat:        #f3ecff;
  --coat-shade:  #d9c9f0;
  --mane-1:      #ff8fc6;
  --mane-2:      #9b86f5;
  --mane-3:      #6fc6f0;
  --horn:        #ffd06a;
  --horn-shade:  #d99a3f;
  --muzzle:      #e6d8f5;
  --hoof:        #a883c4;
  --skin:        #6fb87a;
  --skin-shade:  #4d8f5c;
  --belly:       #cfe6a8;
  --spike:       #e0894a;
  --spike-shade: #b96a33;
  --claw:        #e8d79a;
  --ink:         #1b1526;
  --blush:       #ef7ba6;

  --bg:          #191333;
  --bg-2:        #2a1c44;
  --scene-1:     #241a46;
  --scene-2:     #3a2159;
  --ground:      #2f5a53;
  --panel:       #251c3f;
  --panel-edge:  #3d3060;
  --text:        #efe6ff;
  --text-soft:   #b4a4d4;
  --accent:      #7f6bff;
  --accent-ink:  #ffffff;
  --meter-bg:    #35284f;
  --meter-fill:  linear-gradient(90deg, #6fc6f0, #7f6bff);
  --shadow:      0 4px 0 #120d24;
  --focus:       #ff9ac9;
  --star:        #ffffff;
  --star-glow:   rgba(255, 255, 255, 0.85);
  --wind-stroke: rgba(226, 216, 255, 0.6);
}

/* ============================================================
   MOOD BAND TOKENS  (one animation system, four tunings)
   ============================================================ */
.scene[data-band="hydrated"] {
  --sat: 1.14; --bri: 1.03;
  --droop: 0deg; --sink: 0px;
  --bob-amp: 1.2px; --bob-dur: 2.2s;
  --tail-amp: 9deg; --tail-dur: 1.2s;
  --head-amp: 2deg; --head-dur: 3.1s;
  --sparkle-op: 1; --sparkle-dur: 1.6s;
  --lid: 0; --smile-op: 1; --frown-op: 0;
}
.scene[data-band="okay"] {
  --sat: 1; --bri: 1;
  --droop: 0.6deg; --sink: 0.4px;
  --bob-amp: 0.75px; --bob-dur: 3.4s;
  --tail-amp: 5deg; --tail-dur: 2.1s;
  --head-amp: 1.2deg; --head-dur: 4.4s;
  --sparkle-op: 0.5; --sparkle-dur: 2.6s;
  --lid: 0; --smile-op: 1; --frown-op: 0;
}
.scene[data-band="thirsty"] {
  --sat: 0.7; --bri: 0.98;
  --droop: 3.2deg; --sink: 1.1px;
  --bob-amp: 0.45px; --bob-dur: 4.8s;
  --tail-amp: 2.5deg; --tail-dur: 3.6s;
  --head-amp: 0.7deg; --head-dur: 6s;
  --sparkle-op: 0.18; --sparkle-dur: 4s;
  --lid: 0.5; --smile-op: 0; --frown-op: 1;
}
.scene[data-band="dehydrated"] {
  --sat: 0.42; --bri: 0.95;
  --droop: 6.5deg; --sink: 2.2px;
  --bob-amp: 0.25px; --bob-dur: 6.8s;
  --tail-amp: 1.2deg; --tail-dur: 5.6s;
  --head-amp: 0.4deg; --head-dur: 8s;
  --sparkle-op: 0; --sparkle-dur: 6s;
  --lid: 1; --smile-op: 0; --frown-op: 1;
}

/* ============================================================
   BASE LAYOUT
   ============================================================ */
* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  padding: 12px 12px calc(18px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background: linear-gradient(170deg, var(--bg), var(--bg-2));
  color: var(--text);
  font: 16px/1.45 ui-rounded, "Segoe UI Variable Display", "Segoe UI",
        "Noto Sans TC", "PingFang TC", "Microsoft JhengHei",
        "Noto Sans SC", "PingFang SC", "Microsoft YaHei",
        system-ui, -apple-system, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.5s ease, color 0.3s ease;
}

.app {
  width: 100%;
  max-width: 424px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

:where(button, input, select) { font: inherit; color: inherit; }

:where(button, input, select, summary):focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.panel {
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  border-radius: 18px;
  box-shadow: var(--shadow);
}

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
}
.topbar h1 {
  margin: 0;
  flex: 1;
  min-width: 0;
  font-size: 1.02rem;
  letter-spacing: 0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0 8px;
  border: 2px solid var(--panel-edge);
  border-radius: 14px;
  background: transparent;
  font-size: 1.15rem;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.2s ease;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn[aria-pressed="false"] { opacity: 0.5; }

/* ---------- tooltips ----------
   The icon buttons carry no visible text, so each one names itself on hover.
   The text comes from data-tip, which UI.label() writes from the same string
   as the aria-label, so the two cannot drift apart. A pseudo-element is not
   in the accessibility tree, so a screen reader still hears one name, not two.
   Hover and keyboard focus only: on touch these buttons act on the first tap,
   and a tooltip that needs a second one would just be in the way. */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 5;
  padding: 5px 9px;
  border: 2px solid var(--panel-edge);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text-soft);
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(-3px);
  transition: opacity 0.16s ease, transform 0.16s ease;
  pointer-events: none;          /* never steals the pointer from its button */
}
[data-tip]:focus-visible::after { opacity: 1; transform: translateY(0); }
@media (hover: hover) and (pointer: fine) {
  [data-tip]:hover::after { opacity: 1; transform: translateY(0); }
}
/* The secret switch sits in the footer, so its tooltip opens upwards and to
   the left, which is the only direction with room. */
.secret[data-tip]::after { top: auto; bottom: calc(100% + 6px); }

/* ---------- info card ---------- */
.info {
  padding: 14px 16px;
  font-size: 0.9rem;
  line-height: 1.5;
}
.info[hidden] { display: none; }
.info p { margin: 0 0 8px; }
.info p:last-child { margin-bottom: 0; }
.info .tip { color: var(--text-soft); font-size: 0.82rem; }

/* ---------- scene ---------- */
.scene {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  border: 2px solid var(--panel-edge);
  background: linear-gradient(180deg, var(--scene-1), var(--scene-2));
  box-shadow: var(--shadow);
  aspect-ratio: 1 / 0.92;
  display: grid;
  place-items: end center;
  transition: background 0.6s ease;
}
.scene::after {                       /* ground strip */
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 15%;
  background: var(--ground);
  transition: background 0.6s ease;
}

/* Background stars: always at night, and in daylight only at the happiest
   level, where they read as a warm sparkle rather than a night sky. */
.stars {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease;
  background-image:
    radial-gradient(1.5px 1.5px at 14% 18%, var(--star) 99%, transparent),
    radial-gradient(1.3px 1.3px at 78% 12%, var(--star) 99%, transparent),
    radial-gradient(1.5px 1.5px at 62% 30%, var(--star) 99%, transparent),
    radial-gradient(1.3px 1.3px at 30% 40%, var(--star) 99%, transparent),
    radial-gradient(1.7px 1.7px at 88% 44%, var(--star) 99%, transparent),
    radial-gradient(1.3px 1.3px at 46% 22%, var(--star) 99%, transparent),
    radial-gradient(1.5px 1.5px at 22% 62%, var(--star) 99%, transparent);
  filter: drop-shadow(0 0 3px var(--star-glow));
}
:root[data-theme="night"] .stars { opacity: 0.9; }
.scene[data-radiant="on"] .stars { opacity: 0.85; }

/* rainbow reward, only while the meter reads at or above Config.thresholds.rainbow */
.rainbow {
  position: absolute;
  z-index: 1;                   /* over the sun and moon, under the character */
  left: 50%;
  top: 13%;
  width: 70%;
  transform: translateX(-50%) scale(0.94);
  opacity: 0;
  transition: opacity 0.9s ease, transform 0.9s ease;
  pointer-events: none;
}
.scene[data-radiant="on"] .rainbow {
  opacity: 0.45;
  transform: translateX(-50%) scale(1);
}
.rainbow path { fill: none; stroke-width: 3.3; stroke-linecap: round; }

/* ---------- sun and moon ----------
   Both travel the same arc: up from the left at their rise hour, highest at
   their peak hour, down to the right at their set hour. East to west, so the
   sun comes up on the left the way it actually does. */
.sky { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.body {
  position: absolute;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  opacity: 0;
  transition: opacity 1.2s ease, left 1.5s linear, top 1.5s linear;
}
.body[data-visible="yes"] { opacity: 1; }
.sun {
  width: 11%;
  aspect-ratio: 1;
  background: radial-gradient(circle at 38% 34%, #fff6cf 0%, #ffd45e 52%, #f7a53c 100%);
  box-shadow: 0 0 14px 5px rgba(255, 206, 92, 0.45);
}
.moon {
  width: 9%;
  aspect-ratio: 1;
  background:
    radial-gradient(circle at 66% 62%, rgba(150, 140, 190, 0.4) 0 14%, transparent 15%),
    radial-gradient(circle at 34% 40%, rgba(150, 140, 190, 0.34) 0 10%, transparent 11%),
    radial-gradient(circle at 58% 26%, rgba(150, 140, 190, 0.26) 0 7%, transparent 8%),
    radial-gradient(circle at 40% 36%, #fdfbff 0%, #e6def7 60%, #c9bee6 100%);
  box-shadow: 0 0 12px 4px rgba(226, 216, 255, 0.35);
}

/* ---------- ambient life: birds by day, wind gusts mostly by night ----------
   Both are spawned rarely by Ambient, cross the scene once and remove
   themselves. Rates live in Config.ambient. */
.ambient { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.amb {
  position: absolute;
  left: -25%;
  animation: drift var(--dur, 12s) linear forwards;
}
.amb.rtl { animation-name: drift-rtl; }
.amb-flip { display: block; }
.amb.rtl .amb-flip { transform: scaleX(-1); }
@keyframes drift {
  0%   { left: -25%; opacity: 0; }
  14%  { opacity: var(--amb-op, 0.7); }
  86%  { opacity: var(--amb-op, 0.7); }
  100% { left: 118%; opacity: 0; }
}
@keyframes drift-rtl {
  0%   { left: 118%; opacity: 0; }
  14%  { opacity: var(--amb-op, 0.7); }
  86%  { opacity: var(--amb-op, 0.7); }
  100% { left: -25%; opacity: 0; }
}
.amb-bob { display: block; animation: amb-bob var(--bob, 3.4s) ease-in-out infinite; }
@keyframes amb-bob {
  0%, 100% { transform: translateY(-14%); }
  50%      { transform: translateY(14%); }
}
.bird svg { display: block; width: 100%; height: auto; overflow: visible; }
.bird path {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.5;
  stroke-linecap: round;
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: flap var(--flap, 0.7s) ease-in-out infinite;
}
@keyframes flap {
  0%, 100% { transform: scaleY(1); }
  50%      { transform: scaleY(0.25); }
}
.wind svg { display: block; width: 100%; height: auto; overflow: visible; }
.wind path {
  fill: none;
  stroke: var(--wind-stroke);
  stroke-width: 1.4;
  stroke-linecap: round;
}

/* pixel sparkles */
.sparkles { position: absolute; inset: 0; pointer-events: none; }
.sparkle {
  position: absolute;
  width: 9px;
  height: 9px;
  opacity: 0;
  animation: twinkle var(--sparkle-dur, 2s) ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
.sparkle::before, .sparkle::after {
  content: "";
  position: absolute;
  background: #fff8d0;
  box-shadow: 0 0 5px #ffe98a;
}
.sparkle::before { inset: 3px 0; }
.sparkle::after  { inset: 0 3px; }
.sparkle:nth-child(1) { left: 16%; top: 20%; --d: 0s; }
.sparkle:nth-child(2) { left: 74%; top: 15%; --d: 0.5s; }
.sparkle:nth-child(3) { left: 84%; top: 46%; --d: 1s; }
.sparkle:nth-child(4) { left: 10%; top: 52%; --d: 1.5s; }
.sparkle:nth-child(5) { left: 46%; top: 8%;  --d: 0.8s; }
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
  50%      { opacity: var(--sparkle-op, 1); transform: scale(1) rotate(45deg); }
}

/* speech bubble */
.speech {
  position: absolute;
  left: 50%;
  top: 4%;
  transform: translateX(-50%);
  max-width: 84%;
  padding: 7px 12px;
  border-radius: 14px;
  background: var(--panel);
  border: 2px solid var(--panel-edge);
  color: var(--text);
  font-size: 0.86rem;
  text-align: center;
  text-wrap: balance;
  z-index: 3;
  animation: pop 0.35s ease;
}
.speech::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  width: 10px;
  height: 10px;
  transform: translateX(-50%) rotate(45deg);
  background: var(--panel);
  border-right: 2px solid var(--panel-edge);
  border-bottom: 2px solid var(--panel-edge);
}
@keyframes pop {
  from { transform: translateX(-50%) scale(0.85); opacity: 0; }
  to   { transform: translateX(-50%) scale(1); opacity: 1; }
}

/* ============================================================
   THE CHARACTERS
   Both sprites share the same group class names, so one animation
   system and one set of band tokens drive either species.
   ============================================================ */
.pet {
  position: relative;
  z-index: 2;
  width: 56%;
  max-width: 208px;
  margin-bottom: 2%;
  filter: saturate(var(--sat, 1)) brightness(var(--bri, 1));
  transition: filter 0.7s ease;
  grid-area: 1 / 1;
  align-self: end;
  justify-self: center;
}
.pet g { transform-box: fill-box; }
.pet-shadow { fill: rgba(0, 0, 0, 0.13); }
#petInk feFlood { flood-color: var(--ink); }

.scene[data-species="unicorn"] .pet-dino,
.scene[data-species="dinosaur"] .pet-unicorn { display: none; }

.pet-all {
  transform-origin: 50% 100%;
  transform: translateY(var(--sink, 0)) rotate(var(--droop, 0deg));
  transition: transform 0.7s ease;
}
.pet-bob   { animation: bob var(--bob-dur, 3s) ease-in-out infinite; }
.pet-head  { transform-origin: 50% 100%; animation: nod var(--head-dur, 4s) ease-in-out infinite; }
.pet-tail  { transform-origin: 0% 100%;  animation: swish var(--tail-dur, 2s) ease-in-out infinite; }
.pet-ear-r { transform-origin: 50% 100%; animation: twitch 5.5s ease-in-out infinite; }
.pet-eyes  { transform-origin: 50% 50%;  animation: blink 6.5s ease-in-out infinite; }

@keyframes bob    { 0%, 100% { transform: translateY(calc(var(--bob-amp) * -1)); } 50% { transform: translateY(var(--bob-amp)); } }
@keyframes nod    { 0%, 100% { transform: rotate(calc(var(--head-amp) * -1)); } 50% { transform: rotate(var(--head-amp)); } }
@keyframes swish  { 0%, 100% { transform: rotate(calc(var(--tail-amp) * -1)); } 50% { transform: rotate(var(--tail-amp)); } }
@keyframes twitch { 0%, 88%, 100% { transform: rotate(0deg); } 92% { transform: rotate(-11deg); } 96% { transform: rotate(4deg); } }
@keyframes blink  { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.12); } }

.pet-lid   { transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(var(--lid, 0)); transition: transform 0.5s ease; }
.pet-smile { opacity: var(--smile-op, 1); transition: opacity 0.4s ease; }
.pet-frown { opacity: var(--frown-op, 0); transition: opacity 0.4s ease; }

/* drink reaction */
.scene.is-sipping .pet-bob { animation: sip-hop 0.5s ease; }
@keyframes sip-hop {
  0%, 100% { transform: translateY(0) scale(1, 1); }
  25%      { transform: translateY(-7%) scale(0.97, 1.04); }
  60%      { transform: translateY(0) scale(1.04, 0.96); }
}
.scene.is-gurgling .pet-all { animation: wobble 0.7s ease; }
@keyframes wobble {
  0%, 100% { transform: translateY(var(--sink)) rotate(var(--droop)); }
  20%      { transform: translateY(var(--sink)) rotate(-7deg) scale(1.05, 0.95); }
  50%      { transform: translateY(var(--sink)) rotate(7deg) scale(0.95, 1.05); }
  80%      { transform: translateY(var(--sink)) rotate(-3deg); }
}
.scene.is-morphing .pet-all { animation: morph 0.6s ease; }
@keyframes morph {
  0%   { transform: translateY(var(--sink)) scale(0.7, 1.3); opacity: 0.2; }
  55%  { transform: translateY(var(--sink)) scale(1.15, 0.9); opacity: 1; }
  100% { transform: translateY(var(--sink)) rotate(var(--droop)) scale(1, 1); }
}

/* floating droplets on drink */
.drops { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.drop {
  position: absolute;
  left: 50%;
  bottom: 34%;
  font-size: 1.1rem;
  opacity: 0;
  animation: floatup 1.1s ease-out forwards;
}
@keyframes floatup {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
  25%  { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -80px) scale(1.15); }
}

/* ============================================================
   METER / STATS / ACTIONS / SETTINGS
   ============================================================ */
.block { padding: 12px 14px; }

.meter-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
}
.meter-head .label { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); }
.meter-head .value { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.meter-track {
  height: 22px;
  border-radius: 11px;
  background: var(--meter-bg);
  border: 2px solid var(--panel-edge);
  overflow: hidden;
  padding: 2px;
}
.meter-fill {
  height: 100%;
  min-width: 4px;
  border-radius: 9px;
  background: var(--meter-fill);
  transition: width 0.55s cubic-bezier(0.3, 1.4, 0.5, 1);
}
.mood-line { margin: 8px 0 0; font-size: 0.85rem; color: var(--text-soft); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat {
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--meter-bg);
  text-align: center;
}
.stat dt { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-soft); }
.stat dd { margin: 3px 0 0; font-size: 1.02rem; font-weight: 700; }

.actions { display: grid; gap: 10px; }
.btn {
  min-height: 44px;
  padding: 14px 18px;
  border: none;
  border-radius: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, filter 0.2s ease;
}
.btn:active { transform: translateY(3px) scale(0.99); }
.btn-drink {
  min-height: 68px;
  font-size: 1.18rem;
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
}
.btn-drink:active { box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); }
.btn-ghost {
  background: transparent;
  border: 2px solid var(--panel-edge);
  color: var(--text-soft);
  font-size: 0.9rem;
  padding: 10px 14px;
}

details.settings summary {
  padding: 12px 14px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.92rem;
  list-style: none;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
}
details.settings summary::-webkit-details-marker { display: none; }
details.settings summary::before { content: "\25B8"; transition: transform 0.2s ease; }
details.settings[open] summary::before { transform: rotate(90deg); }

.setting {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  min-height: 44px;
  font-size: 0.9rem;
}
.setting label { flex: 1; }
.setting input[type="checkbox"] { width: 26px; height: 26px; accent-color: var(--accent); }
.setting input[type="text"] {
  flex: none;
  width: 52%;
  min-width: 0;
  padding: 7px 10px;
  border: 2px solid var(--panel-edge);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: 0.86rem;
  text-align: right;
}

.setting-slider { display: block; padding: 10px 14px 12px; }
.setting-row { display: flex; align-items: baseline; gap: 10px; }
.setting-row label { flex: 1; }
.setting-row output { font-weight: 700; font-variant-numeric: tabular-nums; }
.setting-scale {
  display: flex;
  justify-content: space-between;
  margin-top: -1px;
  font-size: 0.7rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-soft);
}

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 34px;                 /* finger-friendly area around a 12px track */
  margin: 2px 0 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 12px;
  border-radius: 6px;
  background: var(--meter-bg);
  border: 2px solid var(--panel-edge);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  margin-top: -7px;             /* centres the thumb on the track */
  border-radius: 9px;
  background: var(--accent);
  border: 3px solid var(--panel);
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
}
input[type="range"]::-moz-range-track {
  height: 12px;
  border-radius: 6px;
  background: var(--meter-bg);
  border: 2px solid var(--panel-edge);
}
input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 8px;
  background: var(--accent);
  border: 3px solid var(--panel);
}

/* language segmented control */
.langs { display: flex; gap: 6px; }
.lang-btn {
  min-height: 40px;
  padding: 6px 12px;
  border: 2px solid var(--panel-edge);
  border-radius: 12px;
  background: transparent;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-soft);
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.lang-btn[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* ---------- footer, with the secret toggle bottom right ---------- */
.foot {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px;
}
.note {
  flex: 1;
  font-size: 0.74rem;
  color: var(--text-soft);
  text-align: center;
  margin: 0;
  padding-left: 30px;           /* balances the secret button so the note stays centred */
}
/* Deliberately quiet: discoverable if you look, invisible if you do not.
   Still a real button with a real label, so assistive tech and keyboards
   can reach it. */
.secret {
  width: 30px;
  height: 30px;
  flex: none;
  border: none;
  background: none;
  color: var(--text-soft);
  opacity: 0.22;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  border-radius: 10px;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.secret:hover, .secret:focus-visible { opacity: 0.85; transform: rotate(90deg); }
.secret:active { transform: rotate(90deg) scale(0.85); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ============================================================
   REDUCED MOTION  (idle and decorative motion is non-essential)
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .pet, .pet * { animation: none !important; transition: none !important; }
  .sparkle { animation: none !important; opacity: var(--sparkle-op, 1); transform: rotate(45deg); }
  .rainbow, .stars, .body { transition: none !important; }
  .amb { display: none !important; }
  .drop { animation: none !important; opacity: 0 !important; }
  .secret:hover, .secret:focus-visible { transform: none; }
  [data-tip]::after { transition: none !important; transform: none !important; }
}
</style>
</head>
<body>
<main class="app">

  <!-- ---------- top bar ---------- -->
  <header class="panel topbar">
    <h1 id="appTitle">Aniluna Aqua Buddy</h1>
    <button class="icon-btn" id="infoBtn" type="button" aria-expanded="false" aria-controls="infoCard">&#9432;</button>
    <button class="icon-btn" id="themeBtn" type="button">&#127769;</button>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">&#128276;</button>
  </header>

  <!-- ---------- info card ---------- -->
  <section class="panel info" id="infoCard" hidden>
    <p id="infoBody"></p>
    <p class="tip" id="infoTip"></p>
  </section>

  <!-- ---------- scene ---------- -->
  <section class="scene" id="scene" data-band="okay" data-species="unicorn" data-radiant="off"
           aria-labelledby="sceneCaption">
    <p class="sr-only" id="sceneCaption"></p>
    <div class="stars" aria-hidden="true"></div>

    <div class="sky" aria-hidden="true">
      <div class="body sun" id="sun" data-visible="no"></div>
      <div class="body moon" id="moon" data-visible="no"></div>
    </div>
    <div class="ambient" id="ambient" aria-hidden="true"></div>

    <svg class="rainbow" viewBox="0 0 100 52" aria-hidden="true">
      <path d="M6 52a44 44 0 0 1 88 0"       stroke="#ff9aa9"/>
      <path d="M9.5 52a40.5 40.5 0 0 1 81 0" stroke="#ffc98a"/>
      <path d="M13 52a37 37 0 0 1 74 0"      stroke="#ffef9c"/>
      <path d="M16.5 52a33.5 33.5 0 0 1 67 0" stroke="#a8e6a3"/>
      <path d="M20 52a30 30 0 0 1 60 0"      stroke="#98d4f5"/>
      <path d="M23.5 52a26.5 26.5 0 0 1 53 0" stroke="#b7a6ff"/>
    </svg>

    <div class="sparkles" aria-hidden="true">
      <i class="sparkle"></i><i class="sparkle"></i><i class="sparkle"></i>
      <i class="sparkle"></i><i class="sparkle"></i>
    </div>

    <p class="speech" id="speech"></p>
    <div class="drops" id="drops" aria-hidden="true"></div>

    <!-- One outline filter, shared by both sprites. feMorphology dilates the
         whole silhouette by one grid unit, so each part only needs its fill. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="petInk" x="-20%" y="-20%" width="140%" height="140%"
                color-interpolation-filters="sRGB">
          <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="grown"/>
          <feFlood flood-color="#2a2036" result="inkColor"/>
          <feComposite in="inkColor" in2="grown" operator="in" result="outline"/>
          <feMerge>
            <feMergeNode in="outline"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
    </svg>

    <!-- ===== unicorn ===== -->
    <svg class="pet pet-unicorn" viewBox="0 -1 32 31" shape-rendering="crispEdges" aria-hidden="true">
      <ellipse class="pet-shadow" cx="16" cy="28.4" rx="7" ry="1.1"/>
      <g class="pet-all">
        <g class="pet-bob">
          <g filter="url(#petInk)">

            <g class="pet-tail">
              <rect x="19" y="21" width="2" height="4" fill="var(--mane-1)"/>
              <rect x="21" y="20" width="2" height="4" fill="var(--mane-2)"/>
              <rect x="23" y="18" width="2" height="4" fill="var(--mane-3)"/>
            </g>

            <rect x="4" y="10" width="2" height="8"  fill="var(--mane-3)"/>
            <rect x="6" y="7"  width="3" height="13" fill="var(--mane-1)"/>

            <rect x="12" y="24" width="3" height="4" fill="var(--coat)"/>
            <rect x="17" y="24" width="3" height="4" fill="var(--coat)"/>
            <rect x="12" y="27" width="3" height="1" fill="var(--hoof)"/>
            <rect x="17" y="27" width="3" height="1" fill="var(--hoof)"/>

            <rect x="12" y="19" width="8" height="6" fill="var(--coat)"/>
            <rect x="12" y="24" width="8" height="1" fill="var(--coat-shade)"/>

            <rect x="9"  y="3" width="3" height="4" fill="var(--coat)"/>
            <rect x="10" y="4" width="1" height="2" fill="var(--blush)"/>
            <g class="pet-ear-r">
              <rect x="20" y="3" width="3" height="4" fill="var(--coat)"/>
              <rect x="21" y="4" width="1" height="2" fill="var(--blush)"/>
            </g>

            <g class="pet-head">
              <rect x="11" y="6"  width="10" height="1"  fill="var(--coat)"/>
              <rect x="10" y="7"  width="12" height="1"  fill="var(--coat)"/>
              <rect x="9"  y="8"  width="14" height="10" fill="var(--coat)"/>
              <rect x="10" y="18" width="12" height="1"  fill="var(--coat-shade)"/>
              <rect x="11" y="19" width="10" height="1"  fill="var(--coat-shade)"/>

              <rect x="15" y="0" width="2" height="3" fill="var(--horn)"/>
              <rect x="15" y="2" width="2" height="1" fill="var(--horn-shade)"/>
              <rect x="14" y="3" width="4" height="3" fill="var(--horn)"/>
              <rect x="14" y="4" width="2" height="1" fill="var(--horn-shade)"/>
              <rect x="14" y="5" width="4" height="1" fill="var(--horn-shade)"/>

              <rect x="9"  y="6" width="2" height="12" fill="var(--mane-2)"/>
              <rect x="11" y="6" width="4" height="3"  fill="var(--mane-1)"/>
              <rect x="15" y="7" width="4" height="2"  fill="var(--mane-3)"/>

              <rect x="14" y="15" width="4" height="4" fill="var(--muzzle)"/>
              <rect x="14" y="16" width="1" height="1" fill="var(--coat-shade)"/>
              <rect x="17" y="16" width="1" height="1" fill="var(--coat-shade)"/>
              <rect x="11" y="16" width="2" height="2" fill="var(--blush)"/>
              <rect x="19" y="16" width="2" height="2" fill="var(--blush)"/>

              <g class="pet-eyes">
                <rect x="11" y="12" width="3" height="3" fill="var(--ink)"/>
                <rect x="18" y="12" width="3" height="3" fill="var(--ink)"/>
                <rect x="11" y="12" width="1" height="1" fill="var(--eye-glint)"/>
                <rect x="18" y="12" width="1" height="1" fill="var(--eye-glint)"/>
                <rect class="pet-lid" x="11" y="12" width="3" height="2" fill="var(--coat)"/>
                <rect class="pet-lid" x="18" y="12" width="3" height="2" fill="var(--coat)"/>
              </g>

              <g class="pet-smile">
                <rect x="14" y="17" width="1" height="1" fill="var(--ink)"/>
                <rect x="15" y="18" width="2" height="1" fill="var(--ink)"/>
                <rect x="17" y="17" width="1" height="1" fill="var(--ink)"/>
              </g>
              <g class="pet-frown">
                <rect x="14" y="18" width="1" height="1" fill="var(--ink)"/>
                <rect x="15" y="17" width="2" height="1" fill="var(--ink)"/>
                <rect x="17" y="18" width="1" height="1" fill="var(--ink)"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>

    <!-- ===== dinosaur ===== -->
    <svg class="pet pet-dino" viewBox="0 -1 32 31" shape-rendering="crispEdges" aria-hidden="true">
      <ellipse class="pet-shadow" cx="16" cy="28.4" rx="7.5" ry="1.1"/>
      <g class="pet-all">
        <g class="pet-bob">
          <g filter="url(#petInk)">

            <!-- Overlaps the torso and tapers, so it stays visually attached
                 while the swish rotates it about its own bottom left. -->
            <g class="pet-tail">
              <rect x="19" y="20" width="3" height="4" fill="var(--skin)"/>
              <rect x="21" y="21" width="3" height="3" fill="var(--skin)"/>
              <rect x="23" y="22" width="3" height="2" fill="var(--skin-shade)"/>
              <rect x="22" y="20" width="2" height="1" fill="var(--spike)"/>
              <rect x="24" y="21" width="2" height="1" fill="var(--spike)"/>
            </g>

            <rect x="12" y="24" width="3" height="4" fill="var(--skin)"/>
            <rect x="17" y="24" width="3" height="4" fill="var(--skin)"/>
            <rect x="12" y="27" width="3" height="1" fill="var(--claw)"/>
            <rect x="17" y="27" width="3" height="1" fill="var(--claw)"/>

            <rect x="12" y="19" width="8" height="6" fill="var(--skin)"/>
            <rect x="13" y="21" width="6" height="4" fill="var(--belly)"/>
            <rect x="19" y="19" width="2" height="2" fill="var(--spike-shade)"/>

            <g class="pet-head">
              <rect x="11" y="6"  width="10" height="1"  fill="var(--skin)"/>
              <rect x="10" y="7"  width="12" height="1"  fill="var(--skin)"/>
              <rect x="9"  y="8"  width="14" height="10" fill="var(--skin)"/>
              <rect x="10" y="18" width="12" height="1"  fill="var(--skin-shade)"/>
              <rect x="11" y="19" width="10" height="1"  fill="var(--skin-shade)"/>

              <!-- head plates, in place of horn and ears -->
              <rect x="11" y="4" width="2" height="2" fill="var(--spike)"/>
              <rect x="15" y="3" width="2" height="3" fill="var(--spike)"/>
              <rect x="19" y="4" width="2" height="2" fill="var(--spike)"/>
              <rect x="11" y="5" width="2" height="1" fill="var(--spike-shade)"/>
              <rect x="15" y="5" width="2" height="1" fill="var(--spike-shade)"/>
              <rect x="19" y="5" width="2" height="1" fill="var(--spike-shade)"/>

              <!-- snout -->
              <rect x="13" y="14" width="6" height="4" fill="var(--belly)"/>
              <rect x="14" y="15" width="1" height="1" fill="var(--skin-shade)"/>
              <rect x="17" y="15" width="1" height="1" fill="var(--skin-shade)"/>
              <rect x="10" y="16" width="2" height="2" fill="var(--blush)"/>
              <rect x="20" y="16" width="2" height="2" fill="var(--blush)"/>

              <g class="pet-eyes">
                <rect x="11" y="10" width="3" height="3" fill="var(--ink)"/>
                <rect x="18" y="10" width="3" height="3" fill="var(--ink)"/>
                <rect x="11" y="10" width="1" height="1" fill="var(--eye-glint)"/>
                <rect x="18" y="10" width="1" height="1" fill="var(--eye-glint)"/>
                <rect class="pet-lid" x="11" y="10" width="3" height="2" fill="var(--skin)"/>
                <rect class="pet-lid" x="18" y="10" width="3" height="2" fill="var(--skin)"/>
              </g>

              <g class="pet-smile">
                <rect x="13" y="17" width="1" height="1" fill="var(--ink)"/>
                <rect x="14" y="18" width="4" height="1" fill="var(--ink)"/>
                <rect x="18" y="17" width="1" height="1" fill="var(--ink)"/>
              </g>
              <g class="pet-frown">
                <rect x="13" y="18" width="1" height="1" fill="var(--ink)"/>
                <rect x="14" y="17" width="4" height="1" fill="var(--ink)"/>
                <rect x="18" y="18" width="1" height="1" fill="var(--ink)"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </section>

  <!-- ---------- meter ---------- -->
  <section class="panel block">
    <div class="meter-head">
      <span class="label" id="meterHeading"></span>
      <span class="value" id="meterValue">75%</span>
    </div>
    <div class="meter-track" role="progressbar" id="meterBar"
         aria-labelledby="meterLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75">
      <div class="meter-fill" id="meterFill" style="width:75%"></div>
    </div>
    <span class="sr-only" id="meterLabel"></span>
    <p class="mood-line" id="moodLine" role="status"></p>
  </section>

  <!-- ---------- stats ---------- -->
  <section class="panel block">
    <dl class="stats">
      <div class="stat"><dt id="statCountLabel"></dt><dd id="statCount">0</dd></div>
      <div class="stat"><dt id="statLastLabel"></dt><dd id="statLast"></dd></div>
    </dl>
  </section>

  <!-- ---------- actions ---------- -->
  <section class="actions">
    <button class="btn btn-drink" id="drinkBtn" type="button"></button>
    <button class="btn btn-ghost" id="resetBtn" type="button"></button>
  </section>

  <!-- ---------- settings ---------- -->
  <details class="panel settings" id="settings">
    <summary id="settingsSummary"></summary>

    <div class="setting">
      <label for="nameInput" id="nameLabel"></label>
      <input id="nameInput" type="text" autocomplete="off" spellcheck="false" enterkeyhint="done">
    </div>

    <div class="setting">
      <label id="langLabel">Sprache</label>
      <div class="langs" role="group" aria-labelledby="langLabel">
        <button class="lang-btn" id="langDe" type="button" data-locale="de" aria-pressed="true">DE</button>
        <button class="lang-btn" id="langEn" type="button" data-locale="en" aria-pressed="false">EN</button>
        <button class="lang-btn" id="langZh" type="button" data-locale="zh" aria-pressed="false">&#32321;&#20013;</button>
      </div>
    </div>

    <div class="setting setting-slider">
      <div class="setting-row">
        <label for="decayInput" id="decayLabel"></label>
        <output id="decayOut" for="decayInput"></output>
      </div>
      <input id="decayInput" type="range">
      <div class="setting-scale" id="decayScale" aria-hidden="true"></div>
    </div>

    <div class="setting setting-slider">
      <div class="setting-row">
        <label for="refillInput" id="refillLabel"></label>
        <output id="refillOut" for="refillInput"></output>
      </div>
      <input id="refillInput" type="range">
      <div class="setting-scale" id="refillScale" aria-hidden="true"></div>
    </div>

    <div class="setting">
      <label for="soundInput" id="soundLabel"></label>
      <input id="soundInput" type="checkbox">
    </div>
    <div class="setting">
      <label for="eggInput" id="eggLabel"></label>
      <input id="eggInput" type="checkbox">
    </div>
    <div class="setting">
      <label for="autoThemeInput" id="autoThemeLabel"></label>
      <input id="autoThemeInput" type="checkbox">
    </div>
    <div class="setting">
      <label for="themeInput" id="themeLabel"></label>
      <input id="themeInput" type="checkbox">
    </div>

    <p class="setting" style="min-height:0;padding-bottom:14px;font-size:0.76rem;color:var(--text-soft)"
       id="settingsFoot"></p>
  </details>

  <!-- ---------- footer, secret species toggle bottom right ---------- -->
  <div class="foot">
    <p class="note" id="note"></p>
    <button class="secret" id="secretBtn" type="button">&#42;</button>
  </div>
</main>

<script>
"use strict";

/* ========= CONFIG ========= */
const Config = {
  app: {
    version: "v0.20",
    status: "DEVELOPMENT"        // v0.x = development, v1.x = production
  },

  /* Two creatures, one app. Everything that differs between them lives here:
     the name, the favicon and the voice used by the sound engine. */
  species: {
    unicorn: {
      name: "Aniluna",
      emoji: "\u{1F984}",
      voice: { pitch: 1, wave: "triangle", filter: null, gurgleBase: 150 }
    },
    dinosaur: {
      name: "Anirex",
      emoji: "\u{1F996}",
      voice: { pitch: 0.55, wave: "sawtooth", filter: 1100, gurgleBase: 95 }
    }
  },
  defaultSpecies: "unicorn",

  /* The owner may rename each creature. The cap is what keeps a long name from
     breaking the title, the speech bubble and the meter label; an empty field
     restores the built-in name rather than leaving a hole in every sentence. */
  naming: { maxLength: 24 },

  locales: ["de", "en", "zh"],
  defaultLocale: "de",

  hydration: {
    max: 100,
    initial: 75,                 // first run starts short so a drink is the
                                 // obvious next move and teaches the loop
    defaultDecayHours: 2,        // full to completely empty in two hours
    defaultRefillAmount: 25
  },
  thresholds: {                  // lower bound of each band, descending
    hydrated: 75,
    okay: 45,
    thirsty: 20,
    rainbow: 95                  // reward arc, compared against the displayed percent
  },
  limits: {                      // slider bounds, also used to snap saved values
    decayHours: { min: 0.5, max: 4, step: 0.5 },
    refillAmount: { min: 25, max: 100, step: 25 }
  },
  theme: {
    dayStartHour: 7,             // local hours, used when themeMode is "auto"
    nightStartHour: 19
  },

  /* Sun and moon arcs, in local hours. Each body rises on the left at `rise`,
     is highest at `peak` and sets on the right at `set`. The moon's window

/* ========= STORAGE ========= */
const Storage = {
  /**
   * One-time adoption of a save written under an older key name. Runs before
   * the first read and never overwrites data already at the current key.
   * Returns the key it migrated from, or null if there was nothing to do.
   */
  migrate() {
    try {
      if (localStorage.getItem(Config.storageKey) !== null) return null;
      for (const legacy of Config.legacyKeys) {
        const raw = localStorage.getItem(legacy);
        if (raw === null) continue;
        localStorage.setItem(Config.storageKey, raw);
        localStorage.removeItem(legacy);
        return legacy;
      }
    } catch (err) {
      console.warn("Could not migrate saved state:", err);   // private mode / quota
    }
    return null;
  },

  read() {
    try {
      const raw = localStorage.getItem(Config.storageKey);
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      console.warn("Could not read saved state:", err);
      return null;
    }
  },

  write(state) {
    try {
      localStorage.setItem(Config.storageKey, JSON.stringify(state));
    } catch (err) {
      console.warn("Could not save state:", err);   // private mode / quota
    }
  },

  clear() {
    try {
      localStorage.removeItem(Config.storageKey);
    } catch (err) {
      console.warn("Could not clear state:", err);
    }
  }
};

/* ========= TIME ========= */
const Time = {
  HOUR_MS: 3600000,

  now() {
    return Date.now();
  },

  /** Local calendar day, used for the drinks-today rollover. */
  dayKey(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  },

  /** Fractional local hour, so the sun moves smoothly rather than in steps. */
  hourOfDay(ts = Date.now()) {
    const d = new Date(ts);
    return d.getHours() + d.getMinutes() / 60;
  },

  /** Drives the automatic light and dark switch. */
  isDaytime(ts = Date.now()) {
    const hour = new Date(ts).getHours();
    return hour >= Config.theme.dayStartHour && hour < Config.theme.nightStartHour;
  },

  /**
   * Localised relative time. Intl.RelativeTimeFormat handles the grammar for
   * every locale, so only the sub-minute and never cases need their own copy.
   */
  relative(ts, now, strings) {
    if (!ts) return strings.never;
    const diff = Math.max(0, now - ts);
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return strings.justNow;

    const rtf = new Intl.RelativeTimeFormat(strings.tag, { numeric: "auto" });
    if (mins < 60) return rtf.format(-mins, "minute");
    const hours = Math.floor(mins / 60);
    if (hours < 24) return rtf.format(-hours, "hour");
    return rtf.format(-Math.floor(hours / 24), "day");
  }
};

/* ========= SKY ========= */
const Sky = {
  /**
   * Position of one body on its arc at a given hour, or null when it is not in
   * the sky. Progress runs 0 at rise, 0.5 at peak and 1 at set, interpolated in
   * two halves so an off-centre peak still lands exactly at its stated hour.
   */
  position(arc, hour) {
    let h = hour;
    if (arc.set > 24 && h < arc.rise - 12) h += 24;   // moon, after midnight
    if (h < arc.rise || h > arc.set) return null;

    const progress = h <= arc.peak
      ? 0.5 * (h - arc.rise) / (arc.peak - arc.rise)
      : 0.5 + 0.5 * (h - arc.peak) / (arc.set - arc.peak);

    const { left, right, horizon, apex } = Config.sky;
    return {
      progress,
      x: left + progress * (right - left),
      y: horizon - (horizon - apex) * Math.sin(Math.PI * progress)
    };
  }
};

/* ========= AUDIO ========= */
const Audio_ = {
  ctx: null,
  enabled: true,
  voice: Config.species[Config.defaultSpecies].voice,

  setVoice(voice) {
    this.voice = voice;
  },

  /** Must run inside a user gesture: mobile browsers block audio otherwise. */
  unlock() {
    if (!this.enabled) return;
    try {
      if (!this.ctx) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return;
        this.ctx = new Ctor();
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (err) {
      console.warn("Audio unavailable:", err);
      this.ctx = null;
    }
  },

  ready() {
    return this.enabled && this.ctx && this.ctx.state === "running";
  },

  /** One short synthesised tone with a soft envelope, in the current voice. */
  tone({ freq = 440, to = null, start = 0, dur = 0.16, gain = 0.13, type = null, filter = null }) {
    if (!this.ready()) return;
    const ctx = this.ctx;
    const v = this.voice;
    const t0 = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const amp = ctx.createGain();

    osc.type = type || v.wave;
    osc.frequency.setValueAtTime(freq * v.pitch, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to * v.pitch, t0 + dur);

    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + Math.min(0.03, dur / 3));
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    let node = osc;
    const cutoff = filter || v.filter;
    if (cutoff) {
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = cutoff;
      node.connect(lp);
      node = lp;
    }
    node.connect(amp).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },

  /** Filtered noise burst, the "water" texture of a sip. */
  noise({ start = 0, dur = 0.12, gain = 0.06, freq = 1400 }) {
    if (!this.ready()) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime + start;
    const frames = Math.floor(ctx.sampleRate * dur);
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frames; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;

    const bp = ctx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = freq;
    bp.Q.value = 1.1;

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(gain, t0);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(bp).connect(amp).connect(ctx.destination);
    src.start(t0);
  },

  sip() {
    for (let i = 0; i < 3; i++) {
      const at = i * 0.11;
      this.noise({ start: at, dur: 0.09, gain: 0.05, freq: 1100 + i * 260 });
      this.tone({ freq: 340 + i * 90, to: 620 + i * 110, start: at, dur: 0.09, gain: 0.07 });
    }
  },

  /** Rising arpeggio for the unicorn, a low pleased rumble for the dinosaur. */
  cheer() {
    const notes = [523.25, 659.25, 783.99, 1046.5];   // C E G C
    notes.forEach((f, i) => {
      this.tone({ freq: f, start: i * 0.075, dur: 0.15, gain: 0.09 });
    });
    this.tone({ freq: 1318.5, start: 0.32, dur: 0.22, gain: 0.06 });
    if (this.voice.pitch < 1) {
      this.noise({ start: 0.05, dur: 0.3, gain: 0.035, freq: 420 });   // a bit of roar
    }
  },

  sad() {
    this.tone({ freq: 392, to: 233, dur: 0.5, gain: 0.08, filter: 900 });
  },

  gurgle() {
    const base = this.voice.gurgleBase;
    for (let i = 0; i < 7; i++) {
      const at = i * 0.075;
      const f = base + (i % 3) * 55;
      this.tone({ freq: f * 2.1, to: f, start: at, dur: 0.11, gain: 0.1, filter: 700 });
      this.noise({ start: at + 0.01, dur: 0.06, gain: 0.03, freq: 400 });
    }
  },

  /** Short whoosh when the species changes. */
  morph() {
    this.tone({ freq: 220, to: 880, dur: 0.28, gain: 0.07 });
    this.noise({ start: 0.02, dur: 0.22, gain: 0.04, freq: 900 });
  }
};

/* ========= AMBIENT ========= */
/* Rare decorative life. Each kind schedules itself, spawns one element that
   crosses the scene and removes itself, then schedules the next. Nothing is
   scheduled while the tab is hidden or when reduced motion is requested, so a
   backgrounded page cannot accumulate nodes. */
const Ambient = {
  timers: {},
  host: null,

  KINDS: {
    bird: {
      band: [6, 42],             // vertical band, percent from the top
      size: [6, 11],             // width, percent of the scene
      dur: [9000, 15000],
      opacity: [0.45, 0.7],
      markup: () =>
        '<svg viewBox="0 0 26 10" aria-hidden="true">'
        + '<path d="M1.5 7 Q6 1.5 11.5 6.5"/>'
        + '<path d="M13.5 6.5 Q19.5 1 24.5 7"/>'
        + "</svg>"
    },
    wind: {
      band: [10, 64],            // the whole sky, not just behind the character
      size: [16, 30],            // smaller than before, so it reads as distant
      dur: [8000, 13000],
      opacity: [0.28, 0.5],      // fainter, to keep the scene uncluttered
      markup: () =>
        '<svg viewBox="0 0 64 22" aria-hidden="true">'
        + '<path d="M2 11 q13 -8 26 -1 q11 3 21 -4"/>'
        + '<path d="M9 17.5 q12 -5 23 -0.5"/>'
        + '<path d="M17 5 q9 -3 17 0"/>'
        + "</svg>"
    }
  },

  enabled() {
    return !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  },

  /** Current interval range for a kind, or null if it should not appear now. */
  rateFor(kind) {
    const part = Time.isDaytime() ? "day" : "night";
    return Config.ambient[kind] ? Config.ambient[kind][part] : null;
  },

  between([min, max]) {
    return min + Math.random() * (max - min);
  },

  start(host) {
    this.host = host || this.host;
    Object.keys(this.KINDS).forEach((kind) => this.schedule(kind));
  },

  stop() {
    Object.keys(this.timers).forEach((kind) => clearTimeout(this.timers[kind]));
    this.timers = {};
  },

  /** Re-checks the rate every time, so dusk changes the rhythm on its own. */
  schedule(kind, firstDelay = null) {
    clearTimeout(this.timers[kind]);
    if (!this.enabled()) return;

    const rate = this.rateFor(kind);
    /* Not this time of day: look again later rather than stopping for good. */
    const delay = firstDelay !== null ? firstDelay
                : rate ? this.between(rate)
                : 60000;

    this.timers[kind] = setTimeout(() => {
      if (this.rateFor(kind) && document.visibilityState === "visible") {
        this.spawn(kind);
      }
      this.schedule(kind);
    }, delay);
  },

  spawn(kind) {
    if (!this.host || !this.enabled()) return;
    const spec = this.KINDS[kind];

    const el = document.createElement("div");
    el.className = `amb ${kind}`;
    /* Every appearance picks its own direction, both kinds alike. */
    if (Math.random() < 0.5) el.classList.add("rtl");
    el.style.top = `${this.between(spec.band)}%`;
    el.style.width = `${this.between(spec.size)}%`;
    el.style.setProperty("--dur", `${Math.round(this.between(spec.dur))}ms`);
    el.style.setProperty("--amb-op", this.between(spec.opacity).toFixed(2));

    const flip = document.createElement("span");
    flip.className = "amb-flip";
    const bob = document.createElement("span");
    bob.className = "amb-bob";
    bob.style.setProperty("--bob", `${(2.6 + Math.random() * 2).toFixed(2)}s`);
    if (kind === "bird") {
      bob.style.setProperty("--flap", `${(0.5 + Math.random() * 0.4).toFixed(2)}s`);
    }
    bob.innerHTML = spec.markup();

    flip.appendChild(bob);
    el.appendChild(flip);
    el.addEventListener("animationend", (e) => {
      if (e.target === el) el.remove();
    });
    this.host.appendChild(el);
    return el;
  }
};

/* ========= STATE ========= */
const State = {
  data: null,

  defaults() {
    const now = Time.now();
    return {
      hydration: Config.hydration.initial,
      lastUpdateAt: now,
      lastDrinkAt: null,
      todayCount: 0,
      dayKey: Time.dayKey(now),
      decayHours: Config.hydration.defaultDecayHours,
      refillAmount: Config.hydration.defaultRefillAmount,
      soundOn: true,
      easterEggOn: true,
      themeMode: "auto",              // "auto" | "day" | "night"
      species: Config.defaultSpecies,
      names: {},                      // species key -> owner's name, if any
      locale: Config.defaultLocale,
      tapHistory: []
    };
  },

  /**
   * Number coercion that treats null, undefined and "" as absent rather than
   * as zero, which is what Number() would do.
   */
  num(value, fallback) {
    if (value === null || value === undefined || value === "") return fallback;
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  },

  /** Clamp into range and snap onto the slider step, tolerating junk input. */
  clampStep(value, fallback, { min, max, step }) {
    const n = this.num(value, null);
    if (n === null) return fallback;
    const clamped = Math.min(max, Math.max(min, n));
    const snapped = min + Math.round((clamped - min) / step) * step;
    return Math.round(snapped * 100) / 100;      // drop floating point dust
  },

  /**
   * Trim, collapse inner runs of whitespace, cap at the configured length.
   * Returns "" for anything absent or not a string, which is what the callers
   * read as "no custom name".
   */
  cleanName(value) {
    if (typeof value !== "string") return "";
    /* Cap by code point rather than by UTF-16 unit: slicing mid-surrogate
       would leave half an emoji behind. Only a hand-edited save can reach
       that, since the input caps the field itself, but it renders as a
       replacement glyph when it does. */
    const clean = value.trim().replace(/\s+/g, " ");
    return Array.from(clean).slice(0, Config.naming.maxLength).join("");
  },

  /**
   * Custom names are held per species, so each creature keeps its own. Keys
   * outside Config.species and values that clean to nothing are dropped rather
   * than repaired, so a junk save falls back to the built-in names.
   */
  cleanNames(value) {
    const out = {};
    if (!value || typeof value !== "object") return out;
    Object.keys(Config.species).forEach((key) => {
      const clean = this.cleanName(value[key]);
      if (clean) out[key] = clean;
    });
    return out;
  },

  oneOf(value, allowed, fallback) {
    return allowed.includes(value) ? value : fallback;
  },

  /** Merge saved data over defaults so old or partial saves never break startup. */
  load() {
    const base = this.defaults();
    const saved = Storage.read();
    if (!saved || typeof saved !== "object") {
      this.data = base;
      return this.data;
    }
    const now = Time.now();

    /* Saves written before v0.15 carry `theme` instead of `themeMode`. Treat
       the old value as an explicit choice rather than discarding it. */
    const legacyTheme = this.oneOf(saved.theme, ["day", "night"], null);

    this.data = {
      ...base,
      ...saved,
      hydration: Math.min(
        Config.hydration.max,
        Math.max(0, this.num(saved.hydration, base.hydration))
      ),
      lastUpdateAt: this.num(saved.lastUpdateAt, now),
      lastDrinkAt: this.num(saved.lastDrinkAt, null),
      todayCount: Math.max(0, Math.round(this.num(saved.todayCount, 0))),
      dayKey: typeof saved.dayKey === "string" ? saved.dayKey : base.dayKey,
      decayHours: this.clampStep(saved.decayHours, base.decayHours, Config.limits.decayHours),
      refillAmount: this.clampStep(saved.refillAmount, base.refillAmount, Config.limits.refillAmount),
      soundOn: saved.soundOn !== false,
      easterEggOn: saved.easterEggOn !== false,
      themeMode: this.oneOf(saved.themeMode, ["auto", "day", "night"], legacyTheme || base.themeMode),
      species: this.oneOf(saved.species, Object.keys(Config.species), base.species),
      names: this.cleanNames(saved.names),
      locale: this.oneOf(saved.locale, Config.locales, base.locale),
      tapHistory: Array.isArray(saved.tapHistory) ? saved.tapHistory.filter(Number.isFinite) : []
    };
    delete this.data.theme;
    return this.data;
  },

  save() {
    Storage.write(this.data);
  },

  /**
   * Timestamp-driven decay. This, not any interval, is the source of truth,
   * so closing the tab, sleeping the phone or killing the browser all work out.
   * Returns how many points were lost since the last sync.
   */
  sync(now = Time.now()) {
    const s = this.data;
    const elapsed = Math.max(0, now - s.lastUpdateAt);
    const perMs = Config.hydration.max / (s.decayHours * Time.HOUR_MS);
    const lost = elapsed * perMs;

    s.hydration = Math.max(0, s.hydration - lost);
    s.lastUpdateAt = now;
    this.rollDay(now);
    return lost;
  },

  rollDay(now) {
    const key = Time.dayKey(now);
    if (key !== this.data.dayKey) {
      this.data.dayKey = key;
      this.data.todayCount = 0;
    }
  },

  /**
   * Bands are compared against the rounded percent, the same number the meter
   * shows. Comparing the raw float instead lets a meter reading exactly 75%
   * sit in the okay band, because the underlying value is 74.997.
   */
  band(hydration = this.data.hydration) {
    const pct = Math.round(hydration);
    const t = Config.thresholds;
    if (pct >= t.hydrated) return "hydrated";
    if (pct >= t.okay) return "okay";
    if (pct >= t.thirsty) return "thirsty";
    return "dehydrated";
  },

  /** Higher index = worse. Used to detect mood improvements. */
  bandRank(band) {
    return BANDS.indexOf(band);
  },

  drink(now = Time.now()) {
    const before = this.band();
    this.sync(now);

    const s = this.data;
    s.hydration = Math.min(Config.hydration.max, s.hydration + s.refillAmount);
    s.lastDrinkAt = now;
    s.todayCount += 1;

    const burst = this.registerTap(now);
    const after = this.band();

    this.save();
    return { before, after, improved: this.bandRank(after) < this.bandRank(before), burst };
  },

  /** Five taps inside a rolling five-second window trigger the easter egg. */
  registerTap(now) {
    const s = this.data;
    s.tapHistory = s.tapHistory.filter((ts) => now - ts <= Config.burst.windowMs);
    s.tapHistory.push(now);
    const triggered = s.easterEggOn && s.tapHistory.length >= Config.burst.taps;
    if (triggered) s.tapHistory = [];
    return triggered;
  },

  reset(now = Time.now()) {
    const s = this.data;
    s.hydration = Config.hydration.max;
    s.todayCount = 0;
    s.tapHistory = [];
    s.lastUpdateAt = now;
    s.lastDrinkAt = now;
    s.dayKey = Time.dayKey(now);
    this.save();
  },

  /**
   * Rename the creature currently on screen. An empty entry deletes the
   * override instead of storing a blank, which is what restores the built-in
   * name. Returns the name that was actually kept.
   */
  setName(raw) {
    const clean = this.cleanName(raw);
    const names = { ...this.data.names };
    if (clean) names[this.data.species] = clean;
    else delete names[this.data.species];
    this.set({ names });
    return clean;
  },

  /** Flip between the two creatures. Returns the new species key. */
  toggleSpecies() {
    const keys = Object.keys(Config.species);
    const next = keys[(keys.indexOf(this.data.species) + 1) % keys.length];
    this.set({ species: next });
    return next;
  },

  set(patch) {
    Object.assign(this.data, patch);
    this.save();
  }
};

/* ========= UI ========= */
const UI = {
  el: {},
  lastBand: null,
  speechLock: 0,

  cache() {
    const ids = [
      "appTitle", "infoBtn", "infoCard", "infoBody", "infoTip", "themeBtn", "soundBtn",
      "scene", "sceneCaption", "speech", "drops",
      "meterHeading", "meterValue", "meterBar", "meterFill", "meterLabel", "moodLine",
      "statCountLabel", "statCount", "statLastLabel", "statLast",
      "drinkBtn", "resetBtn", "settings", "settingsSummary", "langLabel",
      "langDe", "langEn", "langZh",
      "decayInput", "decayOut", "decayScale", "decayLabel",
      "refillInput", "refillOut", "refillScale", "refillLabel",
      "soundInput", "soundLabel", "eggInput", "eggLabel",
      "autoThemeInput", "autoThemeLabel", "themeInput", "themeLabel",
      "settingsFoot", "note", "secretBtn", "favicon", "sun", "moon", "ambient",
      "nameLabel", "nameInput"
    ];
    ids.forEach((id) => { this.el[id] = document.getElementById(id); });
  },

  /** Current locale strings. */
  t() {
    return Strings[State.data.locale] || Strings[Config.defaultLocale];
  },

  species() {
    return Config.species[State.data.species];
  },

  /** The name in use: the owner's for this creature, else the built-in one. */
  name() {
    return State.data.names[State.data.species] || this.species().name;
  },

  /**
   * One string, two consumers: the accessible name and the hover tooltip.
   * Writing both from one call is what stops the visible label and the
   * spoken one from drifting apart as the copy changes.
   */
  label(el, text) {
    el.setAttribute("aria-label", text);
    el.dataset.tip = text;
  },

  pick(list) {
    return list[Math.floor(Math.random() * list.length)];
  },

  /** Every user-facing string is written here, from Strings plus Config. */
  applyText() {
    const t = this.t();
    const sp = this.species();
    const name = this.name();

    document.documentElement.lang = t.tag;      // zh-TW, not zh
    document.title = `${name} ${t.titleSuffix}`;
    this.el.appTitle.textContent = `${name} ${t.titleSuffix}`;
    this.el.sceneCaption.textContent = t.caption(name, t.speciesWord[State.data.species]);

    this.el.meterHeading.textContent = t.meter;
    this.el.meterLabel.textContent = t.meterAria(name);

    this.el.drinkBtn.textContent = t.drink;
    this.el.drinkBtn.setAttribute("aria-label", t.drinkAria(name));
    this.el.resetBtn.textContent = t.reset;
    this.el.resetBtn.setAttribute("aria-label", t.resetAria(name));

    this.el.statCountLabel.textContent = t.drinksToday;
    this.el.statLastLabel.textContent = t.lastDrink;

    this.el.settingsSummary.textContent = t.settings;
    this.el.nameLabel.textContent = t.nameSetting;
    this.el.nameInput.placeholder = sp.name;      // the built-in name, as the way back
    this.el.langLabel.textContent = t.language;
    this.el.decayLabel.textContent = t.fullToEmpty;
    this.el.refillLabel.textContent = t.refill;
    this.el.soundLabel.textContent = t.sound;
    this.el.eggLabel.textContent = t.egg;
    this.el.autoThemeLabel.textContent = t.autoTheme;
    this.el.themeLabel.textContent = t.nightTheme;
    this.el.settingsFoot.textContent = t.settingsFoot(name);

    this.el.note.textContent = t.note(Config.app.version);
    this.label(this.el.infoBtn, t.infoAria);
    this.el.infoBody.textContent = t.infoBody(name);
    this.el.infoTip.textContent = t.infoTip;
    this.label(this.el.secretBtn, t.secretAria);

    Config.locales.forEach((loc) => {
      const btn = this.el["lang" + loc[0].toUpperCase() + loc.slice(1)];
      if (btn) btn.setAttribute("aria-pressed", String(loc === State.data.locale));
    });

    this.applyTheme();
    this.applySound();
    this.renderSettingsValues();
  },

  /** Species affects the sprite shown, the favicon and the sound voice. */
  applySpecies() {
    const sp = this.species();
    this.el.scene.dataset.species = State.data.species;
    Audio_.setVoice(sp.voice);
    this.el.favicon.href =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'"
      + "%3E%3Ctext x='50' y='50' dy='.35em' font-size='84' text-anchor='middle'%3E"
      + encodeURIComponent(sp.emoji) + "%3C/text%3E%3C/svg%3E";
  },

  /** Slider bounds and their tick labels both come from Config. */
  applyLimits() {
    const locale = Strings[State.data.locale].tag;
    this.el.nameInput.maxLength = Config.naming.maxLength;
    const apply = (input, scale, limit, format) => {
      input.min = limit.min;
      input.max = limit.max;
      input.step = limit.step;

      const stops = [];
      for (let v = limit.min; v <= limit.max + 1e-9; v += limit.step) {
        stops.push(Math.round(v * 100) / 100);
      }
      /* Label every stop when there are few of them, otherwise just the ends. */
      const shown = stops.length > 4 ? [stops[0], stops[stops.length - 1]] : stops;
      scale.textContent = "";
      shown.forEach((v) => {
        const span = document.createElement("span");
        span.textContent = format(v);
        scale.appendChild(span);
      });
    };
    apply(this.el.decayInput, this.el.decayScale, Config.limits.decayHours,
          (v) => v.toLocaleString(locale, { minimumFractionDigits: 1 }));
    apply(this.el.refillInput, this.el.refillScale, Config.limits.refillAmount,
          (v) => `${v.toLocaleString(locale)}%`);
  },

  /** Reads straight from the inputs so the labels track a finger mid-drag. */
  renderSettingsValues() {
    const t = this.t();
    this.el.decayOut.textContent = t.hours(Number(this.el.decayInput.value), t.tag);
    this.el.refillOut.textContent = `${Number(this.el.refillInput.value).toLocaleString(t.tag)}%`;
  },

  /** Speech changes on events and band changes, not on every clock refresh. */
  say(text, lockMs = 2600) {
    this.el.speech.textContent = text;
    this.el.speech.style.animation = "none";
    void this.el.speech.offsetWidth;          // restart the pop animation
    this.el.speech.style.animation = "";
    this.speechLock = Time.now() + lockMs;
  },

  bandSpeech(band = State.band()) {
    return this.pick(this.t().speech[State.data.species][band]);
  },

  render() {
    const s = State.data;
    const t = this.t();
    const now = Time.now();
    const pct = Math.round(s.hydration);
    const band = State.band();

    this.el.scene.dataset.band = band;
    this.el.scene.dataset.radiant = pct >= Config.thresholds.rainbow ? "on" : "off";
    this.el.meterFill.style.width = `${pct}%`;
    this.el.meterValue.textContent = `${pct.toLocaleString(t.tag)}%`;
    this.el.meterBar.setAttribute("aria-valuenow", String(pct));
    this.el.meterBar.setAttribute("aria-valuetext", `${pct}%, ${t.mood[band]}`);
    this.el.moodLine.textContent = t.mood[band];
    this.el.statCount.textContent = s.todayCount.toLocaleString(t.tag);
    this.el.statLast.textContent = Time.relative(s.lastDrinkAt, now, t);

    if (band !== this.lastBand && now >= this.speechLock) {
      this.say(this.bandSpeech(band), 1200);
    }
    this.lastBand = band;
  },

  /** Resolves themeMode against the clock, so "auto" follows the time of day. */
  effectiveTheme() {
    const mode = State.data.themeMode;
    if (mode === "day" || mode === "night") return mode;
    return Time.isDaytime() ? "day" : "night";
  },

  /**
   * Puts the sun and the moon where the clock says they are, and hides the one
   * that would contradict the sky it sits in. Without the theme gate an
   * explicit night override in the afternoon paints a dark sky, stars and a
   * lit sun all at once, since the arcs know only the clock. Forcing night
   * before the moon's rise hour therefore leaves an empty sky, which is
   * honest: feeding the arc a substitute hour would put the moon somewhere the
   * clock never says it is.
   */
  applySky(theme = this.effectiveTheme()) {
    const hour = Time.hourOfDay();
    const inSky = { sun: theme === "day", moon: theme === "night" };
    [["sun", Config.sky.sun], ["moon", Config.sky.moon]].forEach(([key, arc]) => {
      const el = this.el[key];
      const at = inSky[key] ? Sky.position(arc, hour) : null;
      if (!at) {
        el.dataset.visible = "no";
        return;
      }
      el.style.left = `${at.x}%`;
      el.style.top = `${at.y}%`;
      el.dataset.visible = "yes";
    });
  },

  applyTheme() {
    const t = this.t();
    const theme = this.effectiveTheme();
    const night = theme === "night";

    document.documentElement.dataset.theme = theme;
    this.el.themeBtn.textContent = night ? "☀️" : "\u{1F319}";
    this.label(this.el.themeBtn, night ? t.themeToDay : t.themeToNight);
    this.el.themeInput.checked = night;
    this.el.autoThemeInput.checked = State.data.themeMode === "auto";
    this.applySky(theme);     // rides the same ticker as the theme
  },

  applySound() {
    const t = this.t();
    const on = State.data.soundOn;
    this.el.soundBtn.textContent = on ? "\u{1F514}" : "\u{1F515}";
    this.el.soundBtn.setAttribute("aria-pressed", String(on));
    this.label(this.el.soundBtn, on ? t.soundOn : t.soundOff);
    this.el.soundInput.checked = on;
  },

  syncSettingsInputs() {
    const s = State.data;
    this.el.nameInput.value = s.names[s.species] || "";
    this.el.decayInput.value = s.decayHours;
    this.el.refillInput.value = s.refillAmount;
    this.el.eggInput.checked = s.easterEggOn;
    this.renderSettingsValues();
    this.applySound();
    this.applyTheme();
  },

  toggleInfo(force) {
    const open = force !== undefined ? force : this.el.infoCard.hidden;
    this.el.infoCard.hidden = !open;
    this.el.infoBtn.setAttribute("aria-expanded", String(open));
  },

  flash(className, ms) {
    this.el.scene.classList.remove(className);
    void this.el.scene.offsetWidth;
    this.el.scene.classList.add(className);
    setTimeout(() => this.el.scene.classList.remove(className), ms);
  },

  droplets(count = 3) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < count; i++) {
      const drop = document.createElement("span");
      drop.className = "drop";
      drop.textContent = "\u{1F4A7}";
      drop.style.setProperty("--dx", `${(i - (count - 1) / 2) * 26}px`);
      drop.style.animationDelay = `${i * 0.09}s`;
      this.el.drops.appendChild(drop);
      setTimeout(() => drop.remove(), 1400);
    }
  }
};

/* ========= EVENTS ========= */
const Events = {
  refreshTimer: null,

  bind() {
    UI.el.drinkBtn.addEventListener("click", () => this.onDrink());
    UI.el.resetBtn.addEventListener("click", () => this.onReset());
    UI.el.secretBtn.addEventListener("click", () => this.onSecret());
    UI.el.infoBtn.addEventListener("click", () => UI.toggleInfo());

    /* The top bar button sets an explicit choice, which turns auto off. */
    UI.el.themeBtn.addEventListener("click", () => {
      State.set({ themeMode: UI.effectiveTheme() === "night" ? "day" : "night" });
      UI.applyTheme();
    });
    UI.el.themeInput.addEventListener("change", (e) => {
      State.set({ themeMode: e.target.checked ? "night" : "day" });
      UI.applyTheme();
    });
    UI.el.autoThemeInput.addEventListener("change", (e) => {
      State.set({ themeMode: e.target.checked ? "auto" : UI.effectiveTheme() });
      UI.applyTheme();
    });

    UI.el.soundBtn.addEventListener("click", () => this.setSound(!State.data.soundOn));
    UI.el.soundInput.addEventListener("change", (e) => this.setSound(e.target.checked));

    UI.el.eggInput.addEventListener("change", (e) => {
      State.set({ easterEggOn: e.target.checked, tapHistory: [] });
    });

    Config.locales.forEach((loc) => {
      const btn = UI.el["lang" + loc[0].toUpperCase() + loc.slice(1)];
      if (btn) btn.addEventListener("click", () => this.setLocale(loc));
    });

    /* Commit on change, which is blur or Enter, rather than on every
       keystroke: a half-typed name has no business in the title, the speech
       bubble and four ARIA labels. */
    UI.el.nameInput.addEventListener("change", (e) => {
      const kept = State.setName(e.target.value);
      e.target.value = kept;        // show what survived trimming and the cap
      UI.applyText();
      UI.render();
      UI.say(UI.t().renamed(UI.name()), 2200);
    });

    UI.el.decayInput.addEventListener("input", () => UI.renderSettingsValues());
    UI.el.decayInput.addEventListener("change", (e) => {
      State.sync();          // bill the time already elapsed at the old rate
      const hours = State.clampStep(e.target.value, State.data.decayHours, Config.limits.decayHours);
      State.set({ decayHours: hours });
      e.target.value = hours;
      UI.renderSettingsValues();
      UI.render();
    });

    UI.el.refillInput.addEventListener("input", () => UI.renderSettingsValues());
    UI.el.refillInput.addEventListener("change", (e) => {
      const amount = State.clampStep(e.target.value, State.data.refillAmount, Config.limits.refillAmount);
      State.set({ refillAmount: amount });
      e.target.value = amount;
      UI.renderSettingsValues();
    });

    /* Lifecycle: visibilitychange + pagehide are the signals we can rely on
       in mobile browsers. beforeunload/unload often never fire there. */
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        this.onReturn();
      } else {
        State.sync();
        State.save();
        this.stopRefresh();
        Ambient.stop();
      }
    });
    window.addEventListener("pagehide", () => {
      State.sync();
      State.save();
      this.stopRefresh();
      Ambient.stop();
    });

    /* First gesture anywhere unlocks audio, so the very first drink has sound. */
    const unlockOnce = () => {
      Audio_.unlock();
      window.removeEventListener("pointerdown", unlockOnce);
      window.removeEventListener("keydown", unlockOnce);
    };
    window.addEventListener("pointerdown", unlockOnce);
    window.addEventListener("keydown", unlockOnce);
  },

  setSound(on) {
    State.set({ soundOn: on });
    Audio_.enabled = on;
    if (on) Audio_.unlock();
    UI.applySound();
  },

  setLocale(locale) {
    if (!Config.locales.includes(locale) || locale === State.data.locale) return;
    State.set({ locale });
    UI.applyText();
    UI.applyLimits();
    UI.say(UI.bandSpeech(), 1500);
    UI.render();
  },

  /** The almost hidden switch: become the other creature. */
  onSecret() {
    Audio_.unlock();
    State.toggleSpecies();
    UI.applySpecies();
    UI.applyText();
    UI.syncSettingsInputs();       // the name field belongs to the new creature
    UI.render();
    UI.flash("is-morphing", Config.ui.morphFeedbackMs);
    UI.say(UI.t().morph(UI.name()), 2600);
    Audio_.morph();
  },

  onDrink() {
    Audio_.unlock();
    const result = State.drink();
    UI.render();
    UI.droplets(result.burst ? 6 : 3);

    if (result.burst) {
      UI.say(UI.pick(UI.t().gurgle));
      UI.flash("is-gurgling", Config.ui.gurgleFeedbackMs);
      Audio_.gurgle();
      return;
    }

    UI.flash("is-sipping", Config.ui.sipFeedbackMs);
    Audio_.sip();

    if (result.improved) {
      UI.say(UI.pick(UI.t().cheer));
      setTimeout(() => Audio_.cheer(), 260);
    } else {
      UI.say(UI.pick(UI.t().sip));
    }
  },

  onReset() {
    if (!window.confirm(UI.t().resetConfirm(UI.name()))) return;
    State.reset();
    UI.lastBand = null;
    UI.render();
    UI.say(UI.bandSpeech());
  },

  /** Page became visible again: re-derive state from the clock. */
  onReturn() {
    const before = State.band();
    const lost = State.sync();
    State.save();
    UI.applyTheme();          // the clock may have crossed dawn or dusk
    UI.render();
    this.startRefresh();
    Ambient.start();

    const after = State.band();
    if (lost > 1 && after !== before && State.bandRank(after) > State.bandRank(before)) {
      UI.say(UI.bandSpeech(after), 3200);
      /* Visual feedback first on return. No sound unless a gesture already
         unlocked the audio context, and never loud on arrival. */
      if (after === "dehydrated" && Audio_.ready()) Audio_.sad();
    }
  },

  /** UI-only ticker for the relative-time label and the clock theme. */
  startRefresh() {
    this.stopRefresh();
    this.refreshTimer = setInterval(() => {
      State.sync();
      UI.applyTheme();
      UI.render();
    }, Config.ui.refreshMs);
  },

  stopRefresh() {
    if (this.refreshTimer) {
      clearInterval(this.refreshTimer);
      this.refreshTimer = null;
    }
  }
};

/* ========= INIT ========= */
function init() {
  UI.cache();

  const migratedFrom = Storage.migrate();
  State.load();
  State.sync();
  State.save();

  Audio_.enabled = State.data.soundOn;

  UI.applySpecies();
  UI.applyLimits();
  UI.syncSettingsInputs();
  UI.applyText();
  UI.render();
  UI.say(UI.bandSpeech(), 1500);

  Events.bind();
  Events.startRefresh();
  Ambient.start(UI.el.ambient);

  /* The browser console stands in for a shell banner, so the running version
     is always identifiable without reading the source. */
  console.log(`${UI.name()} Aqua Buddy ${Config.app.version} - ${Config.app.status}`);
  if (migratedFrom) {
    console.log(`Adopted saved state from the old key "${migratedFrom}".`);
  }
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
